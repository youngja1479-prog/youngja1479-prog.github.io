<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outline transparent canvas regression</title>
<style>body{font:15px system-ui;background:#e8e4dc;color:#222;margin:16px}button{padding:12px;margin:4px}.row{display:flex;gap:18px;flex-wrap:wrap}.frame{overflow:auto;width:430px;height:490px;border:1px solid #aaa}.sizer{position:relative}.paper{position:relative;background:#fffef8;width:720px;height:1200px;transform-origin:0 0}.paper canvas{position:absolute;inset:0;width:720px;height:1200px}.paper .ink{z-index:1;background:transparent}pre{white-space:pre-wrap}h2{font-size:16px}</style>
<h1>검은 종이 진단 — 합성 필기만</h1><p>실제 노트·저장소·계정에 접근하지 않습니다. 왼쪽은 수정한 일반 투명 캔버스, 오른쪽은 이전 가속 옵션 비교입니다. 왼쪽 종이는 밝은 크림색이고 지우개 부분도 크림색이어야 합니다.</p>
<div id="controls"><button data-zoom=".37">37%</button><button data-zoom="1">100%</button><button data-zoom="1.14">114%</button><button id="scroll">스크롤 위치 0 / 72,000</button><button id="style">줄 / 격자 / 무지</button><button id="repeat">20회 재그리기</button></div>
<div class="row"><section><h2>수정: 일반 투명 Canvas2D</h2><div class="frame"><div class="sizer"><div class="paper" id="safe"><canvas class="bg" width="1440" height="2400"></canvas><canvas class="ink" width="1440" height="2400"></canvas></div></div></div></section><section><h2>비교: 이전 desynchronized + self-copy</h2><div class="frame"><div class="sizer"><div class="paper" id="old"><canvas class="bg" width="1440" height="2400"></canvas><canvas class="ink" width="1440" height="2400"></canvas></div></div></div></section></div><pre id="result">로딩…</pre>
<script>
(async()=>{
const source=(await(await fetch('../index.html',{cache:'no-store'})).text()).match(/<script>([\s\S]*?)<\/script>/)[1];
function fn(name){const a=source.indexOf('function '+name+'('),b=source.indexOf('\n}',a);return source.slice(a,b+2);}
let zoom=.37,offset=0,bg='lined';const methods=['getInkCtx','drawBackground','strokeLineWidth','segWidth','drawPressureStroke','drawStroke'];const state={bg};
const variants=['safe','old'].map(id=>{
 const paper=document.getElementById(id),ink=paper.querySelector('.ink'),back=paper.querySelector('.bg');
 let code=methods.map(fn).join('\n');if(id==='old')code=code.replace('{ alpha: true }','{ alpha: true, desynchronized: true }');
 const render=new Function('canvas','state','CSS_W','CSS_H',`let inkCtxCache=null,inkCtxCanvas=null;${code};return {getInkCtx,drawBackground,drawStroke};`)(()=>ink,state,720,120000);
 return {id,paper,ink,back,render};
});
function paint(){state.bg=bg;const info=[];for(const v of variants){v.paper.style.transform=`scale(${zoom})`;const s=v.paper.parentNode;s.style.width=720*zoom+'px';s.style.height=1200*zoom+'px';const b=v.back.getContext('2d'),i=v.render.getInkCtx();for(const c of [b,i]){c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-over';c.clearRect(0,0,1440,2400);c.setTransform(2,0,0,2,0,-offset*2);}v.render.drawBackground(b,{x:0,y:offset,w:720,h:1200});
 const stroke=(tool,color,width,p)=>v.render.drawStroke(i,{tool,color,width,points:p.map(([x,y])=>({x,y:y+offset,p:.5}))});
 stroke('pen','#2563eb',10,[[80,150],[200,160],[350,130],[550,180]]);stroke('highlighter','#fef08a',20,[[80,260],[550,260]]);stroke('pen','#111111',20,[[80,360],[550,360]]);stroke('eraser','#000',25,[[300,300],[300,420]]);
 if(v.id==='old'){i.save();i.setTransform(1,0,0,1,0,0);i.globalCompositeOperation='copy';i.drawImage(v.ink,0,-20);i.restore();}
 const p=i.getImageData(1200,1200,1,1).data;info.push(`${v.id}: ${JSON.stringify(i.getContextAttributes?.()||{})}; empty ink pixel RGBA ${Array.from(p)}; zoom ${zoom*100}%; offset ${offset}`);
}document.getElementById('result').textContent=info.join('\n')+'\nSynthetic fixture only. A browser screenshot is required to check the actual compositor.';}
paint();document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{zoom=+b.dataset.zoom;paint();});document.getElementById('scroll').onclick=()=>{offset=offset?0:72000;paint();};document.getElementById('style').onclick=()=>{bg=['lined','grid','blank'][(['lined','grid','blank'].indexOf(bg)+1)%3];paint();};document.getElementById('repeat').onclick=async()=>{for(let i=0;i<20;i++){paint();await new Promise(requestAnimationFrame);}};
})().catch(e=>document.getElementById('result').textContent=e.stack||e.message);
</script>
