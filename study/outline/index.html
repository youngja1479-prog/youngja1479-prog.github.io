    o.t = ta.value.slice(0, 5000); touchNote(o);
  });
  ta.addEventListener('blur', () => { setTimeout(renderNotes, 0); });
}
function drawNotesOnCtx(ctx) {
  getNotes().forEach(o => {
    ctx.save();
    ctx.fillStyle = o.c || NOTE_COLORS[0];
    if (o.f) { ctx.fillRect(o.x, o.y, 40, 40); ctx.restore(); return; }
    ctx.fillRect(o.x, o.y, o.w || 200, o.h || 150);
    ctx.fillStyle = '#222'; ctx.font = '15px sans-serif'; ctx.textBaseline = 'top';
    const maxW = (o.w || 200) - 16; let y = o.y + 36;
    String(o.t || '').split('\n').forEach(par => {
      let line = '';
      for (const ch of par) {
        if (ctx.measureText(line + ch).width > maxW && line) { if (y < o.y + (o.h || 150) - 18) ctx.fillText(line, o.x + 8, y); y += 21; line = ch; }
        else line += ch;
      }
      if (y < o.y + (o.h || 150) - 18) ctx.fillText(line, o.x + 8, y); y += 21;
    });
    if ((o.k || []).length) {   // note ink on its own canvas so its eraser strokes only erase note ink
      const w = o.w || 200, h = Math.max(1, (o.h || 150) - 30), off = document.createElement('canvas');
      off.width = w * 2; off.height = h * 2;
      const oc = off.getContext('2d'); oc.scale(2, 2);
      o.k.forEach(st => drawStroke(oc, st));
      ctx.drawImage(off, o.x, o.y + 30, w, h);
      if (typeof freeCanvas === 'function') freeCanvas(off);
    }
    ctx.restore();
  });
}

/* ========== 종이 추가 / 삭제 ========== */
const SHEET_H = 1200;
function addSheet() {
  const sebu = getSebu(); if (!sebu) return;
  sebu.pageHeight = (sebu.pageHeight || 1200) + SHEET_H;
  CSS_H = sebu.pageHeight;
  scheduleSave(); resizeCanvas(); redrawAll(); updateGuideOverlay(); renderTextLayer(); renderImages();
  wrap().scrollTop = wrap().scrollHeight;
  toast('종이를 한 장 추가했습니다');
}
function removeSheet() {
  const sebu = getSebu(); if (!sebu) return;
  const h = sebu.pageHeight || 1200;
  if (h - SHEET_H < 1200) { toast('더 지울 종이가 없습니다'); return; }
  const cut = h - SHEET_H;
  const used = getStrokes().some(st => st.tool !== 'eraser' && st.points.some(p => p.y > cut)) ||
    getTexts().some(t => (t.y || 0) + (t.h || 0) > cut) ||
    getImages().some(o => o.y + o.h > cut) ||
    getNotes().some(o => o.y + (o.f ? 40 : (o.h || 150)) > cut);
  if (used) { toast('마지막 종이가 비어 있지 않아 지울 수 없습니다'); return; }
  sebu.pageHeight = cut; CSS_H = cut;
  scheduleSave(); resizeCanvas(); redrawAll(); updateGuideOverlay(); renderTextLayer(); renderImages();
  toast('마지막 종이를 지웠습니다');
}

function extendPage() {
  const sebu = getSebu();
  if (!sebu) return;
  sebu.pageHeight = (sebu.pageHeight || 1200) + 600;
  CSS_H = sebu.pageHeight;
  scheduleSave();
  resizeCanvas();
  redrawAll();
  updateGuideOverlay();
  renderTextLayer();
  // scroll to new area
  wrap().scrollTop = wrap().scrollHeight;
  toast('페이지를 늘렸습니다');
}

function exportPng() {
  // Render full page into temporary canvases at a capped scale, then free them
  const sc = Math.max(0.5, Math.min(2, Math.sqrt(8e6 / (CSS_W * CSS_H))));
  const W = Math.floor(CSS_W * sc), H = Math.floor(CSS_H * sc);
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const ink = document.createElement('canvas'); ink.width = W; ink.height = H;
  const ctx = out.getContext('2d'); ctx.setTransform(sc, 0, 0, sc, 0, 0);
  const ix = ink.getContext('2d'); ix.setTransform(sc, 0, 0, sc, 0, 0);
  try {
    drawBackground(ctx);
    getImages().forEach(o => {
      const el = $(`.img-item[data-id="${o.id}"] img`);
      try { if (el && el.complete) ctx.drawImage(el, o.x, o.y, o.w, o.h); } catch (_) {}
    });
    getStrokes().forEach(st => drawStroke(ix, st));
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(ink, 0, 0); ctx.setTransform(sc, 0, 0, sc, 0, 0);
    freeCanvas(ink);
    drawTextsOnCtx(ctx);
    drawNotesOnCtx(ctx);
    const sebu = getSebu();
    out.toBlob((blob) => {
      freeCanvas(out);
      if (!blob) { toast('PNG 저장 실패'); return; }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = (sebu ? sebu.title : 'page') + '.png';
      link.href = url; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('PNG 저장');
    }, 'image/png');
  } catch (e) { freeCanvas(ink); freeCanvas(out); toast('PNG 저장 실패'); }
}

/* ========== Export / Import ========== */
async function exportBackup() {
  await flushSave();
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gkc-notes-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('백업 파일을 저장했습니다');
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.notebooks)) throw new Error('형식 오류');
      openModal(`
        <h3>백업 가져오기</h3>
        <p style="font-size:14px;color:var(--text2);margin-bottom:16px">
          노트 ${d.notebooks.length}개가 들어 있습니다.<br>
          현재 데이터를 덮어쓸까요?
        </p>
        <div class="modal-actions">
          <button class="btn ghost" id="m-cancel">취소</button>
          <button class="btn primary" id="m-ok">가져오기</button>
        </div>`);
      $('#m-cancel').onclick = closeModal;
      $('#m-ok').onclick = () => {
        DATA = d;
        DATA.version = 1;
        scheduleSave();
        closeModal();
        goHome();
        toast('가져오기 완료');
      };
    } catch (err) {
      toast('파일을 읽을 수 없습니다');
    }
  };
  reader.readAsText(file);
}

/* ========== Event wiring ========== */
function wireEvents() {
  $('#btn-new-nb').addEventListener('click', openNewNbModal);
  $('#btn-new-subj').addEventListener('click', () => openSubjModal('subj', 'add'));
  $('#btn-new-level').addEventListener('click', () => openSubjModal('lvl', 'add'));
  $('#btn-back-levels').addEventListener('click', goHome);
  $('#btn-back-cats').addEventListener('click', () => goLevels(state.subjId));
  $('#btn-back-home').addEventListener('click', () => { const nb = getNb(); if (nb) { const p = nbPlace(nb); goCats(p.s, p.l); } else goHome(); });
  $('#btn-back-mok').addEventListener('click', () => goMokcha(state.nbId));
  $('#btn-back-draw').addEventListener('click', () => {
    flushSave();
    goSebu(state.mokId);
  });
  $('#btn-back-tree').addEventListener('click', () => goMokcha(state.nbId));
  $('#btn-tree-view').addEventListener('click', goTree);
  $('#btn-new-mok').addEventListener('click', () => openItemModal('mok', 'add'));
  $('#btn-new-sebu').addEventListener('click', () => openItemModal('sebu', 'add'));

  $('#btn-export').addEventListener('click', exportBackup);
  $('#btn-import').addEventListener('click', () => $('#import-file').click());
  $('#import-file').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importBackup(f);
    e.target.value = '';
  });

  // Draw toolbar
  $$('.tool-btn[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.tool = btn.dataset.tool;
      if (btn.dataset.color) state.color = btn.dataset.color;
      if (state.tool !== 'lasso') lassoClear();
      else toast('올가미 — 필기를 둘러싸서 선택하세요');
      applyImgMode();
      $$('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  $$('.thickness-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.width = parseFloat(btn.dataset.w);
      $$('.thickness-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  $('#btn-undo').addEventListener('click', doUndo);
  $('#btn-redo').addEventListener('click', doRedo);
  // Keyboard (tablet keyboard / PC): Ctrl/⌘+Z = 실행취소, Ctrl/⌘+Shift+Z or Ctrl/⌘+Y = 다시실행.
  // Only on the drawing page; never while typing in a text box/input, with a dialog open, or mid-stroke.
  document.addEventListener('keydown', (e) => {
    if (state.view !== 'draw' || !(e.ctrlKey || e.metaKey) || e.altKey) return;
    const k = String(e.key || '').toLowerCase(), c = e.code || '';
    const isZ = c === 'KeyZ' || k === 'z', isY = c === 'KeyY' || k === 'y';
    const wantUndo = isZ && !e.shiftKey, wantRedo = (isZ && e.shiftKey) || (isY && !e.shiftKey);
    if (!wantUndo && !wantRedo) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT' || ae.isContentEditable)) return;
    const mr = document.getElementById('modal-root');
    if (mr && mr.children.length) return;
    if (state.drawing) return;
    e.preventDefault();
    if (wantUndo) doUndo(); else doRedo();
  });
  $('#btn-clear').addEventListener('click', doClear);
  $('#btn-bg-lined').addEventListener('click', () => {
    state.bg = 'lined';
    const s = getSebu(); if (s) s.bg = 'lined';
    scheduleSave();
    ['lined','grid','blank'].forEach(b => $('#btn-bg-' + b).classList.toggle('active', b === 'lined'));
    redrawAll();
  });
  $('#btn-bg-grid').addEventListener('click', () => {
    state.bg = 'grid';
    const s = getSebu(); if (s) s.bg = 'grid';
    scheduleSave();
    ['lined','grid','blank'].forEach(b => $('#btn-bg-' + b).classList.toggle('active', b === 'grid'));
    redrawAll();
  });
  $('#btn-bg-blank').addEventListener('click', () => {
    state.bg = 'blank';
    const s = getSebu(); if (s) s.bg = 'blank';
    scheduleSave();
    ['lined','grid','blank'].forEach(b => $('#btn-bg-' + b).classList.toggle('active', b === 'blank'));
    redrawAll();
  });
  $('#btn-finger-mode').addEventListener('click', () => toggleFingerMode());
  applyFingerModeUI();
  $('#btn-extend').addEventListener('click', extendPage);
  $('#btn-add-sheet').addEventListener('click', addSheet);
  $('#btn-del-sheet').addEventListener('click', removeSheet);
  $('#btn-add-img').addEventListener('click', () => { const f = $('#img-file'); f.value = ''; f.click(); });
  $('#img-file').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) insertImageFile(f); e.target.value = ''; });
  $('#btn-add-note').addEventListener('click', addNote);
  $('#btn-add-pdf').addEventListener('click', () => { const f = $('#pdf-file'); f.value = ''; f.click(); });
  $('#pdf-file').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) insertPdfFile(f); e.target.value = ''; });
  $('#btn-export-png').addEventListener('click', exportPng);
  $('#btn-print').addEventListener('click', () => window.print());

  // Mode toggle 펜 / 자판
  $('#btn-mode-pen').addEventListener('click', () => setInputMode('pen'));
  $('#btn-mode-kb').addEventListener('click', () => setInputMode('keyboard'));
  $('#btn-add-text').addEventListener('click', createTextBoxFromButton);
  $('#text-layer').addEventListener('pointerdown', onTextLayerPointerDown);
  // Pen hovering near screen → block palm touches (prevents palm panning mid-writing)
  ['pointermove','pointerover','pointerenter','pointerdown'].forEach(t => document.addEventListener(t, (ev) => {
    if (ev.pointerType === 'pen') {
      palmBlockUntil = Math.max(palmBlockUntil, performance.now() + 700);
      if (panDrag) panDrag = null;
    }
  }, { capture: true, passive: true }));

  // Zoom controls
  $('#btn-zoom-in').addEventListener('click', zoomIn);
  $('#btn-zoom-out').addEventListener('click', zoomOut);
  $('#btn-zoom-reset').addEventListener('click', zoomReset);
  updateZoomLabel();

  // Canvas pointer events
  const c = canvas();
  c.addEventListener('pointerdown', onPointerDown);
  c.addEventListener('pointermove', onPointerMove);
  c.addEventListener('pointerup', onPointerUp);
  c.addEventListener('pointercancel', onPointerUp);
  c.addEventListener('lostpointercapture', (e) => {
    if (state.drawing && state.pointers.has(e.pointerId)) onPointerUp(e);
  });
  document.addEventListener('pointerup', (e) => {
    if (state.drawing && state.pointers.has(e.pointerId)) onPointerUp(e);
  }, true);
  c.addEventListener('pointerleave', (e) => {
    if (state.drawing && state.pointers.has(e.pointerId)) onPointerUp(e);
  });

  // Prevent context menu on long press canvas
  c.addEventListener('contextmenu', (e) => e.preventDefault());

  // Two-finger pinch zoom on the scroll wrap (does not affect pen / single-finger draw)
  const wrapEl = wrap();
  if (wrapEl) {
    wrapEl.addEventListener('scroll', () => { scheduleViewportCheck(); viewPosOnScroll(); }, { passive: true });
    wrapEl.addEventListener('touchstart', onPinchTouchStart, { passive: false });
    wrapEl.addEventListener('touchmove', onPinchTouchMove, { passive: false });
    wrapEl.addEventListener('touchend', onPinchTouchEnd, { passive: false });
    wrapEl.addEventListener('touchcancel', onPinchTouchEnd, { passive: false });
    wrapEl.addEventListener('touchstart', onTwoTapTouchStart, { passive: true });
    wrapEl.addEventListener('touchmove', twoTapCheckMove, { passive: true });
    wrapEl.addEventListener('touchend', onTwoTapTouchEnd, { passive: true });
    wrapEl.addEventListener('touchcancel', onTwoTapTouchEnd, { passive: true });
  }

  // Soft keyboard on phones fires resize (height only). Remounting #text-layer
  // there stole focus and broke 자판/IME typing — only relayout on width changes.
  lastViewportW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (state.view !== 'draw') return;
    const wNow = window.innerWidth;
    const widthChanged = Math.abs(wNow - lastViewportW) > 2;
    lastViewportW = wNow;
    const typing = document.activeElement && (
      document.activeElement.closest('#text-layer') ||
      document.activeElement.closest('.modal') ||
      document.activeElement.tagName === 'INPUT' ||
      document.activeElement.tagName === 'TEXTAREA'
    );
    if (!widthChanged || typing) {
      // keep layer box size in sync without destroying focused inputs
      const layer = $('#text-layer');
      if (layer) {
        layer.style.width = CSS_W + 'px';
        layer.style.height = CSS_H + 'px';
      }
      applyZoomTransform();
      return;
    }
    resizeCanvas();
    redrawAll();
    updateGuideOverlay();
    renderTextLayer();
  });

  $('#btn-sync').addEventListener('click', openSyncModal);
  $('#btn-sync-now').addEventListener('click', () => { syncNowManual(); });

  // Autosave on visibility change + sync pull when visible
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { flushSave(); viewPosFlush(); }
    if (document.visibilityState === 'visible') {
      syncPullAndMaybeApply({ showDecryptError: false });
      startSyncPolling();
    } else {
      stopSyncPolling();
    }
  });
  window.addEventListener('pagehide', () => { flushSave(); viewPosFlush(); });
  window.addEventListener('beforeunload', () => { flushSave(); });
  window.addEventListener('online', () => {
    syncLastError = ''; syncErrFromPush = false; syncRetryCount = 0; syncPullFails = 0;
    if (syncPendingPush) queueSyncPush(300);
    else syncPullAndMaybeApply({ showDecryptError: false });
  });
  window.addEventListener('offline', () => {
    if (syncPassword) updateSyncStatusUI('offline');
  });
}

/* ========== Boot ========== */
async function boot() {
  await loadData();
  try { await subjReady(); } catch (e) {}
  wireEvents();
  goHome();
  tryAutoReconnect();
  checkLinkHash();
  window.addEventListener('hashchange', checkLinkHash);   // link opened while the app is already open
}

boot();

/* test hooks */
window.__gkcSync = {
  SYNC_URL: () => SYNC_URL,
  encryptData,
  decryptEnvelope,
  vaultIdFromPassword,
  getData: () => DATA,
  setData: (d) => { DATA = d; },
  getSyncPassword: () => syncPassword,
  connectWithPassword,
  syncPushNow,
  syncPullAndMaybeApply,
  syncNowManual,
  startSyncPolling,
  stopSyncPolling,
  getSyncLastError: () => syncLastError,

};
window.__gkcZoom = {
  get: () => drawZoom,
  set: (z, opts) => setDrawZoom(z, opts || { snap: true, force: true }),
  canvasPos,
  applyZoomTransform,
  ZOOM_MIN,
  ZOOM_MAX,
  ZOOM_STEP
};
window.__gkcFinger = {
  get: () => state.fingerMode,
  set: (m) => setFingerMode(m, { silent: true }),
  touchShouldDraw
};
window.__gkcInk = {
  strokeLineWidth,
  getInkCtx,
  SMOOTH_ALPHA,
  drawStroke,
  getActivePenId: () => activePenPointerId,
  isPalmRejectedTouch
};
window.__gkcNav = {
  goHome, goLevels, goCats, goMokcha, goSebu, goDraw, getState: () => ({ ...state }),
  subjModel, nbPlace, subjReady,
  initDrawPage, renderTextLayer, setInputMode
};
})();
