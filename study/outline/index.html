<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GKC 학습노트 — 목차·세부목차·세부내용</title>
<style>
:root {
  /* Monotone Minimal — paper, ink, hairline */
  --bg: #fafafa;
  --paper: #ffffff;
  --surface: #ffffff;
  --surface2: #f4f4f5;
  --surface3: #ececee;
  --border: #e4e4e7;
  --border2: #d4d4d8;
  --text: #18181b;
  --text2: #52525b;
  --text3: #71717a;
  --text4: #a1a1aa;
  --accent: #18181b;
  --accent-soft: #f4f4f5;
  --danger: #a12b20;
  --danger-soft: #faf2f1;
  --ok: #3f6b4f;
  --warn: #8a5a1a;
  --shadow: 0 1px 2px rgba(24,24,27,.05);
  --radius: 6px;
  --radius-lg: 10px;
  --toolbar-h: 54px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg); color: var(--text); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select {
  font-family: inherit; color: inherit;
  font-size: 16px; /* iOS: <16px + max-scale=1 blocks/breaks typing */
  -webkit-user-select: text; user-select: text;
}
button:disabled { opacity: .35; cursor: not-allowed; }
button:focus-visible, .cr-link:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
::selection { background: #18181b; color: #fff; }
.hidden { display: none !important; }

/* ===== App Shell ===== */
#app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

/* Top bar */
.topbar {
  display: flex; align-items: center; gap: 6px;
  height: var(--toolbar-h); padding: 0 14px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 20;
}
.topbar h1 {
  font-size: 15px; font-weight: 650; letter-spacing: -.015em; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-mark {
  font: 600 9.5px/1 var(--mono); letter-spacing: .1em; color: var(--text);
  padding: 5px 5px 4px; border: 1px solid var(--text); border-radius: 3px; flex-shrink: 0;
}
.brand-text { font-size: 15px; font-weight: 600; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; }
.topbar .crumb { font-size: 12.5px; color: var(--text3); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.005em; }
.crumb .cr-link {
  color: var(--text); font-weight: 600; cursor: pointer; padding: 10px 2px;
  text-decoration: underline; text-decoration-color: var(--border2); text-underline-offset: 3px;
}
.crumb .cr-link:hover { text-decoration-color: var(--text); }
.toast.has-act { pointer-events: auto; display: flex; align-items: center; gap: 12px; }
.toast .toast-act { color: #fff; font-weight: 700; min-height: 36px; padding: 0 6px; text-decoration: underline; text-underline-offset: 3px; opacity: .85; }
.move-pick select { width: 100%; height: 44px; border: 1px solid var(--border); border-radius: var(--radius); padding: 0 10px; font-size: 15px; background: var(--surface); color: var(--text); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; color: var(--text2); flex-shrink: 0;
  transition: background .12s, color .12s;
}
.icon-btn:hover, .icon-btn:focus-visible { background: var(--surface2); color: var(--text); }
.icon-btn.active { background: var(--text); color: #fff; }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
.icon-btn svg { display: block; }
.btn {
  height: 34px; padding: 0 13px; border-radius: 6px;
  font-size: 12.5px; font-weight: 600; letter-spacing: .005em;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
  transition: background .12s, border-color .12s, color .12s;
}
.btn:hover { background: var(--surface2); border-color: var(--border2); }
.btn.primary { background: var(--text); border-color: var(--text); color: #fff; }
.btn.primary:hover { background: #000; border-color: #000; }
.btn.ghost { background: transparent; border-color: var(--border); color: var(--text2); }
.btn.ghost:hover { background: var(--surface2); color: var(--text); }
.btn.danger { background: transparent; border-color: #e7cfcb; color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); border-color: #d9b7b2; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 11.5px; }

/* Views */
.view { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.view-body {
  flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
  padding: 18px 16px calc(18px + var(--safe-b));
}
@media (min-width: 720px) {
  .view-body { padding: 26px max(24px, calc((100% - 860px) / 2)); padding-bottom: calc(26px + var(--safe-b)); }
}

/* ===== Home — editorial masthead ===== */
.masthead {
  padding: 6px 0 18px; margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.masthead-kicker {
  font: 500 9.5px/1 var(--mono); letter-spacing: .22em; color: var(--text4);
  margin-bottom: 11px;
}
.masthead h2 {
  font-size: 21px; font-weight: 650; letter-spacing: -.035em; line-height: 1.3; color: var(--text);
  word-break: keep-all; overflow-wrap: break-word;
}
.masthead p { margin-top: 7px; font-size: 12.5px; line-height: 1.6; color: var(--text3); letter-spacing: -.005em; word-break: keep-all; overflow-wrap: break-word; }
.masthead h2 { word-break: keep-all; overflow-wrap: break-word; }
@media (min-width: 720px) {
  .masthead { padding: 10px 0 22px; margin-bottom: 24px; }
  .masthead h2 { font-size: 27px; letter-spacing: -.04em; }
  .masthead p { font-size: 13.5px; margin-top: 9px; }
  .masthead-kicker { margin-bottom: 13px; }
}

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
.nb-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 13px 14px 12px; cursor: pointer;
  display: flex; flex-direction: column; gap: 8px;
  transition: border-color .12s, background .12s;
  position: relative; text-align: left; color: var(--text); min-height: 126px;
}
.nb-card:hover { border-color: var(--border2); }
.nb-card .nb-top { display: flex; align-items: center; gap: 8px; min-height: 18px; padding-right: 4px; }
.nb-card .nb-idx { font: 500 10.5px/1 var(--mono); letter-spacing: .1em; color: var(--text4); }
.nb-card .nb-title { font-size: 15px; font-weight: 600; letter-spacing: -.015em; line-height: 1.35; word-break: keep-all; overflow-wrap: break-word; }
.nb-card .nb-foot { margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.nb-card .nb-meta { font: 500 9.5px/1.3 var(--mono); color: var(--text3); letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.nb-card .nb-type {
  display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .02em; padding: 2px 7px;
  border-radius: 999px; width: fit-content; border: 1px solid var(--border2); color: var(--text2); background: transparent;
}
.nb-card .nb-type.concept { background: var(--text); border-color: var(--text); color: #fff; }
.nb-card .nb-actions {
  position: absolute; top: 7px; right: 7px; display: flex; gap: 2px; opacity: 0; transition: opacity .15s;
  background: var(--surface);
}
.nb-card:hover .nb-actions, .nb-card:focus-within .nb-actions { opacity: 1; }
@media (hover: none) { .nb-card .nb-actions { opacity: 1; } }
.add-card {
  border: 1px dashed var(--border2); background: transparent; color: var(--text3);
  align-items: center; justify-content: center; min-height: 126px; gap: 6px;
}
.add-card:hover { border-color: var(--text); color: var(--text); background: var(--surface2); }
.add-card .add-glyph { font-size: 18px; font-weight: 300; line-height: 1; }
.add-card .add-label { font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }

/* ===== List (과목 / 수준 / 목차 / 세부목차) ===== */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; padding-bottom: 11px; gap: 8px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.section-head h2 { font-size: 16px; font-weight: 650; letter-spacing: -.02em; }
.type-badge {
  font-size: 10.5px; font-weight: 600; letter-spacing: .02em; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--border2); color: var(--text2); background: transparent;
}
.type-badge.concept { background: var(--text); border-color: var(--text); color: #fff; }

.item-list { display: flex; flex-direction: column; gap: 7px; }
.item-row {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 12px 12px 8px; display: flex; align-items: center; gap: 6px;
  cursor: pointer; transition: border-color .12s, background .12s;
}
.item-row:hover { border-color: var(--border2); background: #fcfcfc; }
.item-row .drag-handle {
  color: #c9c9ce; cursor: grab; font-size: 15px; padding: 4px; touch-action: none;
  user-select: none; letter-spacing: -1px;
}
.item-row .item-num {
  width: 24px; flex-shrink: 0; text-align: left;
  font: 500 11.5px/1 var(--mono); letter-spacing: .04em; color: var(--text4);
  display: flex; align-items: center;
}
.item-row .item-body { flex: 1; min-width: 0; }
.item-row .item-title { font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; line-height: 1.35; word-break: keep-all; overflow-wrap: break-word; }
.item-row .item-sub { font-size: 11.5px; color: var(--text3); margin-top: 3px; letter-spacing: .005em; }
.item-row .item-actions { display: flex; gap: 0; flex-shrink: 0; }
.item-row .drag-handle { padding: 10px 8px; margin: -10px -4px -10px -8px; -webkit-user-select: none; -webkit-touch-callout: none; }
.item-row.dragging { opacity: .95; position: relative; z-index: 5; box-shadow: 0 6px 18px rgba(24,24,27,.14); border-color: var(--border2); transition: none; background: var(--surface); }
.item-row .move-btns { display: none; gap: 2px; flex-shrink: 0; }
.item-row.pick .move-btns { display: flex; }
.item-row.pick { border-color: var(--text); }
.item-row.pick .drag-handle { color: var(--text); }
.item-row.drag-over { border-color: var(--text); background: var(--surface2); }

.empty-state {
  text-align: center; padding: 56px 20px 48px; color: var(--text3);
}
.empty-state .empty-icon { font-size: 0; height: 46px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; }
.empty-state .empty-icon::before {
  content: ''; width: 34px; height: 42px; border: 1px solid var(--border2); border-radius: 2px;
  background:
    linear-gradient(var(--border2), var(--border2)) no-repeat 7px 12px / 18px 1px,
    linear-gradient(var(--border2), var(--border2)) no-repeat 7px 20px / 18px 1px,
    linear-gradient(var(--border2), var(--border2)) no-repeat 7px 28px / 11px 1px;
}
.empty-state p { font-size: 13px; line-height: 1.65; margin-bottom: 18px; color: var(--text3); word-break: keep-all; overflow-wrap: break-word; }

/* ===== Tree / Overview ===== */
.tree-list { display: flex; flex-direction: column; gap: 4px; }
.tree-mok {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; margin-bottom: 10px;
}
.tree-mok-head {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  cursor: pointer; font-weight: 600; font-size: 14.5px; letter-spacing: -.01em;
  background: var(--surface);
}
.tree-mok-head:hover { background: var(--surface2); }
.tree-mok-head .item-num { width: 26px; text-align: left; font: 500 11.5px/1 var(--mono); color: var(--text4); }
.tree-sebu {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 42px;
  border-top: 1px solid var(--border); cursor: pointer; font-size: 13.5px; color: var(--text2);
}
.tree-sebu:hover { background: var(--surface2); color: var(--text); }
.tree-sebu .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text4); flex-shrink: 0; }
.tree-sebu .tree-idx { font: 500 10.5px/1 var(--mono); letter-spacing: .06em; color: var(--text4); }

/* ===== Drawing Page ===== */
#view-draw { background: var(--surface3); }
.draw-toolbar {
  display: flex; align-items: center; gap: 2px; padding: 6px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  overflow-x: auto; flex-shrink: 0; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.draw-toolbar::-webkit-scrollbar { display: none; }
.tool-group {
  display: flex; align-items: center; gap: 1px; padding: 0 5px;
  border-right: 1px solid var(--border); flex-shrink: 0;
}
.tool-group:last-child { border-right: none; }
.tool-btn {
  width: 36px; height: 36px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  color: var(--text2); position: relative;
  transition: background .12s, color .12s;
}
.tool-btn:hover { background: var(--surface2); color: var(--text); }
.tool-btn.active { background: var(--text); color: #fff; }
.tool-btn.active:hover { background: #000; }
.tool-btn svg { display: block; }
.tool-btn .swatch {
  width: 19px; height: 19px; border-radius: 50%; border: 1px solid rgba(24,24,27,.14);
}
.tool-btn.sw.active { background: var(--surface2); color: var(--text); }
.tool-btn.sw.active .swatch { box-shadow: 0 0 0 1px #fff, 0 0 0 2px var(--text); }
.swatch.black { background: #1a1a1a; }
.swatch.blue { background: #2563eb; }
.swatch.red { background: #dc2626; }
.swatch.hl { background: #fef08a; border: 1px solid #eab308 !important; }
.swatch.hl-pink { background: #f472b6; border: 1px solid #db2777 !important; }
/* 글자 붙은 도구 버튼: 아이콘 위·이름 아래로 (36px 칸에서 글자가 줄바꿈되어 잘리던 문제) */
.tool-btn.lbl {
  width: auto; min-width: 36px; padding: 3px 5px; flex-direction: column; gap: 2px;
  font-size: 14px; line-height: 1; white-space: nowrap;
}
.tool-btn.lbl .tl { font-size: 9.5px; font-weight: 600; line-height: 1; letter-spacing: .01em; color: inherit; opacity: .85; }
.tool-btn.lbl.active .tl { opacity: 1; }
/* 실행취소 등을 빠르게 연달아 눌러도 두 번 탭 확대가 끼어들지 않게 (가로 스크롤은 그대로) */
.draw-toolbar button { touch-action: manipulation; }
.thickness-btn {
  width: 36px; height: 36px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text2); transition: background .12s, color .12s;
}
.thickness-btn:hover { background: var(--surface2); color: var(--text); }
.thickness-btn span {
  display: block; border-radius: 50%; background: currentColor;
}
.thickness-btn.active { background: var(--surface2); color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.thickness-btn.active:hover { background: var(--surface2); }
#lasso-layer { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:5; }
#lasso-svg { position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; }
#lasso-menu { position:absolute; display:none; gap:2px; pointer-events:auto; background:var(--surface); border:1px solid var(--border2);
  border-radius:6px; padding:4px; box-shadow:0 4px 14px rgba(24,24,27,.12); transform:translate(-50%, -100%); white-space:nowrap; }
#lasso-menu.show { display:flex; }
#lasso-menu button { border:0; background:transparent; padding:7px 12px; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer; color:var(--text); }
#lasso-menu button:hover { background:var(--surface2); }
#lasso-menu button[data-act="del"] { color:var(--danger); }

.canvas-wrap {
  flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
  position: relative; touch-action: pan-y pan-x;
  overscroll-behavior: contain;
}
.canvas-wrap.finger-pan { touch-action: pan-y pan-x; }
.canvas-wrap.finger-draw { touch-action: none; }
.canvas-wrap.drawing { touch-action: none; overflow: hidden; }
.canvas-wrap.pinching { touch-action: none; overflow: hidden; }
#zoom-sizer {
  margin: 10px auto;
  position: relative;
}
#drawCanvas {
  display: block; cursor: crosshair;
  background: transparent;
}
/* Canvas always none: JS handles 이동(pan) vs 쓰기(draw); wrap still scrolls. */
#drawCanvas, .canvas-wrap.finger-draw #drawCanvas,
.canvas-wrap.finger-pan #drawCanvas,
.canvas-wrap.drawing #drawCanvas,
.canvas-wrap.pinching #drawCanvas { touch-action: none; }
.finger-mode-btn {
  width: auto !important; min-width: 36px; padding: 0 8px !important;
  font-size: 10.5px !important; font-weight: 600; white-space: nowrap; letter-spacing: -.01em;
}
.zoom-group { display: flex; align-items: center; gap: 1px; }
.zoom-btn {
  min-width: 34px; height: 36px; padding: 0 8px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 400; color: var(--text2);
}
.zoom-btn:hover { background: var(--surface2); color: var(--text); }
.zoom-label {
  min-width: 50px; height: 36px; padding: 0 6px; border-radius: 5px;
  font: 500 11px/1 var(--mono); letter-spacing: .02em; color: var(--text3);
  display: flex; align-items: center; justify-content: center;
}
.zoom-label:hover { background: var(--surface2); color: var(--text); }
.guide-label {
  position: absolute; left: 24px; padding: 2px 0;
  border-bottom: 1px dashed rgba(24,24,27,.07); width: calc(100% - 48px);
}

/* ===== Text boxes (자판 mode) ===== */
.mode-toggle {
  display: flex; align-items: center; background: transparent;
  border: 1px solid var(--border); border-radius: 6px; padding: 2px; gap: 1px; flex-shrink: 0;
}
.mode-toggle button {
  height: 26px; padding: 0 9px; border-radius: 4px;
  font-size: 11.5px; font-weight: 600; color: var(--text3); letter-spacing: -.005em;
  transition: background .12s, color .12s;
}
.mode-toggle button:hover { color: var(--text); }
.mode-toggle button.active {
  background: var(--text); color: #fff;
}
#page-stage {
  position: relative;
  margin: 0;
  width: fit-content;
  box-shadow: 0 0 0 1px var(--border), 0 1px 3px rgba(24,24,27,.05);
  background: var(--paper);
  transform-origin: 0 0;
}
#bgCanvas, #drawCanvas {
  display: block;
  margin: 0;
  box-shadow: none;
  position: absolute;
  top: 0; left: 0;
}
#bgCanvas { z-index: 0; pointer-events: none; }
#img-layer { position:absolute; left:0; top:0; width:100%; height:100%; z-index:1; pointer-events:none; }
#img-layer.active { z-index:4; }
#note-layer { position:absolute; left:0; top:0; width:100%; height:100%; z-index:3; pointer-events:none; }
.sticky { position:absolute; pointer-events:auto; display:flex; flex-direction:column; border-radius:4px;
  box-shadow:0 1px 3px rgba(24,24,27,.16); background:#fff59d; min-width:90px; min-height:70px; user-select:none; -webkit-user-select:none; }
.sticky .st-bar { display:flex; align-items:center; gap:2px; height:30px; padding:0 2px 0 4px; flex-shrink:0;
  background:rgba(24,24,27,.05); border-radius:4px 4px 0 0; touch-action:none; cursor:move; }
.sticky .st-grip { flex:1; height:100%; display:flex; align-items:center; color:rgba(24,24,27,.32); font-size:14px; letter-spacing:-2px; }
.sticky .st-bar button { border:0; background:transparent; width:30px; height:30px; padding:0; font-size:14px; border-radius:4px; cursor:pointer; touch-action:manipulation; }
.sticky .st-bar button:active { background:rgba(24,24,27,.1); }
.sticky textarea { flex:1; width:100%; border:0; outline:0; resize:none; background:transparent; padding:6px 8px; font:15px/1.4 inherit;
  font-family:inherit; color:#222; user-select:text; -webkit-user-select:text; box-sizing:border-box; }
.sticky .st-rs { position:absolute; right:-6px; bottom:-6px; width:26px; height:26px; touch-action:none; cursor:nwse-resize;
  background:linear-gradient(135deg, transparent 50%, rgba(24,24,27,.22) 50%); border-radius:0 0 4px 0; }
.sticky.folded { min-width:0; min-height:0; width:40px !important; height:40px !important; border-radius:4px; align-items:center; justify-content:center;
  font-size:20px; touch-action:none; cursor:pointer; }
.sticky.folded > :not(.st-icon) { display:none !important; }

<script>
(function () {
'use strict';

const SYNC_URL = 'https://gkc-notes-sync.youngja1479.workers.dev';

/* ========== Utils ========== */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('has-act');
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2200);

function esc(s) {

    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

/* ========== Storage (IndexedDB + localStorage fallback) ========== */
const DB_NAME = 'gkc-study-notes';
const DB_VER = 1;
const STORE = 'data';
const LS_KEY = 'gkc-study-notes-v1';

function openDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { resolve(null); return; }
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}

async function idbGet(key) {
  const db = await openDB();
  if (!db) return null;
  return new Promise((resolve) => {
    try {
      const tx = db.transaction(STORE, 'readonly');
      const r = tx.objectStore(STORE).get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

async function idbSet(key, val) {
  const db = await openDB();
  if (!db) return false;
  return new Promise((resolve) => {
    try {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(val, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    } catch (e) { resolve(false); }
  });
}

const defaultData = () => ({
  version: 1,
  notebooks: [],
  updatedAt: 0
});

let DATA = defaultData();
let saveTimer = null;
let saveIdle = null;

async function loadData() {
  let d = await idbGet('app');
  if (!d) {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) d = JSON.parse(raw);
    } catch (e) {}
  }
  if (d && Array.isArray(d.notebooks)) DATA = d;
  else DATA = defaultData();
}

// An idle callback can run much later than the timer which queued it. Cancel stale
// callbacks and re-check at execution time, not just before requesting idle time.
function cancelScheduledSave() {
  clearTimeout(saveTimer);
  if (saveIdle !== null) {
    window.cancelIdleCallback(saveIdle);
    saveIdle = null;
  }
}
function runScheduledSave() {
  saveIdle = null;
  if (state.drawing) { saveTimer = setTimeout(queueIdleSave, 400); return; }
  doSave();
}
function queueIdleSave() {
  if (state.drawing) { saveTimer = setTimeout(queueIdleSave, 400); return; }
  if (window.requestIdleCallback && window.cancelIdleCallback) {
    saveIdle = window.requestIdleCallback(runScheduledSave, { timeout: 2000 });
  } else runScheduledSave();
}
function scheduleSave() {
  DATA.updatedAt = Date.now();
  cancelScheduledSave();
  saveTimer = setTimeout(queueIdleSave, 2000);
}

/** localStorage copy is a fallback only — strip heavy image data (kept in IndexedDB). */
let lsLastSave = 0, lsTooBig = 0;
let lsSaveGeneration = 0;
async function lsSaveData(force, lifecycle) {
  const now = Date.now();
  if (!force && now - lsLastSave < 30000) return;
  if (!force && lsTooBig && now - lsTooBig < 300000) return;
  const generation = ++lsSaveGeneration;
  const snapshot = DATA, revision = DATA.updatedAt;
  lsLastSave = now;
  try {
    let serialized;
    // Lifecycle fallback stays synchronous: don't depend on a worker surviving
    // page suspension. Normal saves serialize off-thread after durable IDB save.
    if (!lifecycle && document.visibilityState !== 'hidden') {
      const reply = await runPerfTask('fallback', snapshot);
      if (!reply.unavailable) serialized = reply.result;
      if (generation !== lsSaveGeneration) return;
      if (DATA !== snapshot || DATA.updatedAt !== revision || state.drawing) {
        lsLastSave = 0; return; // next committed change will schedule its own save
      }
    }
    if (serialized === undefined) serialized = JSON.stringify(snapshot, (k, v) =>
      (k === 'src' && typeof v === 'string' && v.startsWith('data:')) ? undefined : v);
    localStorage.setItem(LS_KEY, serialized); lsTooBig = 0;
  } catch (e) { lsTooBig = Date.now(); }
}
let saveWarned = false;
async function doSave(lifecycle) {
  const ok = await idbSet('app', DATA);
  if (!ok && !saveWarned) { saveWarned = true; toast('저장 공간이 부족합니다 — 이미지를 줄이거나 삭제해 주세요'); }
  if (ok) saveWarned = false;
  // IndexedDB may finish after a new stroke has started. Never stringify the
  // entire notebook synchronously in that stroke; its pen-up queues another save.
  if (!state.drawing) await lsSaveData(false, lifecycle);
  scheduleSyncPush();
  return ok;
}

async function flushSave() {
  // Commit a captured stroke before lifecycle saves, even if pointerup never fires.
  if (state.drawing && state.currentStroke) {
    for (const pointerId of Array.from(state.pointers.keys())) {
      onPointerUp({ pointerId, pointerType: 'pen', type: 'pointercancel' });
    }
  }
  cancelScheduledSave();
  await doSave(true);
}

/* ========== Cross-device sync (password vault) ========== */
const SYNC_PW_KEY = 'gkc-sync-pw';
const PBKDF2_ITERS = 150000;
const SYNC_POLL_MS = 5000;

let syncPassword = null;
let syncVaultId = null;
let syncPushTimer = null;
let syncPollTimer = null;
let syncPendingPush = false;
let syncBusy = false;
let syncLastError = '';
let syncApplyingRemote = false;
let syncConflicts = 0;
let syncRetryCount = 0;      // consecutive transient upload failures (backoff)
let syncPullFails = 0;       // consecutive transient auto-check failures
let syncErrFromPush = false; // a real upload error stays visible until an upload works

function bufToB64(buf) {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i += 32768) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
  return btoa(s);
}
function b64ToBuf(b64) {
  const s = atob(b64);
  const bytes = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
  return bytes;
}
function bufToHex(buf) {
  return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
}

async function sha256Hex(str) {
  const dig = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return bufToHex(dig);
}
async function vaultIdFromPassword(pw) {
  return sha256Hex('gkc-study-vault:' + pw);
}
async function deriveAesKey(password, saltU8) {
  const baseKey = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltU8, iterations: PBKDF2_ITERS, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}
// A failure to create/load the optional worker keeps the existing in-page path.
// Crypto/data errors are returned to the caller, never mistaken for worker failure.
let perfWorker = null, perfWorkerDisabled = false, perfTaskId = 0;
const perfTasks = new Map();
function disablePerfWorker() {
  perfWorkerDisabled = true;
  if (perfWorker) perfWorker.terminate();
  perfWorker = null;
  for (const task of perfTasks.values()) task.resolve({ unavailable: true });
  perfTasks.clear();
}
function runPerfTask(kind, payload, password) {
  if (perfWorkerDisabled || typeof Worker === 'undefined') return Promise.resolve({ unavailable: true });
  if (!perfWorker) {
    try {
      perfWorker = new Worker(new URL('perf-worker.js?v=20261111-sync2', document.baseURI));
      perfWorker.onmessage = ({ data: reply }) => {
        const task = perfTasks.get(reply.id); if (!task) return;
        perfTasks.delete(reply.id);
        if (reply.error) {
          const err = new Error(reply.error.message); err.name = reply.error.name;
          task.reject(err);
        } else task.resolve({ result: reply.result });
      };
      perfWorker.onerror = disablePerfWorker;
      perfWorker.onmessageerror = disablePerfWorker;
    } catch (_) { disablePerfWorker(); return Promise.resolve({ unavailable: true }); }
  }
  return new Promise((resolve, reject) => {
    const id = ++perfTaskId; perfTasks.set(id, { resolve, reject });
    try { perfWorker.postMessage({ id, kind, payload, password }); }
    catch (_) { disablePerfWorker(); }
  });
}
async function encryptData(dataObj, password) {
  const reply = await runPerfTask('encrypt', dataObj, password);
  return reply.unavailable ? encryptDataFallback(dataObj, password) : reply.result;
}
async function decryptEnvelope(env, password) {
  const reply = await runPerfTask('decrypt', env, password);
  return reply.unavailable ? decryptEnvelopeFallback(env, password) : reply.result;
}
/* v2 sync envelope (2026-11-11): ink coordinates rounded to 0.01 px for transport
   (only strokes with an id, so legacy signature keys never change) + gzip before
   AES-GCM. Local notes keep full precision; v1 envelopes are still read. */
function syncRound(v) {
  return Math.round(v * 100) / 100;
}
function syncReplacer(k, v) {
  if (k === 'points' && Array.isArray(v) && this && this.id) {
    return v.map(pt => (pt && typeof pt.x === 'number' && typeof pt.y === 'number')
      ? Object.assign({}, pt, { x: syncRound(pt.x), y: syncRound(pt.y), p: typeof pt.p === 'number' ? syncRound(pt.p) : pt.p })
      : pt);
  }
  return v;
}
function canGzip() {
  return typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
}
async function gzipBytes(u8) {
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
}
async function gunzipBytes(u8) {
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
}
async function encryptDataFallback(dataObj, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(password, salt);
  const gz = canGzip();
  let plain = new TextEncoder().encode(gz ? JSON.stringify(dataObj, syncReplacer) : JSON.stringify(dataObj));
  if (gz) plain = await gzipBytes(plain);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain);
  return {
    v: gz ? 2 : 1,
    salt: bufToB64(salt),
    iv: bufToB64(iv),
    ct: bufToB64(ct),
    updatedAt: dataObj.updatedAt || Date.now()
  };
}
async function decryptEnvelopeFallback(env, password) {
  const salt = b64ToBuf(env.salt);
  const iv = b64ToBuf(env.iv);
  const ct = b64ToBuf(env.ct);
  const key = await deriveAesKey(password, salt);
  let plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
  if (env.v === 2) plain = await gunzipBytes(plain);
  return JSON.parse(new TextDecoder().decode(plain));
}

function syncKoreanError(err) {
  const msg = (err && err.message) ? String(err.message) : String(err || '');
  if (/\b413\b/.test(msg)) return '용량이 너무 커서 못 올렸어요 — 사진을 줄여 주세요';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(msg)) return '네트워크 오류 — 연결을 확인해 주세요';
  if (/timeout/i.test(msg)) return '연결이 너무 느려요 — 잠시 후 다시 시도해요';
  if (/GET 4|PUT 4|GET 5|PUT 5|\b413\b|\b429\b|\b500\b|\b502\b|\b503\b/.test(msg)) return '서버 오류 (' + msg + ')';
  if (/decrypt|OperationError|AES/i.test(msg)) return '비밀번호가 맞지 않아요';
  if (/JSON|parse/i.test(msg)) return '서버 데이터 형식 오류';
  if (msg) return '동기화 실패: ' + msg;
  return '동기화 실패';
}

function setSyncStatus(kind, text) {
  const el = $('#sync-status');
  if (!el) return;
  el.className = 'sync-status' + (kind ? ' ' + kind : '');
  el.textContent = text || '';
  el.title = text || '';
}
function updateSyncNowButton() {
  const btn = $('#btn-sync-now');
  if (!btn) return;
  btn.style.display = syncPassword ? '' : 'none';
}
function updateSyncStatusUI(mode) {
  updateSyncNowButton();
  if (!syncPassword) { setSyncStatus('', ''); return; }
  // Real errors (too big, wrong password, server rejects) stay until fixed.
  if (syncLastError && (mode === 'error' || (mode !== 'syncing' && !syncBusy) || syncErrFromPush)) {
    setSyncStatus('err', syncLastError);
    return;
  }
  // "오프라인" only when the device itself says it is offline.
  if (typeof navigator !== 'undefined' && navigator.onLine === false) { setSyncStatus('warn', '오프라인(나중에 올라감)'); return; }
  // Repeated network failures while online: one steady message, retried with backoff.
  if (syncRetryCount >= 3 || syncPullFails >= 3) { setSyncStatus('warn', '연결이 불안정해요 · 다시 시도 중'); return; }
  // Waiting to upload, uploading, checking: one steady "동기화 중…" (no flapping).
  if (mode === 'syncing' || syncBusy || syncPendingPush) setSyncStatus('busy', '동기화 중…');

  if (!syncPassword || !syncVaultId) {
    openSyncModal();
    return;
  }
  syncLastError = '';
  const pull = await syncPullAndMaybeApply({ toastOnApply: true });
  const remoteAt = pull.remoteAt || 0;
  const localAt = DATA.updatedAt || 0;
  if (syncPendingPush || (dataHasContent(DATA) && localAt > remoteAt)) {
    await syncPushNow();

    toast('최신 상태예요');

async function connectWithPassword(pw) {
  // Do not trim — password is the key; spaces may be intentional
  if (!pw || pw.length < 4) {
    toast('비밀번호는 4자 이상이어야 해요');
    return false;
  }
  const vid = await vaultIdFromPassword(pw);
  syncBusy = true;
  syncLastError = '';
  updateSyncStatusUI('syncing');
  let remoteEnv = null;
  try {
    remoteEnv = await syncFetchGet(vid);
  } catch (e) {
    syncBusy = false;
    syncLastError = syncKoreanError(e);
    updateSyncStatusUI('error');
    toast(syncLastError || '서버에 연결할 수 없어요');
    return false;
  }

  if (remoteEnv) {
    let remoteData;
    try {
      remoteData = await decryptEnvelope(remoteEnv, pw);
    } catch (de) {
      syncBusy = false;
      syncLastError = '비밀번호가 맞지 않아요';
      updateSyncStatusUI('error');
      toast('비밀번호가 맞지 않아요');
      return false;
    }
    const remoteAt = (remoteEnv.updatedAt != null ? remoteEnv.updatedAt : remoteData.updatedAt) || 0;
    const localAt = DATA.updatedAt || 0;
    const localHas = dataHasContent(DATA);
    const remoteHas = dataHasContent(remoteData);
    const both = localHas && remoteHas;
    const differ = remoteAt !== localAt || JSON.stringify(DATA.notebooks) !== JSON.stringify(remoteData.notebooks);

    // Empty local + remote content => always take remote (fixes wipe bug)
    if (!localHas && remoteHas) {
      syncVaultId = vid;
      rememberSyncPassword(pw);
      await applyRemoteData(remoteData);
      syncPendingPush = false;
      syncBusy = false;
      syncLastError = '';
      updateSyncStatusUI('synced');
      toast('클라우드에서 불러왔어요');
      return true;
    }

    if (both && differ) {
      const ok = confirm('이 기기 내용과 저장된 내용 중 최신 것을 사용할게요');
      if (!ok) {
        syncBusy = false;
        updateSyncStatusUI();
        return false;
      }
    }
    syncVaultId = vid;
    rememberSyncPassword(pw);
    if (!remoteHas && localHas) {
      syncBusy = false;
      await syncPushNow();
      toast('이 기기 내용을 올렸어요');
    } else if (remoteHas && (remoteAt > localAt || !localHas)) {
      await applyRemoteData(remoteData);
      syncPendingPush = false;
      syncBusy = false;
      syncLastError = '';
      updateSyncStatusUI('synced');
      toast('클라우드에서 불러왔어요');
    } else if (localHas && localAt > remoteAt) {
      syncBusy = false;
      await syncPushNow();
      toast('이 기기 내용을 올렸어요');
    } else {
      syncBusy = false;
      syncLastError = '';
      updateSyncStatusUI('synced');
      toast('동기화 연결됨');
    }
    return true;
  }

  // remote null — new vault or wrong password (indistinguishable by design)
  const localHas = dataHasContent(DATA);
  if (localHas) {
    const upload = confirm('저장된 내용이 없어요. 이 기기 노트를 올릴까요?\n취소하면 빈 노트로 시작합니다.');
    syncVaultId = vid;
    rememberSyncPassword(pw);
    if (upload) {
      syncBusy = false;
      await syncPushNow();
      toast('이 기기 내용을 올렸어요');
    } else {
      DATA = defaultData();
      clearTimeout(saveTimer);
      await idbSet('app', DATA);
      lsSaveData();
      reRenderAfterSync();
      syncBusy = false;
      await syncPushNow();
      toast('빈 노트로 시작해요');
    }
    return true;
  }

  syncVaultId = vid;
  rememberSyncPassword(pw);
  syncBusy = false;
  syncLastError = '';
  updateSyncStatusUI('synced');
  toast('동기화 연결됨');
  return true;
}

let linkScanStream = null;
function linkStopScan() {

function linkLoadScript(src, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  return new Promise((resolve, reject) => {
    const sc = document.createElement('script'); sc.src = src;
    sc.onload = () => window[globalName] ? resolve(window[globalName]) : reject(new Error(globalName));
    sc.onerror = () => reject(new Error(globalName)); document.head.appendChild(sc);
  });
}
async function linkDrawQr(canvas, text) {
  const qrcode = await linkLoadScript('vendor/qr/qrcode.js?v=1', 'qrcode');
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), q = 4, scale = 6, size = (n + q * 2) * scale;
  canvas.width = size; canvas.height = size;
  const g = canvas.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) g.fillRect((c + q) * scale, (r + q) * scale, scale, scale);
}
function wireLinkUI() {

/* ========== 기기 연결 (device linking, no password typing) ==========

   and an AES-GCM key; the device uploads only the encrypted sync secret under that slot.
   The new device derives the same slot/key from the code, claims the slot once (Worker

   The Worker never sees the code, the key or the password; slots expire after 10 min. */

  if (r.status === 410) return { ok: false, error: '이미 사용한 코드예요. 새 코드를 만들어 주세요' };
  if (r.status === 429) return { ok: false, error: '너무 많이 시도했어요. ' + Math.max(1, Math.ceil((r.j.retryAfter || 600) / 60)) + '분 뒤에 다시 해 주세요' };

/* ---- 기준 기기 (which notes win when a linked device already has notes) ----

  for (let i = 0; i < keys.length - VIEWPOS_MAX; i++) delete m[keys[i]];
  try { localStorage.setItem(VIEWPOS_KEY, JSON.stringify(m)); } catch (e) {}
}

/* ========== 과목 → 수준 (model, migration, CRUD) ========== */
// Categories with no (or an unknown/deleted) 과목·수준 — made by older app versions or other
// devices on them — are shown under 미분류, so nothing ever disappears from the list.
const SUBJ_DEFAULT = 'subj-default', LVL_DEFAULT = 'lvl-default', SUBJ_DEFAULT_TITLE = '미분류';
const SUBJ_MIG_KEY = 'subj-migration';
let subjMigrated = false;
function subjTomb() { return new Set(DATA.delIds || []); }
/** Display model: live subjects (+ 미분류 and any place a category points to whose registry entry
    was lost, e.g. merged away by an older app). Pure — never writes DATA. */
function subjModel() {
  const tomb = subjTomb();
  const list = [];
  (Array.isArray(DATA.subjects) ? DATA.subjects : []).forEach(su => {
    if (!su || !su.id || tomb.has(su.id) || list.some(x => x.id === su.id)) return;
    const lv = [];
    (Array.isArray(su.levels) ? su.levels : []).forEach(l => { if (l && l.id && !tomb.has(l.id) && !lv.some(x => x.id === l.id)) lv.push({ id: l.id, title: l.title || '', ref: l }); });
    list.push({ id: su.id, title: su.title || '', ref: su, levels: lv });
  });
  let def = list.find(x => x.id === SUBJ_DEFAULT);
  if (!def) { def = { id: SUBJ_DEFAULT, title: SUBJ_DEFAULT_TITLE, ref: null, levels: [] }; list.unshift(def); }
  if (!def.levels.some(l => l.id === LVL_DEFAULT)) def.levels.unshift({ id: LVL_DEFAULT, title: SUBJ_DEFAULT_TITLE, ref: null });
  DATA.notebooks.forEach(nb => {
    const sl = nb && nb.sl;
    if (!sl || !sl.s || !sl.l || tomb.has(sl.s) || tomb.has(sl.l)) return;
    let su = list.find(x => x.id === sl.s);
    if (!su) { su = { id: sl.s, title: sl.st || '과목', ref: null, levels: [] }; list.push(su); }
    if (!su.levels.some(l => l.id === sl.l)) su.levels.push({ id: sl.l, title: sl.lt || '수준', ref: null });
  });
  return list;
}
/** Where a category is shown: its 과목/수준 if both still exist, otherwise 미분류. */
function nbPlace(nb, model) {
  const m = model || subjModel(), sl = nb && nb.sl;
  if (sl) { const su = m.find(x => x.id === sl.s); if (su && su.levels.some(l => l.id === sl.l)) return { s: sl.s, l: sl.l }; }
  return { s: SUBJ_DEFAULT, l: LVL_DEFAULT };
}
function nbsIn(s, l, model) { const m = model || subjModel(); return DATA.notebooks.filter(nb => { const p = nbPlace(nb, m); return p.s === s && (l == null || p.l === l); }); }
// 미분류 is shown only while it holds something or was renamed / has own levels
function subjShown(su, model) {
  if (su.id !== SUBJ_DEFAULT) return true;
  return nbsIn(su.id, null, model).length > 0 || (su.ref && su.ref.u) || su.levels.some(l => l.id !== LVL_DEFAULT);
}
function lvlShown(su, l, model) {
  if (l.id !== LVL_DEFAULT) return true;
  return nbsIn(su.id, l.id, model).length > 0 || (l.ref && l.ref.u) || su.levels.length === 1;
}
/** First time on this device: automatic local backup, then add the 미분류 registry entry.
    Categories themselves are not rewritten (no sl = 미분류). Returns false if the backup failed. */
async function subjReady() {
  if (subjMigrated) return true;
  if (Array.isArray(DATA.subjects) && DATA.subjects.length) { subjMigrated = true; return true; } // already set up (here or via sync): no I/O at start
  const mark = await idbGet(SUBJ_MIG_KEY);
  if (!mark && !(Array.isArray(DATA.subjects) && DATA.subjects.length) && dataHasContent(DATA)) {
    try { await saveLinkBackup('migrate', DATA, '과목·수준 도입 전 노트 (자동 백업)'); }
    catch (e) { return false; }
  }
  if (!mark) await idbSet(SUBJ_MIG_KEY, { at: Date.now() });
  subjMigrated = true;
  if (!(Array.isArray(DATA.subjects) && DATA.subjects.length)) {
    subjMaterialize();
    await idbSet('app', DATA); // no updatedAt bump: nothing visible changed; synced with the next edit
  }
  return true;
}
/** Make every entry of the display model a real record in DATA.subjects (before a write). */
function subjMaterialize() {
  const model = subjModel();
  if (!Array.isArray(DATA.subjects)) DATA.subjects = [];
  model.forEach(ms => {
    let su = ms.ref;
    if (!su) {
      su = DATA.subjects.find(x => x && x.id === ms.id);
      if (!su) { su = { id: ms.id, title: ms.title, u: 0, levels: [] }; if (ms.id === SUBJ_DEFAULT) DATA.subjects.unshift(su); else DATA.subjects.push(su); }
    }
    if (!Array.isArray(su.levels)) su.levels = [];
    ms.levels.forEach(ml => {
      if (ml.ref || su.levels.some(x => x && x.id === ml.id)) return;
      if (ml.id === LVL_DEFAULT) su.levels.unshift({ id: ml.id, title: ml.title, u: 0 }); else su.levels.push({ id: ml.id, title: ml.title, u: 0 });
    });
  });
}
function subjRec(id) { return (DATA.subjects || []).find(x => x && x.id === id); }
function lvlRec(su, id) { return su && (su.levels || []).find(x => x && x.id === id); }
async function subjWrite(fn) {
  if (!(await subjReady())) { toast('자동 백업을 저장하지 못해 바꾸지 않았어요 — 저장 공간을 확인해 주세요'); return false; }
  subjMaterialize();
  fn();
  scheduleSave();
  return true;
}
function slFor(s, l) {
  const m = subjModel(), su = m.find(x => x.id === s), lv = su && su.levels.find(x => x.id === l);
  return { s, l, st: su ? su.title : '', lt: lv ? lv.title : '', at: Date.now() };
}
function crumbHTML(parts) {
  return parts.map(p => p.go ? `<span class="cr-link" data-go="${esc(p.go)}">${esc(p.t)}</span>` : esc(p.t)).join(' › ');
}
function wireCrumb(el) {

}
function placeCrumbParts() {

}

/* ========== Render: Home (과목) ========== */
function renderHome() {
  const list = $('#subj-list');
  const model = subjModel();
  const shown = model.filter(su => subjShown(su, model));
  if (!shown.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📚</div>
        <p>아직 과목이 없어요.<br>예: 국어 · 수학 · 영어</p>
        <button class="btn primary" id="btn-empty-subj">＋ 첫 과목 만들기</button>
      </div>`;
    $('#btn-empty-subj')?.addEventListener('click', () => openSubjModal('subj', 'add'));
    return;
  }
  list.innerHTML = shown.map((su, i) => {
    const lv = su.levels.filter(l => lvlShown(su, l, model)).length, nc = nbsIn(su.id, null, model).length;
    return itemRowHTML(su.id, i, su.title, `수준 ${lv}개 · 노트 ${nc}개`);
  }).join('');
  setupListInteractions(list, shown, id => goLevels(id), () => {
    const ids = shown.map(x => x.id);
    subjWrite(() => { reorderByIds(DATA.subjects, ids); DATA.subjOrdAt = Date.now(); }).then(() => renderHome());
  }, null, { edit: id => openSubjModal('subj', 'edit', id), del: id => confirmDeleteSubj('subj', id) });
}

/* 과목/수준: add · rename */
function openSubjModal(kind, mode, id) {
  const isS = kind === 'subj', model = subjModel();
  const su = isS ? (mode === 'edit' ? model.find(x => x.id === id) : null) : model.find(x => x.id === state.subjId);
  if (!isS && !su) return;
  const item = mode === 'edit' ? (isS ? su : su.levels.find(l => l.id === id)) : null;
  if (mode === 'edit' && !item) return;
  const name = isS ? '과목' : '수준';
  openModal(`
    <h3>${mode === 'add' ? name + ' 추가' : name + ' 이름 변경'}</h3>
    <div class="field">
      <label>${name} 이름</label>
      <input type="text" id="subj-title" value="${esc(item ? item.title : '')}" placeholder="${isS ? '예: 국어 · 수학 · 영어' : '예: 입문 · 기본 · 심화'}" maxlength="60" autofocus>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="m-cancel">취소</button>
      <button class="btn primary" id="m-ok">${mode === 'add' ? '추가' : '저장'}</button>
    </div>`);
  $('#m-cancel').onclick = closeModal;
  $('#m-ok').onclick = async () => {
    const title = ($('#subj-title').value || '').trim();
    if (!title) { $('#subj-title').focus(); return; }
    closeModal();
    const now = Date.now();
    await subjWrite(() => {
      if (mode === 'add' && isS) DATA.subjects.push({ id: uid(), title, u: now, levels: [] });
      else if (mode === 'add') subjRec(su.id).levels.push({ id: uid(), title, u: now });
      else {
        const rec = isS ? subjRec(id) : lvlRec(subjRec(su.id), id);
        rec.title = title; rec.u = now;
        // keep the fallback title copies on categories current (their move time is unchanged)
        DATA.notebooks.forEach(nb => { if (nb.sl && (isS ? nb.sl.s === id : nb.sl.l === id)) nb.sl[isS ? 'st' : 'lt'] = title; });
      }
    });
    if (state.view === 'levels') renderLevels(); else renderHome();
    toast(mode === 'add' ? name + '을(를) 추가했어요' : '저장됨');
  };
  $('#subj-title').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#m-ok').click(); });
}
/* 과목/수준 delete: refused while any 노트 is inside (notes are never removed this way);
   an empty one is deleted after a confirm, with 되돌리기 */
function confirmDeleteSubj(kind, id) {
  const isS = kind === 'subj', model = subjModel();
  const su = isS ? model.find(x => x.id === id) : model.find(x => x.id === state.subjId);
  const item = isS ? su : su && su.levels.find(l => l.id === id);
  if (!item) return;
  const name = isS ? '과목' : '수준';
  const info = (msg) => {
    openModal(`<h3>${name} 삭제</h3><p style="font-size:14px;color:var(--text2);margin-bottom:16px;line-height:1.5">${msg}</p>
      <div class="modal-actions"><button class="btn primary" id="m-ok">확인</button></div>`);
    $('#m-ok').onclick = closeModal;
  };
  if (id === SUBJ_DEFAULT || id === LVL_DEFAULT) { info('「' + esc(item.title) + '」은(는) 기본 ' + name + '이라 지울 수 없어요. 예전 버전 기기에서 만든 노트가 여기에 모여요. 이름은 바꿀 수 있어요.'); return; }
  const inside = isS ? nbsIn(su.id, null, model) : nbsIn(su.id, id, model);
  if (inside.length) {
    info('「' + esc(item.title) + '」 안에 노트 ' + inside.length + '개가 있어서 삭제할 수 없어요.<br>노트의 ⇄ 버튼으로 다른 과목/수준으로 옮기거나 노트를 삭제한 뒤 다시 해 주세요.');
    return;
  }

  $('#m-ok').onclick = async () => {

      pos = arr.findIndex(x => x && x.id === id);

      arr.splice(pos, 1);

    });
    if (!ok) return;

      subjWrite(() => {

        else { const r = subjRec(su.id); if (!r) return; r.levels.splice(Math.min(pos, r.levels.length), 0, c); }

}

/* ========== Reorder (pointer events: touch · pen · mouse) ========== */
// Drag the ⋮⋮ handle up/down, or tap it for ▲▼ buttons. The order is saved with
// parent.ordAt so a newer reorder wins when two devices merge.
let listPickId = null;
function moveItem(arr, fromIdx, toIdx) {
  if (fromIdx < 0 || toIdx < 0 || fromIdx >= arr.length || toIdx >= arr.length || fromIdx === toIdx) return false;
  const [item] = arr.splice(fromIdx, 1);
  arr.splice(toIdx, 0, item);
  return true;
}
function listScroller(el) {
  for (let p = el.parentElement; p; p = p.parentElement) {
    const oy = getComputedStyle(p).overflowY;
    if ((oy === 'auto' || oy === 'scroll') && p.scrollHeight > p.clientHeight) return p;
  }
  return document.scrollingElement || document.documentElement;
}
function setupListInteractions(list, arr, onOpen, onChange, owner, acts) {
  const changed = () => { if (owner) owner.ordAt = Date.now(); onChange(); };
  const rows = () => Array.from(list.querySelectorAll('.item-row'));
  const renumber = () => rows().forEach((r, i) => { const n = r.querySelector('.item-num'); if (n) n.textContent = String(i + 1).padStart(2, '0'); });
  if (listPickId) { const r = rows().find(x => x.dataset.id === listPickId); if (r) r.classList.add('pick'); else listPickId = null; }
  list.querySelectorAll('.item-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.drag-handle')) return;
      const act = e.target.closest('[data-act]');
      if (act) {
        e.stopPropagation();
        const id = row.dataset.id;
        if (act.dataset.act === 'up' || act.dataset.act === 'down') {
          const i = arr.findIndex(x => x.id === id);
          listPickId = id;
          if (moveItem(arr, i, i + (act.dataset.act === 'up' ? -1 : 1))) changed();
          return;
        }
        if (acts && (act.dataset.act === 'edit' || act.dataset.act === 'del')) { acts[act.dataset.act](id); return; }
        if (act.dataset.act === 'edit') {
          const kind = state.view === 'mokcha' ? 'mok' : 'sebu';
          openItemModal(kind, 'edit', id);
        }
        if (act.dataset.act === 'del') {
          const kind = state.view === 'mokcha' ? 'mok' : 'sebu';
          confirmDeleteItem(kind, id);
        }
        return;
      }
      if (listPickId) { listPickId = null; rows().forEach(r => r.classList.remove('pick')); return; }
      onOpen(row.dataset.id);
    });

    const handle = row.querySelector('.drag-handle');
    if (!handle) return;
    let drag = null;
    handle.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (drag) return;
      e.preventDefault();
      try { handle.setPointerCapture(e.pointerId); } catch (_) {}
      const sc = listScroller(list);
      drag = { id: e.pointerId, y0: e.clientY, y: e.clientY, s0: sc.scrollTop, sc, moved: false, raf: 0, order0: rows().map(r => r.dataset.id) };
    });
    const place = () => {
      if (!drag) return;
      // keep the row under the finger; swap with neighbours past their middle
      row.style.transform = '';
      let r = row.getBoundingClientRect();
      const mid = drag.y - drag.off;
      let prev = row.previousElementSibling, next = row.nextElementSibling;
      while (prev && prev.classList.contains('item-row')) {
        const pr = prev.getBoundingClientRect();
        if (mid < pr.top + pr.height / 2) { list.insertBefore(prev, row.nextSibling); prev = row.previousElementSibling; next = row.nextElementSibling; } else break; // move the neighbour, never the captured row
      }
      while (next && next.classList.contains('item-row')) {
        const nr = next.getBoundingClientRect();
        if (mid > nr.top + nr.height / 2) { list.insertBefore(next, row); next = row.nextElementSibling; } else break;
      }
      r = row.getBoundingClientRect();
      row.style.transform = `translateY(${Math.round(mid - (r.top + r.height / 2))}px)`;
      renumber();
    };
    const tick = () => {
      if (!drag) return;
      drag.raf = 0;
      const vh = window.innerHeight || 800, edge = 70;
      let v = 0;
      if (drag.y < edge) v = -Math.ceil((edge - drag.y) / 4);
      else if (drag.y > vh - edge) v = Math.ceil((drag.y - (vh - edge)) / 4);
      if (v) {
        const before = drag.sc.scrollTop; drag.sc.scrollTop += v;
        if (drag.sc.scrollTop !== before) { place(); drag.raf = requestAnimationFrame(tick); }
      }
    };
    handle.addEventListener('pointermove', (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      e.preventDefault();
      drag.y = e.clientY;
      if (!drag.moved) {
        if (Math.abs(drag.y - drag.y0) < 6) return;
        drag.moved = true;
        const r = row.getBoundingClientRect();
        drag.off = drag.y0 - (r.top + r.height / 2);
        listPickId = null; rows().forEach(x => x.classList.remove('pick'));
        row.classList.add('dragging');
      }
      place();
      if (!drag.raf) drag.raf = requestAnimationFrame(tick);
    });
    const end = (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      const d = drag; drag = null;
      if (d.raf) cancelAnimationFrame(d.raf);
      try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
      row.classList.remove('dragging'); row.style.transform = '';
      if (!d.moved) {
        if (e.type === 'pointercancel') return;
        // tap on ⋮⋮ → show ▲▼ for this row (tap again to hide)
        const on = !row.classList.contains('pick');
        rows().forEach(x => x.classList.remove('pick'));
        listPickId = on ? row.dataset.id : null;
        if (on) row.classList.add('pick');
        return;
      }
      const ids = rows().map(r => r.dataset.id);
      if (e.type === 'pointercancel' && ids.join() === d.order0.join()) return;
      if (reorderByIds(arr, ids)) changed(); else renumber();
    };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
    handle.addEventListener('contextmenu', (e) => e.preventDefault());
  });
}

    item = isMok ? nb.mokchas.find(m => m.id === id) : mok.sebus.find(s => s.id === id);
  }
  const title = mode === 'add'
    ? (isMok ? '목차 추가' : '세부목차 추가')
    : (isMok ? '목차 이름 변경' : '세부목차 이름 변경');

  $('#btn-mode-kb').classList.toggle('active', kb);
  const layer = $('#text-layer');
  const w = wrap();
  if (layer) layer.classList.toggle('kb-active', kb);
  if (w) w.classList.toggle('kb-mode', kb);
  const addBtn = $('#btn-add-text');
  if (addBtn) addBtn.classList.toggle('visible', kb);
  if (kb) toast('자판 모드 — 「생성하기」로 텍스트 추가');
  else toast('펜 모드');
  renderTextLayer();
}

function renderTextLayer() {
  const layer = $('#text-layer');
  if (!layer) return;
  const texts = getTexts();
  const selected = state.selectedTextId;
  layer.innerHTML = texts.map(t => `
    <div class="text-box${t.id === selected ? ' selected' : ''}" data-id="${esc(t.id)}"
         style="left:${t.x}px;top:${t.y}px;width:${t.w || 200}px;height:${t.h || 48}px;">
      <div class="tb-bar">
        <span class="tb-drag">⋮⋮ 이동</span>
        <button type="button" class="tb-del" title="삭제">✕</button>
      </div>
      <textarea placeholder="내용을 입력하세요…">${esc(t.text || '')}</textarea>
      <div class="tb-resize" title="너비 조절" aria-hidden="true"></div>
    </div>`).join('');

  layer.querySelectorAll('.text-box').forEach(box => {
    const id = box.dataset.id;
    const ta = box.querySelector('textarea');
    const bar = box.querySelector('.tb-bar');
    const del = box.querySelector('.tb-del');

    ta.addEventListener('focus', () => {
      state.selectedTextId = id;
      layer.querySelectorAll('.text-box').forEach(b => b.classList.toggle('selected', b.dataset.id === id));
    });
    // Ensure soft keyboard can target the field (some tablet WebViews blur on remount/resize)
    ta.addEventListener('pointerdown', (e) => {
      if (state.inputMode !== 'keyboard') return;
      e.stopPropagation();
      try { ta.focus(); } catch (_) {}
    });
    ta.addEventListener('input', () => {
      const texts = getTexts();
      const item = texts.find(x => x.id === id);
      if (item) { item.text = ta.value; scheduleSave(); }
    });
    // persist size on resize (mouseup / blur)
    const saveSize = () => {
      const texts = getTexts();
      const item = texts.find(x => x.id === id);
      if (!item) return;
      item.w = Math.max(60, box.offsetWidth);
      item.h = Math.max(36, box.offsetHeight);
      scheduleSave();
    };
    ta.addEventListener('mouseup', saveSize);
    ta.addEventListener('blur', saveSize);

    del.addEventListener('click', (e) => {
      e.stopPropagation();
      // 글자가 들어 있는 텍스트 상자는 ✕를 잘못 눌러도 바로 사라지지 않게 한 번 확인 (실행취소로 되돌릴 수 없음)
      if ((ta.value || '').trim() && !confirm('이 텍스트를 지울까요?')) return;
      setTexts(getTexts().filter(x => x.id !== id));
      if (state.selectedTextId === id) state.selectedTextId = null;
      scheduleSave();
      renderTextLayer();
      toast('텍스트 삭제됨');
    });

    // Drag to move
    let dragging = false, ox = 0, oy = 0, startX = 0, startY = 0;
    const onMove = (e) => {
      if (!dragging) return;
      const cx = e.clientX != null ? e.clientX : (e.touches && e.touches[0].clientX);
      const cy = e.clientY != null ? e.clientY : (e.touches && e.touches[0].clientY);
      const z = drawZoom || 1;
      let nx = startX + (cx - ox) / z;
      let ny = startY + (cy - oy) / z;
      nx = Math.max(0, Math.min(CSS_W - 40, nx));
      ny = Math.max(0, Math.min(CSS_H - 24, ny));
      box.style.left = nx + 'px';
      box.style.top = ny + 'px';
    };
    const onUp = (e) => {
      if (!dragging) return;
      dragging = false;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      const texts = getTexts();
      const item = texts.find(x => x.id === id);
      if (item) {
        item.x = parseFloat(box.style.left) || 0;
        item.y = parseFloat(box.style.top) || 0;
        scheduleSave();
      }
    };
    bar.addEventListener('pointerdown', (e) => {
      if (state.inputMode !== 'keyboard') return;
      if (e.target.closest('.tb-del')) return;
      e.preventDefault();
      dragging = true;
      state.selectedTextId = id;
      ox = e.clientX; oy = e.clientY;
      startX = parseFloat(box.style.left) || 0;
      startY = parseFloat(box.style.top) || 0;
      try { bar.setPointerCapture(e.pointerId); } catch (_) {}
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });

    // Right-edge drag handle: widen text box (keyboard mode only)
    const resizeHandle = box.querySelector('.tb-resize');
    if (resizeHandle) {
      let resizing = false, rx0 = 0, rw0 = 0;
      const onRMove = (e) => {
        if (!resizing) return;
        const cx = e.clientX != null ? e.clientX : (e.touches && e.touches[0].clientX);
        const z = drawZoom || 1;
        const left = parseFloat(box.style.left) || 0;
        let nw = rw0 + (cx - rx0) / z;
        nw = Math.max(60, Math.min(CSS_W - left, nw));
        box.style.width = nw + 'px';
      };
      const onRUp = () => {
        if (!resizing) return;
        resizing = false;
        document.removeEventListener('pointermove', onRMove);
        document.removeEventListener('pointerup', onRUp);
        document.removeEventListener('pointercancel', onRUp);
        const texts = getTexts();
        const item = texts.find(x => x.id === id);
        if (item) {
          item.w = Math.max(60, parseFloat(box.style.width) || box.offsetWidth);
          scheduleSave();
        }
      };
      resizeHandle.addEventListener('pointerdown', (e) => {
        if (state.inputMode !== 'keyboard') return;
        e.preventDefault();
        e.stopPropagation();
        resizing = true;
        state.selectedTextId = id;
        rx0 = e.clientX;
        rw0 = parseFloat(box.style.width) || box.offsetWidth || 200;
        try { resizeHandle.setPointerCapture(e.pointerId); } catch (_) {}
        document.addEventListener('pointermove', onRMove);
        document.addEventListener('pointerup', onRUp);
        document.addEventListener('pointercancel', onRUp);
      });
    }
  });
}

function overlapsExisting(x, y, w, h, texts) {
  const pad = 8;
  return texts.some(t => {
    const tw = t.w || 200, th = t.h || 56;
    return !(x + w + pad < t.x || t.x + tw + pad < x || y + h + pad < t.y || t.y + th + pad < y);
  });
}

/** Create a text box at the center of the current scroll viewport (page coords), offset if overlapping. */
function createTextBoxFromButton() {
  if (state.inputMode !== 'keyboard') {
    setInputMode('keyboard');
  }
  const wEl = wrap();
  const stage = $('#page-stage');
  if (!wEl || !stage) return;
  const wrapRect = wEl.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  // Center of visible viewport, mapped into page-stage CSS coords
  const viewCx = wrapRect.left + wrapRect.width / 2;
  const viewCy = wrapRect.top + wrapRect.height / 2;
  const scaleX = CSS_W / Math.max(1, stageRect.width);
  const scaleY = CSS_H / Math.max(1, stageRect.height);
  const boxW = Math.min(240, CSS_W - 40);
  const boxH = 56;
  let x = (viewCx - stageRect.left) * scaleX - boxW / 2;
  let y = (viewCy - stageRect.top) * scaleY - boxH / 2;
  x = Math.max(8, Math.min(CSS_W - boxW - 8, x));
  y = Math.max(8, Math.min(CSS_H - boxH - 8, y));

  const texts = getTexts();
  let guard = 0;
  while (overlapsExisting(x, y, boxW, boxH, texts) && guard < 24) {
    x = Math.max(8, Math.min(CSS_W - boxW - 8, x + 28));
    y = Math.max(8, Math.min(CSS_H - boxH - 8, y + 36));
    guard++;
  }

  const t = { id: uid(), x, y, w: boxW, h: boxH, text: '' };
  texts.push(t);
  setTexts(texts);
  state.selectedTextId = t.id;
  scheduleSave();
  renderTextLayer();
  const focusTa = () => {
    const ta = $(`.text-box[data-id="${t.id}"] textarea`);
    if (!ta) return;
    try { ta.focus({ preventScroll: false }); } catch (_) { ta.focus(); }
  };
  focusTa();
  requestAnimationFrame(focusTa);
}

/* Tap on empty page in 자판 mode: do nothing (only edit existing boxes). */
function onTextLayerPointerDown(e) {
  // intentionally no-op for empty area; .text-box handles its own events
}

function drawTextsOnCtx(ctx) {
  const texts = getTexts();
  ctx.save();
  ctx.textBaseline = 'top';
  for (const t of texts) {
    if (!t.text) continue;
    const fontSize = 15;
    ctx.font = fontSize + 'px ' + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = '#18181b';
    const maxW = (t.w || 200) - 16;
    const lines = [];
    const paragraphs = String(t.text).split('\n');
    for (const para of paragraphs) {
      if (!para) { lines.push(''); continue; }
      let line = '';
      for (const ch of para) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxW && line) {
          lines.push(line);
          line = ch;
        } else line = test;
      }
      lines.push(line);
    }
    let yy = t.y + 8;
    // if bar was shown in kb mode we don't draw bar in export
    for (const line of lines) {
      ctx.fillText(line, t.x + 8, yy);
      yy += fontSize * 1.45;
    }
  }
  ctx.restore();
}

function initDrawPage() {
  const nb = getNb();
  const mok = getMok();
  const sebu = getSebu();
  if (!nb || !mok || !sebu) { goSebu(state.mokId); return; }

  $('#draw-crumb').textContent = mok.title + ' › ' + sebu.title;
  state.bg = sebu.bg || 'lined';
  state.showGuides = sebu.guidesVisible !== false;
  state.undoStack = [];
  state.redoStack = [];
  lassoClear();
  imgSel = null;
  setTimeout(() => { renderImages(); applyImgMode(); }, 0);
  state.drawing = false;
  state.currentStroke = null;
  state.pointers.clear();

  // sync toolbar
  $$('.tool-btn[data-tool]').forEach(b => {
    const isPen = b.dataset.tool === 'pen' && b.dataset.color === state.color && state.tool === 'pen';
    const isHl = b.dataset.tool === 'highlighter' && state.tool === 'highlighter';
    const isEr = b.dataset.tool === 'eraser' && state.tool === 'eraser';
    b.classList.toggle('active', isPen || isHl || isEr || (state.tool === 'pen' && b.dataset.tool === 'pen' && b.dataset.color === state.color));
  });
  // Fix active color buttons
  $$('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
  if (state.tool === 'pen') {
    const btn = $(`.tool-btn[data-tool="pen"][data-color="${state.color}"]`);
    if (btn) btn.classList.add('active');
  } else {
    const btn = (state.tool === 'highlighter' && $(`.tool-btn[data-tool="highlighter"][data-color="${state.color}"]`)) || $(`.tool-btn[data-tool="${state.tool}"]`);
    if (btn) btn.classList.add('active');
  }
  $$('.thickness-btn').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.w) === state.width));
  $('#btn-bg-lined').classList.toggle('active', state.bg === 'lined');
  $('#btn-bg-grid').classList.toggle('active', state.bg === 'grid');
  $('#btn-bg-blank').classList.toggle('active', state.bg === 'blank');
  applyFingerModeUI();

  CSS_H = sebu.pageHeight || 1200;
  {
    // never hide content below the stored sheet count (e.g. pageHeight older than strokes)
    let maxY = 0;
    const pg = ensurePage();
    // Reuse the same bounds as viewport culling; revisiting a note need not scan
    // every historical point just to recover its sheet count.
    (pg ? pg.strokes : []).forEach(st => {
      if (st && st.points && st.points.length) {
        const y = strokeBox(st).rawY1;
        if (y > maxY) maxY = y;
      }
    });
    (pg && pg.images || []).forEach(im => { if (im.y + im.h > maxY) maxY = im.y + im.h; });
    (pg && pg.notes || []).forEach(o => { const b = o.y + (o.f ? 40 : (o.h || 150)); if (b > maxY) maxY = b; });
    if (maxY > CSS_H) CSS_H = Math.ceil((maxY + 20) / 1200) * 1200;
  }
  {
    // narrow screen: show the whole page width
    const f = fitZoom();
    if (f < 1 && drawZoom <= 1 && drawZoom > f + 0.001) { drawZoom = f; try { localStorage.setItem(ZOOM_KEY, String(f)); } catch (e) {} }
  }
  resizeCanvas();
  redrawAll();
  updateGuideOverlay();
  renderTextLayer();
  // sync mode UI without toast
  {
    const kb = state.inputMode === 'keyboard';
    $('#btn-mode-pen').classList.toggle('active', !kb);
    $('#btn-mode-kb').classList.toggle('active', kb);
    const layer = $('#text-layer');
    const w = wrap();
    if (layer) layer.classList.toggle('kb-active', kb);
    if (w) w.classList.toggle('kb-mode', kb);
    const addBtn = $('#btn-add-text');
    if (addBtn) addBtn.classList.toggle('visible', kb);
  }
  applyZoomTransform();
  updateUndoBtns();
}

function getInkCtx() {
  const c = canvas();
  if (!c) return null;
  if (inkCtxCache && inkCtxCanvas === c) return inkCtxCache;
  let ctx = null;
    if (!ctx) {
    try { ctx = c.getContext('2d', { alpha: true }); } catch (_) {}
  }
  if (!ctx) ctx = c.getContext('2d');
  inkCtxCache = ctx;
  inkCtxCanvas = c;
  return ctx;
}

function sizeOneCanvas(c) {
  if (!c) return;
  const nw = Math.ceil(VW * DPR), nh = Math.ceil(VH * DPR);
  if (c.width !== nw || c.height !== nh) { c.width = nw; c.height = nh; }
  c.style.left = VX + 'px'; c.style.top = VY + 'px';
  c.style.width = VW + 'px';
  c.style.height = VH + 'px';
  if (c.id === 'drawCanvas') {
    inkCtxCache = null;
    inkCtxCanvas = null;
  }
  const ctx = (c.id === 'drawCanvas') ? getInkCtx() : c.getContext('2d');
  if (ctx) inkT(ctx);
}

function resizeCanvas() {
  const c = canvas();
  const bg = bgCanvas();
  const w = wrap();
  if (!c || !w) return;
  // Crisp at zoom; canvases are viewport-sized so this no longer scales with page height
  DPR_TARGET = Math.min((window.devicePixelRatio || 1) * Math.max(1, (typeof drawZoom === 'number' ? drawZoom : 1)), 3);
  if (DPR_TARGET > 1.5) DPR_TARGET = Math.floor(DPR_TARGET); // integer scale → exact pixel shifts on scroll
  // Fit width to container with max
  // v20: fixed page coordinate system (same on every device); small screens zoom out to fit
  CSS_W = PAGE_W;
  const stage = $('#page-stage');
  if (stage) {
    stage.style.width = CSS_W + 'px';
    stage.style.height = CSS_H + 'px';
  }
  applyZoomTransform();
  placeCanvases();
  const layer = $('#text-layer');
  if (layer) {
    layer.style.width = CSS_W + 'px';
    layer.style.height = CSS_H + 'px';
  }
  applyZoomTransform();
}

function drawBackground(ctx, region) {
  // Export defaults to the full page; screen redraw only submits visible lines.
  const r = region || { x: 0, y: 0, w: CSS_W, h: CSS_H };
  const x0 = Math.max(0, r.x), y0 = Math.max(0, r.y);
  const x1 = Math.min(CSS_W, r.x + r.w), y1 = Math.min(CSS_H, r.y + r.h);
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  if (state.bg === 'lined') {
    ctx.strokeStyle = '#e6e6e8'; ctx.lineWidth = 1; ctx.beginPath();
    for (let y = 40 + Math.max(0, Math.ceil((y0 - 40) / 28)) * 28; y < Math.min(CSS_H, y1 + 1); y += 28) {
      ctx.moveTo(20, y); ctx.lineTo(CSS_W - 20, y);
    }
    ctx.stroke();
    ctx.strokeStyle = '#e3dede'; ctx.beginPath();
    ctx.moveTo(48, y0); ctx.lineTo(48, y1); ctx.stroke();
  } else if (state.bg === 'grid') {
    ctx.strokeStyle = '#ececee'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = Math.ceil(x0 / 24) * 24; x < Math.min(CSS_W, x1 + 1); x += 24) {
      ctx.moveTo(x, y0); ctx.lineTo(x, y1);
    }
    for (let y = Math.ceil(y0 / 24) * 24; y < Math.min(CSS_H, y1 + 1); y += 24) {
      ctx.moveTo(x0, y); ctx.lineTo(x1, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

/** Constant selected width (no pressure / velocity). Old points may still carry `p`. */
function strokeLineWidth(stroke) {
  const w = stroke.width || 1.5;
  if (stroke.tool === 'eraser') return w * 4;
  if (stroke.tool === 'highlighter') return w * 3;
  return w;
}

/** Pressure + taper width for pen strokes recorded with a stylus (stroke.pr). Old strokes: constant. */
function segWidth(stroke, i, n, final) {
  const base = strokeLineWidth(stroke);
  if (!stroke.pr || stroke.tool !== 'pen') return base;
  const pt = stroke.points[i] || {};
  const pr = (typeof pt.p === 'number' && pt.p > 0) ? Math.min(1, pt.p) : 0.5;
  let f = 0.72 + 0.56 * pr;              // subtle: 0.72x .. 1.28x
  if (i < 3) f *= 0.7 + 0.1 * i;         // start taper
  return Math.max(0.6, base * f);
}

function drawPressureStroke(ctx, stroke) {
  const pts = stroke.points, n = pts.length;
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = stroke.color;
  ctx.fillStyle = stroke.color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (n === 1) {
    ctx.beginPath();
    ctx.arc(pts[0].x, pts[0].y, Math.max(segWidth(stroke, 0, 1, false) / 2, 0.5), 0, Math.PI * 2);
    ctx.fill(); ctx.restore(); return;
  }
  // Batch consecutive segments with (nearly) the same width into one path → far fewer stroke() calls
  let curW = -1, open = false;
  for (let i = 1; i < n; i++) {
    const a = pts[i - 1], b = pts[i];
    const wq = Math.round(((segWidth(stroke, i - 1, n, true) + segWidth(stroke, i, n, true)) / 2) * 5) / 5;
    if (wq !== curW) {
      if (open) ctx.stroke();
      ctx.beginPath(); ctx.lineWidth = wq; curW = wq; open = true;
      if (i >= 2) { const c0 = pts[i - 2]; ctx.moveTo((c0.x + a.x) / 2, (c0.y + a.y) / 2); }
      else ctx.moveTo(a.x, a.y);
    }
    if (i >= 2) ctx.quadraticCurveTo(a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2);
    else ctx.lineTo((a.x + b.x) / 2, (a.y + b.y) / 2);
  }
  if (open) ctx.stroke();
  ctx.restore();
}

function drawStroke(ctx, stroke) {
  if (!stroke || !stroke.points || stroke.points.length < 1) return;
  if (stroke.pr && stroke.tool === 'pen') { drawPressureStroke(ctx, stroke); return; }
  const pts = stroke.points;
  ctx.save();
  if (stroke.tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
  } else if (stroke.tool === 'highlighter') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = stroke.color;
    ctx.globalAlpha = 0.4;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = stroke.color;
  }
  const lineW = strokeLineWidth(stroke);
  ctx.lineWidth = lineW;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (pts.length === 1) {
    ctx.beginPath();
    const r = (stroke.tool === 'eraser' ? lineW / 2 : lineW / 2);
    ctx.arc(pts[0].x, pts[0].y, Math.max(r, 0.5), 0, Math.PI * 2);
    ctx.fillStyle = stroke.tool === 'eraser' ? 'rgba(0,0,0,1)' : stroke.color;
    if (stroke.tool === 'highlighter') ctx.globalAlpha = 0.4;
    ctx.fill();
    ctx.restore();
    return;
  }

  // Midpoint quadratic curves — smooth without changing stored points
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  if (pts.length === 2) {
    ctx.lineTo(pts[1].x, pts[1].y);
  } else {
    let prevMidX = pts[0].x;
    let prevMidY = pts[0].y;
    for (let i = 1; i < pts.length - 1; i++) {
      const midX = (pts[i].x + pts[i + 1].x) / 2;
      const midY = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
      prevMidX = midX;
      prevMidY = midY;
    }
    const last = pts[pts.length - 1];
    ctx.lineTo(last.x, last.y);
  }
  ctx.stroke();
  ctx.restore();
}

function redrawBackground() {
  const bg = bgCanvas();
  if (!bg) return;
  const ctx = bg.getContext('2d');
  inkT(ctx);
  ctx.clearRect(0, 0, CSS_W, CSS_H);
  drawBackground(ctx, { x: VX, y: VY, w: VW, h: VH });
}

function redrawInk() {
  const c = canvas();
  if (!c) return;
  const ctx = getInkCtx() || c.getContext('2d');
  inkT(ctx);
  // clear to transparent — eraser destination-out only affects ink here
  ctx.clearRect(0, 0, CSS_W, CSS_H);
  const strokes = getStrokes();
  for (const s of strokes) if (strokeVisible(s)) drawStroke(ctx, s);
  if (state.currentStroke) drawStroke(ctx, state.currentStroke);
  if (state.currentStroke) liveDrawnCount = state.currentStroke.points.length;
}

function redrawAll() {
  redrawBackground();
  redrawInk();
}

function updateGuideOverlay() {
  const ov = $('#guide-overlay');
  const nb = getNb();
  const sebu = getSebu();
  if (!ov || !nb || !sebu) return;
  if (!state.showGuides) {
    ov.classList.add('hidden');
    return;
  }
  const guides = (TEMPLATES[nb.type] || TEMPLATES.thought).guides;
  ov.classList.remove('hidden');
  ov.style.width = CSS_W + 'px';
  ov.style.height = CSS_H + 'px';
  ov.innerHTML = guides.map(g =>
    `<div class="guide-label" style="top:${g.y}px">${esc(g.text)}</div>`
  ).join('');
}

function canvasPosFromEvent(e, rect) {
  const r = rect || stageRect();
  const scaleX = CSS_W / Math.max(1, r.width);
  const scaleY = CSS_H / Math.max(1, r.height);
  // Keep `p` on points for format compatibility; width does NOT use it
  let p = 0.5;
  if (typeof e.pressure === 'number' && e.pressure > 0) p = e.pressure;
