<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GKC 학습노트 — 목차·세부목차·세부내용</title>
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface2: #f0f2f5;
  --border: #e2e5ea;
  --text: #1a1d23;
  --text2: #5c6370;
  --text3: #8b919c;
  --accent: #3b6cf0;
  --accent-soft: #e8effe;
  --danger: #e5484d;
  --danger-soft: #fdecec;
  --ok: #2a9d6a;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
  --radius: 12px;
  --toolbar-h: 52px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg); color: var(--text); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select {
  font-family: inherit; color: inherit;
  font-size: 16px; /* iOS: <16px + max-scale=1 blocks/breaks typing */
  -webkit-user-select: text; user-select: text;
}
button:disabled { opacity: .4; cursor: not-allowed; }
.hidden { display: none !important; }

/* ===== App Shell ===== */
#app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

/* Top bar */
.topbar {
  display: flex; align-items: center; gap: 8px;
  height: var(--toolbar-h); padding: 0 12px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 20;
}
.topbar h1 { font-size: 16px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .crumb { font-size: 13px; color: var(--text2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--text2); flex-shrink: 0;
}
.icon-btn:hover, .icon-btn:focus-visible { background: var(--surface2); color: var(--text); }
.icon-btn.active { background: var(--accent-soft); color: var(--accent); }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
.btn {
  height: 36px; padding: 0 14px; border-radius: 10px;
  font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface2); color: var(--text);
}
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--border); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12px; }

/* Views */
.view { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.view-body { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 16px; padding-bottom: calc(16px + var(--safe-b)); }

/* ===== Home / Notebooks ===== */
.hero {
  background: linear-gradient(135deg, #3b6cf0 0%, #6b4de6 100%);
  color: #fff; border-radius: var(--radius); padding: 20px 18px; margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.hero h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.hero p { font-size: 13px; opacity: .9; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.nb-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); cursor: pointer;
  display: flex; flex-direction: column; gap: 8px; transition: transform .12s, box-shadow .12s;
  position: relative; text-align: left;
}
.nb-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.nb-card .nb-icon { font-size: 28px; }
.nb-card .nb-title { font-size: 15px; font-weight: 700; word-break: break-word; }
.nb-card .nb-meta { font-size: 12px; color: var(--text3); }
.nb-card .nb-type {
  display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px;
  border-radius: 20px; width: fit-content;
}
.nb-card .nb-type.thought { background: #fff3e0; color: #c45c00; }
.nb-card .nb-type.concept { background: #e8f5e9; color: #2e7d32; }
.nb-card .nb-actions {
  position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; opacity: 0; transition: opacity .15s;
}
.nb-card:hover .nb-actions, .nb-card:focus-within .nb-actions { opacity: 1; }
@media (hover: none) { .nb-card .nb-actions { opacity: 1; } }
.add-card {
  border: 2px dashed var(--border); background: transparent; box-shadow: none;
  align-items: center; justify-content: center; color: var(--text3); min-height: 120px;
}
.add-card:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ===== List (목차 / 세부목차) ===== */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; gap: 8px; flex-wrap: wrap;
}
.section-head h2 { font-size: 18px; font-weight: 700; }
.type-badge {
  font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px;
}
.type-badge.thought { background: #fff3e0; color: #c45c00; }
.type-badge.concept { background: #e8f5e9; color: #2e7d32; }

.item-list { display: flex; flex-direction: column; gap: 8px; }
.item-row {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; display: flex; align-items: center; gap: 10px;
  box-shadow: var(--shadow); cursor: pointer; transition: background .1s;
}
.item-row:hover { background: #fafbfd; }
.item-row .drag-handle {
  color: var(--text3); cursor: grab; font-size: 16px; padding: 4px; touch-action: none;
  user-select: none;
}
.item-row .item-num {
  width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;
}
.item-row .item-body { flex: 1; min-width: 0; }
.item-row .item-title { font-size: 15px; font-weight: 600; word-break: break-word; }
.item-row .item-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
.item-row .item-actions { display: flex; gap: 2px; flex-shrink: 0; }
.item-row.dragging { opacity: .5; }
.item-row.drag-over { border-color: var(--accent); background: var(--accent-soft); }

.empty-state {
  text-align: center; padding: 48px 20px; color: var(--text3);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; line-height: 1.5; margin-bottom: 16px; }

/* ===== Tree / Overview ===== */
.tree-list { display: flex; flex-direction: column; gap: 4px; }
.tree-mok {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; margin-bottom: 8px;
}
.tree-mok-head {
  display: flex; align-items: center; gap: 8px; padding: 12px 14px;
  cursor: pointer; font-weight: 700; font-size: 15px;
  background: var(--surface2);
}
.tree-mok-head:hover { background: #e8eaed; }
.tree-sebu {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px 10px 40px;
  border-top: 1px solid var(--border); cursor: pointer; font-size: 14px;
}
.tree-sebu:hover { background: var(--accent-soft); }
.tree-sebu .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

/* ===== Drawing Page ===== */
#view-draw { background: #e8e4dc; }
.draw-toolbar {
  display: flex; align-items: center; gap: 4px; padding: 6px 8px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  overflow-x: auto; flex-shrink: 0; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.draw-toolbar::-webkit-scrollbar { display: none; }
.tool-group {
  display: flex; align-items: center; gap: 2px; padding: 0 4px;
  border-right: 1px solid var(--border); flex-shrink: 0;
}
.tool-group:last-child { border-right: none; }
.tool-btn {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  color: var(--text2); position: relative;
}
.tool-btn:hover { background: var(--surface2); }
.tool-btn.active { background: var(--accent-soft); color: var(--accent); }
.tool-btn .swatch {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent;
}
.tool-btn.active .swatch { border-color: var(--accent); box-shadow: 0 0 0 2px #fff inset; }
.swatch.black { background: #1a1a1a; }
.swatch.blue { background: #2563eb; }
.swatch.red { background: #dc2626; }
.swatch.hl { background: #fef08a; border: 1px solid #eab308 !important; }
.thickness-btn {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.thickness-btn span {
  display: block; border-radius: 50%; background: currentColor;
}
.thickness-btn.active { background: var(--accent-soft); color: var(--accent); }#lasso-layer { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:5; }
#lasso-svg { position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; }
#lasso-menu { position:absolute; display:none; gap:4px; pointer-events:auto; background:#fff; border:1px solid var(--border, #ddd);
  border-radius:10px; padding:4px; box-shadow:0 4px 14px rgba(0,0,0,.15); transform:translate(-50%, -100%); white-space:nowrap; }
#lasso-menu.show { display:flex; }
#lasso-menu button { border:0; background:transparent; padding:6px 12px; border-radius:8px; font-size:14px; cursor:pointer; color:var(--text, #222); }
#lasso-menu button:hover { background:var(--accent-soft, #eef); }
#lasso-menu button[data-act="del"] { color:#dc2626; }

.canvas-wrap {
  flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
  position: relative; touch-action: pan-y pan-x;
  overscroll-behavior: contain;
}
.canvas-wrap.finger-pan { touch-action: pan-y pan-x; }
.canvas-wrap.finger-draw { touch-action: none; }
.canvas-wrap.drawing { touch-action: none; overflow: hidden; }
.canvas-wrap.pinching { touch-action: none; overflow: hidden; }
#zoom-sizer {
  margin: 8px auto;
  position: relative;
}
#drawCanvas {
  display: block; cursor: crosshair;
  background: transparent;
}
/* Canvas always none: JS handles 이동(pan) vs 쓰기(draw); wrap still scrolls. */
#drawCanvas, .canvas-wrap.finger-draw #drawCanvas,
.canvas-wrap.finger-pan #drawCanvas,
.canvas-wrap.drawing #drawCanvas,
.canvas-wrap.pinching #drawCanvas { touch-action: none; }
.finger-mode-btn {
  width: auto !important; min-width: 36px; padding: 0 8px !important;
  font-size: 11px !important; font-weight: 700; white-space: nowrap;
}
.zoom-group { display: flex; align-items: center; gap: 2px; }
.zoom-btn {
  min-width: 36px; height: 36px; padding: 0 8px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: var(--text2);
}
.zoom-btn:hover { background: var(--surface2); color: var(--text); }
.zoom-label {
  min-width: 48px; height: 36px; padding: 0 6px; border-radius: 8px;
  font-size: 12px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; justify-content: center;
}
.zoom-label:hover { background: var(--accent-soft); color: var(--accent); }
.guide-label {
  position: absolute; left: 24px; padding: 2px 0;
  border-bottom: 1px dashed rgba(0,0,0,.08); width: calc(100% - 48px);
}

/* ===== Text boxes (자판 mode) ===== */
.mode-toggle {
  display: flex; align-items: center; background: var(--surface2);
  border-radius: 10px; padding: 2px; gap: 2px; flex-shrink: 0;
}
.mode-toggle button {
  height: 32px; padding: 0 12px; border-radius: 8px;
  font-size: 12px; font-weight: 700; color: var(--text2);
}
.mode-toggle button.active {
  background: var(--accent); color: #fff;
}
#page-stage {
  position: relative;
  margin: 0;
  width: fit-content;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  background: #fffef8;
  transform-origin: 0 0;
}
#bgCanvas, #drawCanvas {
  display: block;
  margin: 0;
  box-shadow: none;
  position: absolute;
  top: 0; left: 0;
}
#bgCanvas { z-index: 0; pointer-events: none; }
#img-layer { position:absolute; left:0; top:0; width:100%; height:100%; z-index:1; pointer-events:none; }
#img-layer.active { z-index:4; }
#img-layer.active .img-item { pointer-events:auto; cursor:move; touch-action:none; }
.img-item { position:absolute; user-select:none; -webkit-user-select:none; }
.img-item img { width:100%; height:100%; display:block; pointer-events:none; -webkit-user-drag:none; }
.img-item.sel { outline:2px dashed #2563eb; outline-offset:2px; }
.img-item .img-rs, .img-item .img-del { display:none; }
.img-item.sel .img-rs { display:block; position:absolute; right:-12px; bottom:-12px; width:24px; height:24px; border-radius:50%;
  background:#2563eb; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); cursor:nwse-resize; touch-action:none; }
.img-item.sel .img-del { display:block; position:absolute; left:50%; top:-40px; transform:translateX(-50%); border:1px solid var(--border, #ddd);
  background:#fff; color:#dc2626; border-radius:10px; padding:5px 12px; font-size:14px; box-shadow:0 4px 14px rgba(0,0,0,.15); cursor:pointer; white-space:nowrap; }
#drawCanvas {
  z-index: 1;
  cursor: crosshair;
  background: transparent;
}
.guide-overlay {
  position: absolute; top: 0; left: 0;
  transform: none;
  pointer-events: none; z-index: 1;
  color: rgba(0,0,0,.12); font-size: 13px; font-weight: 600;
}
#text-layer {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 2; pointer-events: none;
}
#text-layer.kb-active { pointer-events: auto; cursor: default; }
.canvas-wrap:not(.kb-mode) #text-layer:not(.kb-active),
.canvas-wrap:not(.kb-mode) #text-layer:not(.kb-active) * { pointer-events: none !important; touch-action: none !important; }
#btn-add-text { display: none; height: 32px; padding: 0 12px; border-radius: 8px;
  font-size: 12px; font-weight: 700; background: var(--accent); color: #fff; white-space: nowrap; }
#btn-add-text.visible { display: inline-flex; align-items: center; }
.canvas-wrap.kb-mode #drawCanvas { cursor: default; }
.text-box {
  position: absolute;
  min-width: 60px; min-height: 36px;
  background: rgba(255,255,255,.72);
  border: 1.5px solid rgba(59,108,240,.35);
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  pointer-events: auto;
  display: flex; flex-direction: column;
  z-index: 3;
}
.text-box .tb-resize {
  display: none;
  position: absolute;
  top: 0; right: -6px;
  width: 14px; height: 100%;
  cursor: ew-resize;
  touch-action: none;
  z-index: 4;
  user-select: none;
}
.text-box .tb-resize::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 4px; height: 28px;
  border-radius: 2px;
  background: rgba(59,108,240,.55);
}
#text-layer.kb-active .text-box .tb-resize { display: block; }
#text-layer:not(.kb-active) .text-box .tb-resize { display: none !important; pointer-events: none !important; }
.text-box.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.text-box .tb-bar {
  display: none; align-items: center; gap: 4px;
  padding: 2px 4px; background: rgba(59,108,240,.08);
  border-bottom: 1px solid rgba(59,108,240,.15);
  cursor: grab; user-select: none; touch-action: none;
}
#text-layer.kb-active .text-box .tb-bar { display: flex; }
.text-box .tb-bar .tb-drag { flex: 1; font-size: 11px; color: var(--text3); padding-left: 4px; }
.text-box .tb-bar button {
  width: 24px; height: 24px; border-radius: 6px; font-size: 12px;
  display: flex; align-items: center; justify-content: center; color: var(--text2);
}
.text-box .tb-bar button:hover { background: var(--danger-soft); color: var(--danger); }
.text-box textarea {
  flex: 1; width: 100%; min-height: 32px; border: none; outline: none;
  background: transparent; resize: both; padding: 6px 8px;
  font-size: 16px; line-height: 1.45; font-family: var(--font);
  color: var(--text); overflow: auto;
  -webkit-user-select: text; user-select: text;
}
#text-layer:not(.kb-active) .text-box {
  border-color: transparent; background: transparent; box-shadow: none;
  pointer-events: none;
}
#text-layer:not(.kb-active) .text-box textarea { resize: none; pointer-events: none; }
.canvas-wrap.kb-mode #drawCanvas { cursor: default; pointer-events: none; }
@media print {
  .text-box { border: none !important; background: transparent !important; box-shadow: none !important; }
  .text-box .tb-bar { display: none !important; }
  .text-box .tb-resize { display: none !important; }
  .text-box textarea { resize: none !important; }
}


/* ===== Modals ===== */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0; animation: fadeIn .15s;
}
@media (min-width: 560px) {
  .modal-backdrop { align-items: center; padding: 20px; }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface); border-radius: 16px 16px 0 0;
  width: 100%; max-width: 420px; max-height: 85vh; overflow: auto;
  padding: 20px; padding-bottom: calc(20px + var(--safe-b));
  animation: slideUp .2s;
}
@media (min-width: 560px) {
  .modal { border-radius: 16px; }
}
@keyframes slideUp { from { transform: translateY(40px); } to { transform: translateY(0); } }
.modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
.modal label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
.modal .field { margin-bottom: 14px; }
.modal input[type=text], .modal textarea, .modal select {
  width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--border);
  border-radius: 10px; font-size: 16px; background: var(--bg); outline: none;
  -webkit-user-select: text; user-select: text;
}
.modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--accent); }
.modal textarea { height: auto; min-height: 80px; padding: 10px 12px; resize: vertical; }
.type-picker { display: flex; gap: 8px; }
.type-opt {
  flex: 1; padding: 14px 10px; border: 2px solid var(--border); border-radius: 12px;
  text-align: center; cursor: pointer; transition: all .15s;
}
.type-opt:hover { border-color: var(--accent); }
.type-opt.selected { border-color: var(--accent); background: var(--accent-soft); }
.type-opt .to-icon { font-size: 28px; margin-bottom: 6px; }
.type-opt .to-title { font-size: 14px; font-weight: 700; }
.type-opt .to-desc { font-size: 11px; color: var(--text3); margin-top: 4px; line-height: 1.3; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.hw-title-wrap {
  border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  background: #fffef8; margin-top: 6px;
}
.hw-title-wrap canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
.hw-title-bar { display: flex; gap: 4px; padding: 6px; background: var(--surface2); border-top: 1px solid var(--border); }

/* Toast */
.toast {
  position: fixed; bottom: calc(24px + var(--safe-b)); left: 50%; transform: translateX(-50%);
  background: #1a1d23; color: #fff; padding: 10px 18px; border-radius: 24px;
  font-size: 13px; font-weight: 500; z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .2s; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
}
.toast.show { opacity: 1; }

/* Context menu */
.ctx-menu {
  position: fixed; z-index: 150; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 6px; min-width: 160px;
}
.ctx-menu button {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px;
  border-radius: 8px; font-size: 14px; text-align: left;
}
.ctx-menu button:hover { background: var(--surface2); }
.ctx-menu button.danger { color: var(--danger); }


.modal input[type=password], .modal input.pw-input {
  width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--border);
  border-radius: 10px; font-size: 16px; background: var(--bg); outline: none;
  -webkit-user-select: text; user-select: text;
}
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 46px !important; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 38px; height: 34px;
  border: 0; background: transparent; font-size: 18px; cursor: pointer; border-radius: 8px; opacity: .55; }
.pw-eye.on { opacity: 1; background: var(--accent-soft, #eef); }

<script>
(function () {
'use strict';

const SYNC_URL = 'https://gkc-notes-sync.youngja1479.workers.dev';

/* ========== Utils ========== */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ========== Storage (IndexedDB + localStorage fallback) ========== */
const DB_NAME = 'gkc-study-notes';
const DB_VER = 1;
const STORE = 'data';
const LS_KEY = 'gkc-study-notes-v1';

function openDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { resolve(null); return; }
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}

async function idbGet(key) {
  const db = await openDB();
  if (!db) return null;
  return new Promise((resolve) => {
    try {
      const tx = db.transaction(STORE, 'readonly');
      const r = tx.objectStore(STORE).get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

async function idbSet(key, val) {
  const db = await openDB();
  if (!db) return false;
  return new Promise((resolve) => {
    try {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(val, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    } catch (e) { resolve(false); }
  });
}

const defaultData = () => ({
  version: 1,
  notebooks: [],
  updatedAt: 0
});

let DATA = defaultData();
let saveTimer = null;

async function loadData() {
  let d = await idbGet('app');
  if (!d) {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) d = JSON.parse(raw);
    } catch (e) {}
  }
  if (d && Array.isArray(d.notebooks)) DATA = d;
  else DATA = defaultData();
}

function scheduleSave() {
  DATA.updatedAt = Date.now();
  clearTimeout(saveTimer);
  // Debounced + deferred: never serialize while the pen is down
  saveTimer = setTimeout(function trySave() {
    let busy = false; try { busy = !!state.drawing; } catch (_) {}
    if (busy) { saveTimer = setTimeout(trySave, 400); return; }
    if (window.requestIdleCallback) requestIdleCallback(() => doSave(), { timeout: 2000 }); else doSave();
  }, 2000);
}

/** localStorage copy is a fallback only — strip heavy image data (kept in IndexedDB). */
let lsLastSave = 0, lsTooBig = 0;
function lsSaveData(force) {
  const now = Date.now();
  if (!force && now - lsLastSave < 30000) return;          // fallback copy at most every 30s
  if (!force && lsTooBig && now - lsTooBig < 300000) return; // quota hit recently → don't re-stringify
  lsLastSave = now;
  try { localStorage.setItem(LS_KEY, JSON.stringify(DATA, (k, v) => (k === 'src' && typeof v === 'string' && v.startsWith('data:')) ? undefined : v)); lsTooBig = 0; } catch (e) { lsTooBig = Date.now(); }
}
let saveWarned = false;
async function doSave() {
  const ok = await idbSet('app', DATA);
  if (!ok && !saveWarned) { saveWarned = true; toast('저장 공간이 부족합니다 — 이미지를 줄이거나 삭제해 주세요'); }
  if (ok) saveWarned = false;
  lsSaveData();
  scheduleSyncPush();
  return ok;
}

async function flushSave() {
  clearTimeout(saveTimer);
  await doSave();
}

/* ========== Cross-device sync (password vault) ========== */
const SYNC_PW_KEY = 'gkc-sync-pw';
const PBKDF2_ITERS = 150000;
const SYNC_POLL_MS = 5000;

let syncPassword = null;
let syncVaultId = null;
let syncPushTimer = null;
let syncPollTimer = null;
let syncPendingPush = false;
let syncBusy = false;
let syncLastError = '';
let syncApplyingRemote = false;

function bufToB64(buf) {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function b64ToBuf(b64) {
  const s = atob(b64);
  const bytes = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
  return bytes;
}
function bufToHex(buf) {
  return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
}

async function sha256Hex(str) {
  const dig = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return bufToHex(dig);
}
async function vaultIdFromPassword(pw) {
  return sha256Hex('gkc-study-vault:' + pw);
}
async function deriveAesKey(password, saltU8) {
  const baseKey = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltU8, iterations: PBKDF2_ITERS, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}
async function encryptData(dataObj, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(password, salt);
  const plain = new TextEncoder().encode(JSON.stringify(dataObj));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain);
  return {
    v: 1,
    salt: bufToB64(salt),
    iv: bufToB64(iv),
    ct: bufToB64(ct),
    updatedAt: dataObj.updatedAt || Date.now()
  };
}
async function decryptEnvelope(env, password) {
  const salt = b64ToBuf(env.salt);
  const iv = b64ToBuf(env.iv);
  const ct = b64ToBuf(env.ct);
  const key = await deriveAesKey(password, salt);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}

function syncKoreanError(err) {
  const msg = (err && err.message) ? String(err.message) : String(err || '');
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(msg)) return '네트워크 오류 — 연결을 확인해 주세요';
  if (/GET 4|PUT 4|GET 5|PUT 5|\b413\b|\b429\b|\b500\b|\b502\b|\b503\b/.test(msg)) return '서버 오류 (' + msg + ')';
  if (/decrypt|OperationError|AES/i.test(msg)) return '비밀번호가 맞지 않아요';
  if (/JSON|parse/i.test(msg)) return '서버 데이터 형식 오류';
  if (msg) return '동기화 실패: ' + msg;
  return '동기화 실패';
}

function setSyncStatus(kind, text) {
  const el = $('#sync-status');
  if (!el) return;
  el.className = 'sync-status' + (kind ? ' ' + kind : '');
  el.textContent = text || '';
  el.title = text || '';
}
function updateSyncNowButton() {
  const btn = $('#btn-sync-now');
  if (!btn) return;
  btn.style.display = syncPassword ? '' : 'none';
}
function updateSyncStatusUI(mode) {
  updateSyncNowButton();
  if (!syncPassword) { setSyncStatus('', ''); return; }
  if (mode === 'error' || syncLastError) {
    if (mode === 'error' || (syncLastError && mode !== 'syncing' && mode !== 'synced')) {
      setSyncStatus('err', syncLastError);
      return;
    }
  }
  if (mode === 'syncing' || syncBusy) setSyncStatus('busy', '동기화 중…');
  else if (!navigator.onLine) setSyncStatus('warn', '오프라인(나중에 올라감)');
  else if (mode === 'offline' || syncPendingPush) setSyncStatus('warn', syncPendingPush ? '오프라인(나중에 올라감)' : '동기화 대기');
  else setSyncStatus('ok', '동기화됨');
}

function syncUrlFor(vaultId) {
  return SYNC_URL.replace(/\/$/, '') + '/v1/' + vaultId;
}

async function syncFetchGet(vaultId) {
  const res = await fetch(syncUrlFor(vaultId), { method: 'GET', cache: 'no-store' });
  if (!res.ok) throw new Error('GET ' + res.status);
  const text = await res.text();
  if (!text || text === 'null') return null;
  const parsed = JSON.parse(text);
  // Stored envelope must have ct; ignore garbage keys
  if (!parsed || typeof parsed !== 'object' || parsed.ct == null) return null;
  return parsed;
}
async function syncFetchPut(vaultId, envelope) {
  const res = await fetch(syncUrlFor(vaultId), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(envelope)
  });
  if (!res.ok) throw new Error('PUT ' + res.status);
}

function scheduleSyncPush() {
  if (!syncPassword || !syncVaultId) return;
  if (syncApplyingRemote) return; // don't bounce a just-pulled payload
  syncPendingPush = true;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(() => { syncPushNow(); }, 2000);
  updateSyncStatusUI();
}

function startSyncPolling() {
  stopSyncPolling();
  if (!syncPassword || !syncVaultId) return;
  syncPollTimer = setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    if (!syncPassword || !syncVaultId) return;
    if (syncBusy) return;
    syncPullAndMaybeApply({ quiet: true });
  }, SYNC_POLL_MS);
}
function stopSyncPolling() {
  if (syncPollTimer) {
    clearInterval(syncPollTimer);
    syncPollTimer = null;
  }
}

async function syncPushNow() {
  if (!syncPassword || !syncVaultId) return { ok: false, reason: 'no-auth' };
  if (!navigator.onLine) {
    syncPendingPush = true;
    syncLastError = '';
    updateSyncStatusUI('offline');
    return { ok: false, reason: 'offline' };
  }
  syncBusy = true;
  syncLastError = '';
  updateSyncStatusUI('syncing');
  try {
    const env = await encryptData(DATA, syncPassword);
    await syncFetchPut(syncVaultId, env);
    syncPendingPush = false;
    syncBusy = false;
    syncLastError = '';
    updateSyncStatusUI('synced');
    return { ok: true };
  } catch (e) {
    syncPendingPush = true;
    syncBusy = false;
    syncLastError = syncKoreanError(e);
    updateSyncStatusUI('error');
    return { ok: false, reason: 'error', error: e };
  }
}

function dataHasContent(d) {
  return !!(d && Array.isArray(d.notebooks) && d.notebooks.length > 0);
}

function reRenderAfterSync() {
  if (state.view === 'home') renderHome();
  else if (state.view === 'mokcha') renderMokcha();
  else if (state.view === 'sebu') renderSebu();
  else if (state.view === 'tree') renderTree();
  else if (state.view === 'draw') {
    const s = getSebu();
    if (s) initDrawPage();
    else goHome();
  } else {
    goHome();
  }
}

async function applyRemoteData(remoteData) {
  syncApplyingRemote = true;
  clearTimeout(syncPushTimer);
  clearTimeout(saveTimer);
  DATA = remoteData;
  if (!DATA.version) DATA.version = 1;
  if (DATA.updatedAt == null) DATA.updatedAt = Date.now();
  const ok = await idbSet('app', DATA);
  lsSaveData();
  reRenderAfterSync();
  syncApplyingRemote = false;
  return ok;
}

async function syncPullAndMaybeApply(opts) {
  opts = opts || {};
  if (!syncPassword || !syncVaultId) return { ok: false, reason: 'no-auth' };
  if (!navigator.onLine) {
    if (!opts.quiet) updateSyncStatusUI('offline');
    return { ok: false, reason: 'offline' };
  }
  if (syncBusy && opts.quiet) return { ok: false, reason: 'busy' };
  syncBusy = true;
  if (!opts.quiet) {
    syncLastError = '';
    updateSyncStatusUI('syncing');
  }
  try {
    const env = await syncFetchGet(syncVaultId);
    if (!env) {
      syncBusy = false;
      if (!opts.quiet) updateSyncStatusUI('synced');
      return { ok: true, remote: null };
    }
    let remoteData;
    try {
      remoteData = await decryptEnvelope(env, syncPassword);
    } catch (de) {
      syncBusy = false;
      syncLastError = '비밀번호가 맞지 않아요';
      if (opts.showDecryptError) toast('비밀번호가 맞지 않아요');
      updateSyncStatusUI('error');
      return { ok: false, reason: 'decrypt' };
    }
    const remoteAt = (env.updatedAt != null ? env.updatedAt : remoteData.updatedAt) || 0;
    const localAt = DATA.updatedAt || 0;
    const localEmpty = !dataHasContent(DATA);
    const remoteHas = dataHasContent(remoteData);
    // Empty local must never beat non-empty remote (fresh defaultData timestamps used to wipe cloud)
    if (remoteHas && (localEmpty || remoteAt > localAt)) {
      await applyRemoteData(remoteData);
      syncPendingPush = false;
      if (opts.toastOnApply) toast('다른 기기 내용을 불러왔어요');
    }
    syncBusy = false;
    syncLastError = '';
    updateSyncStatusUI('synced');
    return { ok: true, remote: env, remoteData, remoteAt };
  } catch (e) {
    syncBusy = false;
    syncLastError = syncKoreanError(e);
    updateSyncStatusUI('error');
    return { ok: false, reason: 'network', error: e };
  }
}

async function syncNowManual() {
  if (!syncPassword || !syncVaultId) {
    openSyncModal();
    return;
  }
  syncLastError = '';
  const pull = await syncPullAndMaybeApply({ toastOnApply: true });
  const remoteAt = pull.remoteAt || 0;
  const localAt = DATA.updatedAt || 0;
  if (syncPendingPush || (dataHasContent(DATA) && localAt > remoteAt)) {
    await syncPushNow();
    toast('이 기기 내용을 올렸어요');
  } else if (pull.ok) {
    toast('최신 상태예요');
  } else if (syncLastError) {
    toast(syncLastError);
  }
}

function rememberSyncPassword(pw) {
  syncPassword = pw;
  try { localStorage.setItem(SYNC_PW_KEY, pw); } catch (e) {}
  updateSyncNowButton();
  startSyncPolling();
}
function clearSyncPassword() {
  syncPassword = null;
  syncVaultId = null;
  syncPendingPush = false;
  syncLastError = '';
  clearTimeout(syncPushTimer);
  stopSyncPolling();
  try { localStorage.removeItem(SYNC_PW_KEY); } catch (e) {}
  updateSyncStatusUI();
  updateSyncNowButton();
}

async function connectWithPassword(pw) {
  // Do not trim — password is the key; spaces may be intentional
  if (!pw || pw.length < 4) {
    toast('비밀번호는 4자 이상이어야 해요');
    return false;
  }
  const vid = await vaultIdFromPassword(pw);
  syncBusy = true;
  syncLastError = '';
  updateSyncStatusUI('syncing');
  let remoteEnv = null;
  try {
    remoteEnv = await syncFetchGet(vid);
  } catch (e) {
    syncBusy = false;
    syncLastError = syncKoreanError(e);
    updateSyncStatusUI('error');
    toast(syncLastError || '서버에 연결할 수 없어요');
    return false;
  }

  if (remoteEnv) {
    let remoteData;
    try {
      remoteData = await decryptEnvelope(remoteEnv, pw);
    } catch (de) {
      syncBusy = false;
      syncLastError = '비밀번호가 맞지 않아요';
      updateSyncStatusUI('error');
      toast('비밀번호가 맞지 않아요');
      return false;
    }
    const remoteAt = (remoteEnv.updatedAt != null ? remoteEnv.updatedAt : remoteData.updatedAt) || 0;
    const localAt = DATA.updatedAt || 0;
    const localHas = dataHasContent(DATA);
    const remoteHas = dataHasContent(remoteData);
    const both = localHas && remoteHas;
    const differ = remoteAt !== localAt || JSON.stringify(DATA.notebooks) !== JSON.stringify(remoteData.notebooks);

    // Empty local + remote content => always take remote (fixes wipe bug)
    if (!localHas && remoteHas) {
      syncVaultId = vid;
      rememberSyncPassword(pw);
      await applyRemoteData(remoteData);
      syncPendingPush = false;
      syncBusy = false;
      syncLastError = '';
      updateSyncStatusUI('synced');
      toast('클라우드에서 불러왔어요');
      return true;
    }

    if (both && differ) {
      const ok = confirm('이 기기 내용과 저장된 내용 중 최신 것을 사용할게요');
      if (!ok) {
        syncBusy = false;
        updateSyncStatusUI();
        return false;
      }
    }
    syncVaultId = vid;
    rememberSyncPassword(pw);
    if (!remoteHas && localHas) {
      syncBusy = false;
      await syncPushNow();
      toast('이 기기 내용을 올렸어요');
    } else if (remoteHas && (remoteAt > localAt || !localHas)) {
      await applyRemoteData(remoteData);
      syncPendingPush = false;
      syncBusy = false;
      syncLastError = '';
      updateSyncStatusUI('synced');
      toast('클라우드에서 불러왔어요');
    } else if (localHas && localAt > remoteAt) {
      syncBusy = false;
      await syncPushNow();
      toast('이 기기 내용을 올렸어요');
    } else {
      syncBusy = false;
      syncLastError = '';
      updateSyncStatusUI('synced');
      toast('동기화 연결됨');
    }
    return true;
  }

  // remote null — new vault or wrong password (indistinguishable by design)
  const localHas = dataHasContent(DATA);
  if (localHas) {
    const upload = confirm('저장된 내용이 없어요. 이 기기 노트를 올릴까요?\n취소하면 빈 노트로 시작합니다.');
    syncVaultId = vid;
    rememberSyncPassword(pw);
    if (upload) {
      syncBusy = false;
      await syncPushNow();
      toast('이 기기 내용을 올렸어요');
    } else {
      DATA = defaultData();
      clearTimeout(saveTimer);
      await idbSet('app', DATA);
      lsSaveData();
      reRenderAfterSync();
      syncBusy = false;
      await syncPushNow();
      toast('빈 노트로 시작해요');
    }
    return true;
  }

  syncVaultId = vid;
  rememberSyncPassword(pw);
  syncBusy = false;
  syncLastError = '';
  updateSyncStatusUI('synced');
  toast('동기화 연결됨');
  return true;
}

        <button type="button" class="pw-eye" id="sync-pw-eye" title="비밀번호 보기/숨기기" aria-label="비밀번호 보기">👁</button>

    </div>

    <p style="font-size:12px;color:var(--text3);margin:-6px 0 12px;line-height:1.4">
      같은 비밀번호를 쓰는 기기끼리 노트가 동기화됩니다. 다른 비밀번호는 완전히 다른 보관함이에요.
    </p>
    <div class="modal-actions" style="flex-wrap:wrap">
      <button class="btn ghost" id="m-cancel">닫기</button>
      ${connected ? '<button class="btn" id="m-sync-now">지금 동기화</button>' : ''}
      ${connected ? '<button class="btn" id="m-show-pw">🔑 비번 확인</button>' : ''}
      ${connected ? '<button class="btn danger" id="m-disconnect">연결 끊기</button>' : ''}
      <button class="btn primary" id="m-connect">연결</button>
    </div>`);
  $('#m-cancel').onclick = closeModal;
  const pwInput = $('#sync-pw');
  if (connected && syncPassword) pwInput.value = syncPassword;
  const eye = $('#sync-pw-eye');
  eye.onclick = () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    eye.classList.toggle('on', show);
    eye.textContent = show ? '🙈' : '👁';
    eye.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기');
  };
  const showPw = $('#m-show-pw');
  if (showPw) {
    showPw.onclick = () => {
      const box = $('#pw-saved');
      if (box.style.display !== 'none') { box.style.display = 'none'; box.innerHTML = ''; return; }
      if (!confirm('이 기기에 저장된 동기화 비밀번호를 화면에 표시할까요?\n(주변에 보는 사람이 없는지 확인하세요)')) return;
      let saved = null;
      try { saved = localStorage.getItem(SYNC_PW_KEY); } catch (e) {}
      saved = saved || syncPassword || '';
      box.innerHTML = saved
        ? `이 기기에 저장된 비밀번호:<br><code>${esc(saved)}</code><br><span style="font-size:11px">종이에 적어 두거나 안전한 곳에 보관하세요. 다시 누르면 숨겨져요.</span>`
        : '이 기기에 저장된 비밀번호가 없어요.';
      box.style.display = 'block';
    };
  }
  $('#m-connect').onclick = async () => {
    const pw = pwInput.value || '';
    const btn = $('#m-connect');
    if (btn) btn.disabled = true;
    const ok = await connectWithPassword(pw);
    if (btn) btn.disabled = false;
    if (ok) closeModal();
  };
  pwInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('#m-connect').click();
  });
  const nowBtn = $('#m-sync-now');
  if (nowBtn) {
    nowBtn.onclick = async () => {
      closeModal();
      await syncNowManual();
    };
  }
  const disc = $('#m-disconnect');
  if (disc) {
    disc.onclick = () => {
      clearSyncPassword();
      closeModal();
      toast('동기화 연결을 끊었어요');
    };
  }
}

async function tryAutoReconnect() {
  let pw = null;
  try { pw = localStorage.getItem(SYNC_PW_KEY); } catch (e) {}
  if (!pw || pw.length < 4) return;
  syncPassword = pw;
  syncVaultId = await vaultIdFromPassword(pw);
  updateSyncNowButton();
  updateSyncStatusUI('syncing');
  const result = await syncPullAndMaybeApply({ showDecryptError: true });
  // Only push if local has real content AND is newer than remote (never push empty over remote)
  if (result.ok && result.remote == null && dataHasContent(DATA)) {
    await syncPushNow();
  } else if (result.ok && result.remote && dataHasContent(DATA) && (DATA.updatedAt || 0) > (result.remoteAt || 0)) {
    await syncPushNow();
  }
  startSyncPolling();
}

/* ========== Drag reorder ========== */
function setupListInteractions(list, arr, onOpen, onChange) {
  list.querySelectorAll('.item-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.drag-handle')) return;
      const act = e.target.closest('[data-act]');
      if (act) {
        e.stopPropagation();
        const id = row.dataset.id;
        if (act.dataset.act === 'edit') {
          const kind = state.view === 'mokcha' ? 'mok' : 'sebu';
          openItemModal(kind, 'edit', id);
        }
        if (act.dataset.act === 'del') {
          const kind = state.view === 'mokcha' ? 'mok' : 'sebu';
          confirmDeleteItem(kind, id);
        }
        return;
      }
      onOpen(row.dataset.id);
    });

    row.addEventListener('dragstart', (e) => {
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', row.dataset.id);
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      $$('.drag-over', list).forEach(el => el.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      const dragging = list.querySelector('.dragging');
      if (!dragging || dragging === row) return;
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      const fromId = e.dataTransfer.getData('text/plain');
      const toId = row.dataset.id;
      if (!fromId || fromId === toId) return;
      const fromIdx = arr.findIndex(x => x.id === fromId);
      const toIdx = arr.findIndex(x => x.id === toId);
      if (fromIdx < 0 || toIdx < 0) return;
      const [item] = arr.splice(fromIdx, 1);
      arr.splice(toIdx, 0, item);
      onChange();
    });
  });

  // Touch-friendly reorder: long-press not needed; HTML5 drag works on desktop.
  // For mobile, provide up/down via context — keep simple with drag on supported devices.
}

function renderTree() {

/* ========== Drawing Engine ========== */
const canvas = () => $('#drawCanvas');
const bgCanvas = () => $('#bgCanvas');
const wrap = () => $('#canvas-wrap');

let CSS_W = 720;
let CSS_H = 1200;
let DPR = 1;
/* Viewport rendering: ink/bg canvases only cover the visible part of the page (+margin),

let VX = 0, VY = 0, VW = 720, VH = 1200;
const CANVAS_PX_BUDGET = 5e6; // per canvas backing store (≈20MB) — keeps total well under mobile limits
function inkT(ctx) { ctx.setTransform(DPR, 0, 0, DPR, -VX * DPR, -VY * DPR); }
function stageRect() { const st = document.getElementById('page-stage'); return st.getBoundingClientRect(); }
function freeCanvas(c) { if (c) { c.width = 0; c.height = 0; } }
const strokeBoxCache = new WeakMap();
function strokeBox(st) {
  let b = strokeBoxCache.get(st);
  if (b && b.n === st.points.length) return b;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of st.points) { if (p.x < x0) x0 = p.x; if (p.y < y0) y0 = p.y; if (p.x > x1) x1 = p.x; if (p.y > y1) y1 = p.y; }
  const pad = strokeLineWidth(st) + 2;
  b = { x0: x0 - pad, y0: y0 - pad, x1: x1 + pad, y1: y1 + pad, n: st.points.length };
  strokeBoxCache.set(st, b);
  return b;
}
function strokeVisible(st) {
  if (!st || !st.points || !st.points.length) return false;
  const b = strokeBox(st);
  return !(b.x1 < VX || b.y1 < VY || b.x0 > VX + VW || b.y0 > VY + VH);
}
/** Desired region: visible part of the page plus a margin, clamped to the page. */
function desiredViewport() {
  const w = wrap(), st = document.getElementById('page-stage');
  if (!w || !st) return { x: 0, y: 0, w: CSS_W, h: CSS_H };
  const wr = w.getBoundingClientRect(), sr = st.getBoundingClientRect();
  const k = CSS_W / Math.max(1, sr.width);
  let x0 = (wr.left - sr.left) * k, y0 = (wr.top - sr.top) * k;
  let x1 = x0 + wr.width * k, y1 = y0 + wr.height * k;
  const my = (y1 - y0) * 0.25, mx = (x1 - x0) * 0.1;
  x0 = Math.max(0, Math.floor(x0 - mx)); y0 = Math.max(0, Math.floor(y0 - my));
  x1 = Math.min(CSS_W, Math.ceil(x1 + mx)); y1 = Math.min(CSS_H, Math.ceil(y1 + my));
  if (x1 - x0 < 50) { x0 = 0; x1 = CSS_W; }
  if (y1 - y0 < 50) { y0 = 0; y1 = Math.min(CSS_H, 1200); }
  // fixed height = visible + margins, shifted inside the page (stable size → fast scroll)
  const want = Math.min(CSS_H, Math.ceil(wr.height * k * 1.5));
  if (y1 - y0 < want) { if (y0 + want <= CSS_H) y1 = y0 + want; else { y1 = CSS_H; y0 = Math.max(0, CSS_H - want); } }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
/** Called on scroll/zoom: re-place canvases when the visible area leaves the rendered region. */
let vpRaf = 0;
function scheduleViewportCheck(force) {
  if (vpRaf && !force) return;

  vpRaf = requestAnimationFrame(() => {
    vpRaf = 0;
    if (state.view !== 'draw') return;
    if (state.drawing || lasso.mode || (typeof pinchState !== 'undefined' && pinchState)) { scheduleViewportCheck(); return; }
    const w = wrap(), st = document.getElementById('page-stage'); if (!w || !st) return;
    const wr = w.getBoundingClientRect(), sr = st.getBoundingClientRect();
    const k = CSS_W / Math.max(1, sr.width);
    const vx0 = Math.max(0, (wr.left - sr.left) * k), vy0 = Math.max(0, (wr.top - sr.top) * k);
    const vx1 = Math.min(CSS_W, vx0 + wr.width * k), vy1 = Math.min(CSS_H, vy0 + wr.height * k);
    if (!force && vx0 >= VX - 1 && vy0 >= VY - 1 && vx1 <= VX + VW + 1 && vy1 <= VY + VH + 1) return;
    const old = { x: VX, y: VY, w: VW, h: VH, d: DPR };
    placeCanvases();
    if (force || !scrollBlit(old)) redrawAll();

}
/** Scroll fast-path: shift existing ink pixels and only render the newly exposed strip. */
function scrollBlit(old) {
  if (old.d !== DPR || old.w !== VW || old.h !== VH || old.x !== VX) return false;
  const dy = VY - old.y; if (!dy) return true;
  const dpx = dy * DPR;
  if (Math.abs(dy) >= VH * 0.7 || Math.abs(dpx - Math.round(dpx)) > 1e-6) return false;
  const c = canvas(), ctx = getInkCtx(); if (!c || !ctx) return false;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'copy';
  ctx.drawImage(c, 0, -Math.round(dpx));
  ctx.restore();
  // exposed strip in page coords
  const sy0 = dy > 0 ? old.y + old.h : VY, sy1 = dy > 0 ? VY + VH : old.y;
  ctx.save(); inkT(ctx);
  ctx.beginPath(); ctx.rect(VX, sy0, VW, sy1 - sy0); ctx.clip();
  ctx.clearRect(VX, sy0, VW, sy1 - sy0);
  const strokes = getStrokes();
  for (const st of strokes) {
    if (!st || !st.points || !st.points.length) continue;
    const b = strokeBox(st);
    if (b.y1 < sy0 || b.y0 > sy1 || b.x1 < VX || b.x0 > VX + VW) continue;
    drawStroke(ctx, st);

  ctx.restore();
  redrawBackground();

}
function placeCanvases() {
  const v = desiredViewport();
  VX = v.x; VY = v.y; VW = v.w; VH = v.h;

  if (VW * VH * d * d > CANVAS_PX_BUDGET) d = Math.max(0.75, Math.sqrt(CANVAS_PX_BUDGET / (VW * VH)));
  DPR = d;
  // keep canvas size stable while scrolling (enables pixel-shift fast path)
  VH = Math.min(VH, CSS_H - VY);

}
let DPR_TARGET = 1;

/* ========== Zoom (확대/축소) ========== */
const ZOOM_KEY = 'gkc-draw-zoom';

const ZOOM_MAX = 3;
const ZOOM_STEP = 0.25;

try {

const FINGER_KEY = 'gkc-finger-mode';
try {

function renderTextLayer() {
  const layer = $('#text-layer');
  if (!layer) return;
  const texts = getTexts();
  const selected = state.selectedTextId;
  layer.innerHTML = texts.map(t => `
    <div class="text-box${t.id === selected ? ' selected' : ''}" data-id="${esc(t.id)}"
         style="left:${t.x}px;top:${t.y}px;width:${t.w || 200}px;height:${t.h || 48}px;">
      <div class="tb-bar">
        <span class="tb-drag">⋮⋮ 이동</span>
        <button type="button" class="tb-del" title="삭제">✕</button>
      </div>
      <textarea placeholder="내용을 입력하세요…">${esc(t.text || '')}</textarea>
      <div class="tb-resize" title="너비 조절" aria-hidden="true"></div>
    </div>`).join('');

  layer.querySelectorAll('.text-box').forEach(box => {
    const id = box.dataset.id;
    const ta = box.querySelector('textarea');
    const bar = box.querySelector('.tb-bar');
    const del = box.querySelector('.tb-del');

    ta.addEventListener('focus', () => {
      state.selectedTextId = id;
      layer.querySelectorAll('.text-box').forEach(b => b.classList.toggle('selected', b.dataset.id === id));
    });
    // Ensure soft keyboard can target the field (some tablet WebViews blur on remount/resize)
    ta.addEventListener('pointerdown', (e) => {
      if (state.inputMode !== 'keyboard') return;
      e.stopPropagation();
      try { ta.focus(); } catch (_) {}
    });
    ta.addEventListener('input', () => {
      const texts = getTexts();
      const item = texts.find(x => x.id === id);
      if (item) { item.text = ta.value; scheduleSave(); }
    });
    // persist size on resize (mouseup / blur)
    const saveSize = () => {
      const texts = getTexts();
      const item = texts.find(x => x.id === id);
      if (!item) return;
      item.w = Math.max(60, box.offsetWidth);
      item.h = Math.max(36, box.offsetHeight);
      scheduleSave();
    };
    ta.addEventListener('mouseup', saveSize);
    ta.addEventListener('blur', saveSize);

    del.addEventListener('click', (e) => {
      e.stopPropagation();
      setTexts(getTexts().filter(x => x.id !== id));
      if (state.selectedTextId === id) state.selectedTextId = null;
      scheduleSave();
      renderTextLayer();
      toast('텍스트 삭제됨');
    });

    // Drag to move
    let dragging = false, ox = 0, oy = 0, startX = 0, startY = 0;
    const onMove = (e) => {
      if (!dragging) return;
      const cx = e.clientX != null ? e.clientX : (e.touches && e.touches[0].clientX);
      const cy = e.clientY != null ? e.clientY : (e.touches && e.touches[0].clientY);
      const z = drawZoom || 1;
      let nx = startX + (cx - ox) / z;
      let ny = startY + (cy - oy) / z;
      nx = Math.max(0, Math.min(CSS_W - 40, nx));
      ny = Math.max(0, Math.min(CSS_H - 24, ny));
      box.style.left = nx + 'px';
      box.style.top = ny + 'px';
    };
    const onUp = (e) => {
      if (!dragging) return;
      dragging = false;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      const texts = getTexts();
      const item = texts.find(x => x.id === id);
      if (item) {
        item.x = parseFloat(box.style.left) || 0;
        item.y = parseFloat(box.style.top) || 0;
        scheduleSave();
      }
    };
    bar.addEventListener('pointerdown', (e) => {
      if (state.inputMode !== 'keyboard') return;
      if (e.target.closest('.tb-del')) return;
      e.preventDefault();
      dragging = true;
      state.selectedTextId = id;
      ox = e.clientX; oy = e.clientY;
      startX = parseFloat(box.style.left) || 0;
      startY = parseFloat(box.style.top) || 0;
      try { bar.setPointerCapture(e.pointerId); } catch (_) {}
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });

    // Right-edge drag handle: widen text box (keyboard mode only)
    const resizeHandle = box.querySelector('.tb-resize');
    if (resizeHandle) {
      let resizing = false, rx0 = 0, rw0 = 0;
      const onRMove = (e) => {
        if (!resizing) return;
        const cx = e.clientX != null ? e.clientX : (e.touches && e.touches[0].clientX);
        const z = drawZoom || 1;
        const left = parseFloat(box.style.left) || 0;
        let nw = rw0 + (cx - rx0) / z;
        nw = Math.max(60, Math.min(CSS_W - left, nw));
        box.style.width = nw + 'px';
      };
      const onRUp = () => {
        if (!resizing) return;
        resizing = false;
        document.removeEventListener('pointermove', onRMove);
        document.removeEventListener('pointerup', onRUp);
        document.removeEventListener('pointercancel', onRUp);
        const texts = getTexts();
        const item = texts.find(x => x.id === id);
        if (item) {
          item.w = Math.max(60, parseFloat(box.style.width) || box.offsetWidth);
          scheduleSave();
        }
      };
      resizeHandle.addEventListener('pointerdown', (e) => {
        if (state.inputMode !== 'keyboard') return;
        e.preventDefault();
        e.stopPropagation();
        resizing = true;
        state.selectedTextId = id;
        rx0 = e.clientX;
        rw0 = parseFloat(box.style.width) || box.offsetWidth || 200;
        try { resizeHandle.setPointerCapture(e.pointerId); } catch (_) {}
        document.addEventListener('pointermove', onRMove);
        document.addEventListener('pointerup', onRUp);
        document.addEventListener('pointercancel', onRUp);
      });
    }
  });
}

function overlapsExisting(x, y, w, h, texts) {
  const pad = 8;
  return texts.some(t => {
    const tw = t.w || 200, th = t.h || 56;

/** Create a text box at the center of the current scroll viewport (page coords), offset if overlapping. */
function createTextBoxFromButton() {
  if (state.inputMode !== 'keyboard') {
    setInputMode('keyboard');
  }
  const wEl = wrap();
  const stage = $('#page-stage');
  if (!wEl || !stage) return;
  const wrapRect = wEl.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  // Center of visible viewport, mapped into page-stage CSS coords
  const viewCx = wrapRect.left + wrapRect.width / 2;
  const viewCy = wrapRect.top + wrapRect.height / 2;
  const scaleX = CSS_W / Math.max(1, stageRect.width);
  const scaleY = CSS_H / Math.max(1, stageRect.height);
  const boxW = Math.min(240, CSS_W - 40);
  const boxH = 56;
  let x = (viewCx - stageRect.left) * scaleX - boxW / 2;
  let y = (viewCy - stageRect.top) * scaleY - boxH / 2;
  x = Math.max(8, Math.min(CSS_W - boxW - 8, x));
  y = Math.max(8, Math.min(CSS_H - boxH - 8, y));

  const texts = getTexts();
  let guard = 0;
  while (overlapsExisting(x, y, boxW, boxH, texts) && guard < 24) {
    x = Math.max(8, Math.min(CSS_W - boxW - 8, x + 28));
    y = Math.max(8, Math.min(CSS_H - boxH - 8, y + 36));
    guard++;
  }

  const t = { id: uid(), x, y, w: boxW, h: boxH, text: '' };
  texts.push(t);
  setTexts(texts);
  state.selectedTextId = t.id;
  scheduleSave();
  renderTextLayer();
  const focusTa = () => {
    const ta = $(`.text-box[data-id="${t.id}"] textarea`);
    if (!ta) return;
    try { ta.focus({ preventScroll: false }); } catch (_) { ta.focus(); }
  };
  focusTa();
  requestAnimationFrame(focusTa);
}

function drawTextsOnCtx(ctx) {
  const texts = getTexts();
  ctx.save();
  ctx.textBaseline = 'top';
  for (const t of texts) {
    if (!t.text) continue;
    const fontSize = 15;
    ctx.font = fontSize + 'px ' + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = '#1a1d23';
    const maxW = (t.w || 200) - 16;
    const lines = [];
    const paragraphs = String(t.text).split('\n');
    for (const para of paragraphs) {
      if (!para) { lines.push(''); continue; }
      let line = '';
      for (const ch of para) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxW && line) {
          lines.push(line);
          line = ch;
        } else line = test;
      }
      lines.push(line);
    }
    let yy = t.y + 8;
    // if bar was shown in kb mode we don't draw bar in export
    for (const line of lines) {
      ctx.fillText(line, t.x + 8, yy);
      yy += fontSize * 1.45;
    }
  }
  ctx.restore();
}

function drawBackground(ctx) {
  ctx.save();

  ctx.fillRect(0, 0, CSS_W, CSS_H);

    ctx.strokeStyle = '#c5d0e0';
    ctx.lineWidth = 1;
    const gap = 28;
    const top = 40;
    for (let y = top; y < CSS_H; y += gap) {
      ctx.beginPath();
      ctx.moveTo(20, y);
      ctx.lineTo(CSS_W - 20, y);
      ctx.stroke();
    }
    // left margin
    ctx.strokeStyle = '#f0a0a0';
    ctx.beginPath();
    ctx.moveTo(48, 0);
    ctx.lineTo(48, CSS_H);
    ctx.stroke();
  } else if (state.bg === 'grid') {
    ctx.strokeStyle = '#d5dde8';
    ctx.lineWidth = 1;
    const gap = 24;
    for (let x = 0; x < CSS_W; x += gap) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, CSS_H);
      ctx.stroke();
    }
    for (let y = 0; y < CSS_H; y += gap) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(CSS_W, y);
      ctx.stroke();

  return w;

/** Pressure + taper width for pen strokes recorded with a stylus (stroke.pr). Old strokes: constant. */
function segWidth(stroke, i, n, final) {
  const base = strokeLineWidth(stroke);
  if (!stroke.pr || stroke.tool !== 'pen') return base;
  const pt = stroke.points[i] || {};
  const pr = (typeof pt.p === 'number' && pt.p > 0) ? Math.min(1, pt.p) : 0.5;
  let f = 0.72 + 0.56 * pr;              // subtle: 0.72x .. 1.28x
  if (i < 3) f *= 0.7 + 0.1 * i;         // start taper
  return Math.max(0.6, base * f);

    ctx.beginPath();

/* ========== 이미지 삽입 ========== */
let imgSel = null;
function getImages() {
  const p = ensurePage();
  if (!p) return [];
  if (!Array.isArray(p.images)) p.images = [];
  return p.images;
}
function applyImgMode() {
  const layer = $('#img-layer'); if (!layer) return;
  const on = state.tool === 'image';
  layer.classList.toggle('active', on);
  if (!on && imgSel) { imgSel = null; renderImages(); }
}
function renderImages() {
  const layer = $('#img-layer'); if (!layer) return;
  const imgs = getImages();
  const have = new Map(); $$('#img-layer .img-item').forEach(el => have.set(el.dataset.id, el));
  imgs.forEach(o => {
    let el = have.get(o.id);
    if (!el) {
      el = document.createElement('div'); el.className = 'img-item'; el.dataset.id = o.id;
      el.innerHTML = '<img alt="" draggable="false"><div class="img-rs"></div><button type="button" class="img-del">삭제</button>';
      el.querySelector('img').src = o.src || '';
      bindImgItem(el);
      layer.appendChild(el);
    }
    have.delete(o.id);
    el.style.left = o.x + 'px'; el.style.top = o.y + 'px'; el.style.width = o.w + 'px'; el.style.height = o.h + 'px';
    el.classList.toggle('sel', imgSel === o.id);
  });
  have.forEach(el => el.remove());
}
function pushImgUndo() {
  state.undoStack.push(snapEntry());
  if (state.undoStack.length > 50) state.undoStack.shift();
  state.redoStack = [];
  updateUndoBtns();
}
function bindImgItem(el) {
  let drag = null;
  const scale = () => { const r = stageRect(); return CSS_W / Math.max(1, r.width); };
  el.addEventListener('pointerdown', (e) => {
    if (state.tool !== 'image') return;
    if (e.target.closest('.img-del')) return;
    e.preventDefault(); e.stopPropagation();
    const o = getImages().find(q => q.id === el.dataset.id); if (!o) return;
    if (imgSel !== o.id) { imgSel = o.id; renderImages(); }
    drag = { id: e.pointerId, cx: e.clientX, cy: e.clientY, x: o.x, y: o.y, w: o.w, h: o.h, k: scale(),
             resize: !!e.target.closest('.img-rs'), moved: false, o };
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
  });
  el.addEventListener('pointermove', (e) => {
    if (!drag || drag.id !== e.pointerId) return;
    e.preventDefault();
    const dx = (e.clientX - drag.cx) * drag.k, dy = (e.clientY - drag.cy) * drag.k;
    if (!drag.moved && Math.hypot(dx, dy) < 2) return;
    if (!drag.moved) { pushImgUndo(); drag.moved = true; }
    const o = getImages().find(q => q.id === el.dataset.id) || drag.o;
    if (drag.resize) {
      const ar = drag.h / drag.w;
      const nw = Math.max(40, Math.min(CSS_W * 2, drag.w + Math.max(dx, dy / ar)));
      o.w = Math.round(nw); o.h = Math.round(nw * ar);
    } else {
      o.x = Math.round(Math.max(-o.w + 20, Math.min(CSS_W - 20, drag.x + dx)));
      o.y = Math.round(Math.max(0, Math.min(CSS_H - 20, drag.y + dy)));
    }
    el.style.left = o.x + 'px'; el.style.top = o.y + 'px'; el.style.width = o.w + 'px'; el.style.height = o.h + 'px';
  });
  const end = (e) => {
    if (!drag || drag.id !== e.pointerId) return;
    if (drag.moved) scheduleSave();
    drag = null;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.querySelector('.img-del').addEventListener('click', (e) => {
    e.stopPropagation();
    pushImgUndo();
    ensurePage().images = getImages().filter(q => q.id !== el.dataset.id);

}
function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { resolve({ im, url }); };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };

async function insertImageFile(file) {
  if (!file || !getSebu()) return;
  const MAX = 1600;

  try {
    let srcImg = null, nw = 0, nh = 0, url = null, bmp = null;
    if (window.createImageBitmap) {
      // Probe size cheaply, then decode directly at reduced size (avoids a 48MB full-res decode of camera photos)
      try {
        const probe = await createImageBitmap(file, { resizeWidth: 64, resizeQuality: 'low' });
        const ar = probe.height / probe.width; probe.close && probe.close();
        // decode with long side ≤ MAX (aspect from probe)
        const tw = ar <= 1 ? MAX : Math.round(MAX / ar);
        bmp = await createImageBitmap(file, { resizeWidth: tw, resizeQuality: 'high', imageOrientation: 'from-image' });

      nw = srcImg.naturalWidth; nh = srcImg.naturalHeight;

    if (url) URL.revokeObjectURL(url);
    if (srcImg && srcImg.src) srcImg.src = '';

  const wr = wEl.getBoundingClientRect(), sr = stage.getBoundingClientRect();

  y = Math.round(Math.max(0, Math.min(Math.max(0, CSS_H - dh), y)));
  pushImgUndo();
  const o = { id: uid(), x, y, w: dw, h: dh, src };
  getImages().push(o);
  imgSel = o.id;
  // switch to 이미지 선택 mode so it can be moved/resized right away
  state.tool = 'image';
  $$('.tool-btn[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === 'image'));
  lassoClear(); applyImgMode(); renderImages(); scheduleSave();
  toast('이미지 삽입 — 끌어서 이동, 모서리로 크기 조절');
}

/* ========== 종이 추가 / 삭제 ========== */
const SHEET_H = 1200;
function addSheet() {
  const sebu = getSebu(); if (!sebu) return;
  sebu.pageHeight = (sebu.pageHeight || 1200) + SHEET_H;
  CSS_H = sebu.pageHeight;
  scheduleSave(); resizeCanvas(); redrawAll(); updateGuideOverlay(); renderTextLayer(); renderImages();
  wrap().scrollTop = wrap().scrollHeight;
  toast('종이를 한 장 추가했습니다');
}
function removeSheet() {
  const sebu = getSebu(); if (!sebu) return;
  const h = sebu.pageHeight || 1200;
  if (h - SHEET_H < 1200) { toast('더 지울 종이가 없습니다'); return; }
  const cut = h - SHEET_H;
  const used = getStrokes().some(st => st.tool !== 'eraser' && st.points.some(p => p.y > cut)) ||
    getTexts().some(t => (t.y || 0) + (t.h || 0) > cut) ||
    getImages().some(o => o.y + o.h > cut);
  if (used) { toast('마지막 종이가 비어 있지 않아 지울 수 없습니다'); return; }
  sebu.pageHeight = cut; CSS_H = cut;
  scheduleSave(); resizeCanvas(); redrawAll(); updateGuideOverlay(); renderTextLayer(); renderImages();
  toast('마지막 종이를 지웠습니다');
}

function extendPage() {
  const sebu = getSebu();
  if (!sebu) return;
  sebu.pageHeight = (sebu.pageHeight || 1200) + 600;
  CSS_H = sebu.pageHeight;
  scheduleSave();
  resizeCanvas();
  redrawAll();
  updateGuideOverlay();
  renderTextLayer();
  // scroll to new area
  wrap().scrollTop = wrap().scrollHeight;
  toast('페이지를 늘렸습니다');

function exportPng() {
  // Render full page into temporary canvases at a capped scale, then free them
  const sc = Math.max(0.5, Math.min(2, Math.sqrt(8e6 / (CSS_W * CSS_H))));
  const W = Math.floor(CSS_W * sc), H = Math.floor(CSS_H * sc);
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const ink = document.createElement('canvas'); ink.width = W; ink.height = H;
  const ctx = out.getContext('2d'); ctx.setTransform(sc, 0, 0, sc, 0, 0);
  const ix = ink.getContext('2d'); ix.setTransform(sc, 0, 0, sc, 0, 0);
  try {
    drawBackground(ctx);
    getImages().forEach(o => {
      const el = $(`.img-item[data-id="${o.id}"] img`);
      try { if (el && el.complete) ctx.drawImage(el, o.x, o.y, o.w, o.h); } catch (_) {}
    });
    getStrokes().forEach(st => drawStroke(ix, st));
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(ink, 0, 0); ctx.setTransform(sc, 0, 0, sc, 0, 0);
    freeCanvas(ink);
    drawTextsOnCtx(ctx);
    const sebu = getSebu();
    out.toBlob((blob) => {
      freeCanvas(out);
      if (!blob) { toast('PNG 저장 실패'); return; }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = (sebu ? sebu.title : 'page') + '.png';
      link.href = url; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('PNG 저장');
    }, 'image/png');
  } catch (e) { freeCanvas(ink); freeCanvas(out); toast('PNG 저장 실패'); }
}

/* ========== Export / Import ========== */
async function exportBackup() {
  await flushSave();
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gkc-notes-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('백업 파일을 저장했습니다');
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.notebooks)) throw new Error('형식 오류');
      openModal(`
        <h3>백업 가져오기</h3>
        <p style="font-size:14px;color:var(--text2);margin-bottom:16px">
          노트 ${d.notebooks.length}개가 들어 있습니다.<br>
          현재 데이터를 덮어쓸까요?
        </p>
        <div class="modal-actions">
          <button class="btn ghost" id="m-cancel">취소</button>
          <button class="btn primary" id="m-ok">가져오기</button>
        </div>`);
      $('#m-cancel').onclick = closeModal;
      $('#m-ok').onclick = () => {
        DATA = d;
        DATA.version = 1;
        scheduleSave();
        closeModal();
        goHome();
        toast('가져오기 완료');
      };
    } catch (err) {
      toast('파일을 읽을 수 없습니다');
    }
  };
  reader.readAsText(file);
}

    wrapEl.addEventListener('touchmove', onPinchTouchMove, { passive: false });
    wrapEl.addEventListener('touchend', onPinchTouchEnd, { passive: false });
    wrapEl.addEventListener('touchcancel', onPinchTouchEnd, { passive: false });
  }

  // Soft keyboard on phones fires resize (height only). Remounting #text-layer
  // there stole focus and broke 자판/IME typing — only relayout on width changes.
  lastViewportW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (state.view !== 'draw') return;
    const wNow = window.innerWidth;
    const widthChanged = Math.abs(wNow - lastViewportW) > 2;
    lastViewportW = wNow;
    const typing = document.activeElement && (
      document.activeElement.closest('#text-layer') ||
      document.activeElement.closest('.modal') ||
      document.activeElement.tagName === 'INPUT' ||
      document.activeElement.tagName === 'TEXTAREA'
    );
    if (!widthChanged || typing) {
      // keep layer box size in sync without destroying focused inputs
      const layer = $('#text-layer');
      if (layer) {
        layer.style.width = CSS_W + 'px';
        layer.style.height = CSS_H + 'px';
      }
      applyZoomTransform();
      return;
    }
    resizeCanvas();
    redrawAll();
    updateGuideOverlay();
    renderTextLayer();
  });

  $('#btn-sync').addEventListener('click', openSyncModal);
  $('#btn-sync-now').addEventListener('click', () => { syncNowManual(); });

  // Autosave on visibility change + sync pull when visible
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushSave();
    if (document.visibilityState === 'visible') {
      syncPullAndMaybeApply({ showDecryptError: false });
      startSyncPolling();
    } else {
      stopSyncPolling();
    }
  });
  window.addEventListener('beforeunload', () => { flushSave(); });
  window.addEventListener('online', () => {
    syncLastError = '';
    if (syncPendingPush) syncPushNow();
    else syncPullAndMaybeApply({ showDecryptError: false });
  });
  window.addEventListener('offline', () => {
    if (syncPassword) updateSyncStatusUI('offline');
  });
}

/* ========== Boot ========== */
async function boot() {
  await loadData();
  wireEvents();
  goHome();
  tryAutoReconnect();
}

boot();

/* test hooks */
window.__gkcSync = {
  SYNC_URL: () => SYNC_URL,
  encryptData,
  decryptEnvelope,
  vaultIdFromPassword,
  getData: () => DATA,
  setData: (d) => { DATA = d; },
  getSyncPassword: () => syncPassword,
  connectWithPassword,
  syncPushNow,
  syncPullAndMaybeApply,
  syncNowManual,
  startSyncPolling,
  stopSyncPolling,
  getSyncLastError: () => syncLastError
};
window.__gkcZoom = {
  get: () => drawZoom,
  set: (z, opts) => setDrawZoom(z, opts || { snap: true, force: true }),
  canvasPos,
  applyZoomTransform,
  ZOOM_MIN,
  ZOOM_MAX,
  ZOOM_STEP
};
window.__gkcFinger = {
  get: () => state.fingerMode,
  set: (m) => setFingerMode(m, { silent: true }),
  touchShouldDraw
};
window.__gkcInk = {
  strokeLineWidth,
  getInkCtx,
  SMOOTH_ALPHA,
  drawStroke,
  getActivePenId: () => activePenPointerId,
  isPalmRejectedTouch
};
window.__gkcNav = {
  goHome, goMokcha, goSebu, goDraw, getState: () => ({ ...state }),
  initDrawPage, renderTextLayer, setInputMode
};
})();
</script>
