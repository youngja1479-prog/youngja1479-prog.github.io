<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>네온 생존자 - NEON SURVIVOR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#07060f;color:#fff;
 font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Noto Sans CJK KR","Gothic A1","Nanum Gothic",sans-serif}
canvas{display:block;position:fixed;left:0;top:0;touch-action:none}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
 background:rgba(5,4,15,.72);backdrop-filter:blur(3px);z-index:10;text-align:center;padding:16px}
.ov.show{display:flex}
h1{font-size:clamp(40px,9vw,84px);font-weight:900;letter-spacing:2px;
 background:linear-gradient(90deg,#4df3ff,#b46bff,#ff4d9d);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 18px rgba(180,107,255,.6));animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 30px rgba(77,243,255,.8))}}
.sub{letter-spacing:10px;color:#8fa0ff;font-size:clamp(12px,2.4vw,18px);margin:4px 0 22px;font-weight:700}
.box{background:rgba(20,18,45,.85);border:2px solid #3b2f7a;border-radius:16px;padding:16px 22px;max-width:520px;width:100%;
 box-shadow:0 0 30px rgba(120,80,255,.25);line-height:1.7;font-size:clamp(13px,2.6vw,16px);text-align:left}
.box b{color:#4df3ff}
.btn{margin-top:18px;font:inherit;font-size:clamp(18px,4vw,24px);font-weight:900;color:#fff;cursor:pointer;
 padding:12px 44px;border-radius:40px;border:none;background:linear-gradient(90deg,#7b3cff,#ff3c9d);
 box-shadow:0 0 22px rgba(255,60,157,.55);transition:transform .1s}
.btn:hover{transform:scale(1.06)}.btn:active{transform:scale(.97)}
.btn.sec{background:linear-gradient(90deg,#28305a,#3b2f7a);box-shadow:0 0 12px rgba(80,90,255,.35);font-size:clamp(15px,3.4vw,19px);padding:10px 32px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.best{margin-top:14px;color:#ffd84d;font-weight:700;font-size:clamp(14px,3vw,18px)}
.big{font-size:clamp(36px,8vw,64px);font-weight:900;margin-bottom:10px}
.stats{font-size:clamp(16px,3.5vw,22px);line-height:1.9}
.stats span{color:#4df3ff;font-weight:900}
.newrec{color:#ffd84d;font-weight:900;font-size:clamp(18px,4vw,26px);animation:pulse 1s infinite}
#cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;max-width:900px}
.card{width:230px;min-height:250px;background:linear-gradient(160deg,#1c1840,#120f2a);border:2px solid #4a3aa0;border-radius:16px;
 padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .12s,border-color .12s,box-shadow .12s;
 animation:cardIn .35s backwards}
.card:hover,.card.sel{transform:translateY(-6px) scale(1.03);border-color:#4df3ff;box-shadow:0 0 26px rgba(77,243,255,.5)}
.card canvas{position:static;width:72px;height:72px;margin:4px 0 8px}
.card .nm{font-size:20px;font-weight:900}
.card .lv{font-size:13px;color:#ffd84d;margin:2px 0 8px;font-weight:700}
.card .ds{font-size:14px;color:#cfd3ff;line-height:1.5}
.card .key{margin-top:auto;font-size:12px;color:#7a7fb0;padding-top:8px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;margin-bottom:4px;font-weight:700}
.tag.w{background:#ff3c9d33;color:#ff8cc6}.tag.p{background:#4df3ff26;color:#8ff6ff}.tag.n{background:#ffd84d33;color:#ffe680}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.9)}}
@media (max-width:760px){#cards{gap:6px}.card{width:32%;min-width:0;min-height:200px;padding:8px}.card .nm{font-size:15px}.card .ds{font-size:12px}.card canvas{width:52px;height:52px}}
#pbtn{position:fixed;right:12px;top:22px;width:44px;height:44px;border-radius:12px;background:rgba(30,25,70,.7);border:2px solid #4a3aa0;
 z-index:5;display:none;cursor:pointer;align-items:center;justify-content:center;gap:6px}
#pbtn i{display:block;width:6px;height:18px;background:#cfd3ff;border-radius:2px}
#inv{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;max-width:520px}
#inv div{background:#1c1840;border:1px solid #4a3aa0;border-radius:10px;padding:4px 10px;font-size:14px}
.hint{color:#8a8fc0;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pbtn" title="일시정지"><i></i><i></i></div>

<div class="ov show" id="title">
  <h1>네온 생존자</h1>
  <div class="sub">NEON SURVIVOR</div>
  <div class="box">
    🎮 <b>이동</b>: WASD / 방향키 (모바일: 화면 아무 곳이나 드래그)<br>
    ⚔️ 무기는 <b>자동으로 공격</b>합니다. 피하는 데만 집중하세요!<br>
    💎 적이 떨어뜨린 <b>경험치 보석</b>을 모아 레벨 업 → 강화 카드 선택<br>
    👑 3분마다 <b>보스</b> 등장! <b>10분</b>을 버티면 승리!<br>
    ⏸️ <b>Space / Esc</b>: 일시정지 · <b>M</b>: 소리 켜기/끄기
  </div>
  <button class="btn" id="startBtn">게임 시작</button>
  <div class="best" id="bestTitle"></div>
</div>

<div class="ov" id="levelup">
  <div class="big" style="color:#ffd84d;text-shadow:0 0 20px #ffb800">레벨 업!</div>
  <div style="color:#cfd3ff">강화할 능력을 하나 선택하세요</div>
  <div id="cards"></div>
</div>

<div class="ov" id="pause">
  <div class="big">일시정지</div>
  <div id="inv"></div>
  <div class="row">
    <button class="btn" id="resumeBtn">계속하기</button>
  </div>
  <div class="row">
    <button class="btn sec" id="soundBtn">소리: 켜짐</button>
    <button class="btn sec" id="restartBtn">다시 시작</button>
    <button class="btn sec" id="toTitleBtn">타이틀로</button>
  </div>
</div>

<div class="ov" id="over">
  <div class="big" style="color:#ff4d6d;text-shadow:0 0 24px #ff2e63">게임 오버</div>
  <div class="stats" id="overStats"></div>
  <div id="overRec"></div>
  <div class="row">
    <button class="btn" id="retryBtn">다시 도전</button>
    <button class="btn sec" id="overTitleBtn">타이틀로</button>
  </div>
</div>

<div class="ov" id="victory">
  <div class="big" style="color:#ffd84d;text-shadow:0 0 24px #ffb800">🏆 생존 성공!</div>
  <div style="font-size:18px;margin-bottom:8px">10분 동안 살아남았습니다! 당신은 진정한 생존자!</div>
  <div class="stats" id="vicStats"></div>
  <div class="row">
    <button class="btn" id="contBtn">계속 도전하기 (무한 모드)</button>
    <button class="btn sec" id="vicTitleBtn">결과 저장하고 끝내기</button>
  </div>
</div>

<script>
'use strict';
// ================== 기본 설정 ==================
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,VS=1; // VS: 월드 확대 비율
const WH=2400; // 월드 반경 (월드 크기 4800x4800)
const FONT='"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR","Gothic A1",sans-serif';
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  VS=Math.max(0.62,Math.min(1.1,Math.min(W,H)/720));
}
addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, TAU=Math.PI*2;
const $=id=>document.getElementById(id);
function fmtTime(t){t=Math.floor(t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}

// ================== 사운드 (WebAudio) ==================
let AC=null,muted=false;const sndLast={};
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume()}
function sfx(name,freq,dur,type,vol,slide,minGap){
  if(!AC||muted)return;const now=AC.currentTime;if(sndLast[name]&&now-sndLast[name]<(minGap||0.05))return;sndLast[name]=now;
  try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(freq,now);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),now+dur);
  g.gain.setValueAtTime(vol||0.04,now);g.gain.exponentialRampToValueAtTime(0.0001,now+dur);o.connect(g);g.connect(AC.destination);o.start(now);o.stop(now+dur+0.02)}catch(e){}
}
const S={
  shoot:()=>sfx('shoot',880,0.06,'square',0.015,0.5,0.07),
  hit:()=>sfx('hit',220,0.05,'square',0.02,0.6,0.04),
  kill:()=>sfx('kill',160,0.1,'sawtooth',0.025,0.4,0.05),
  gem:()=>sfx('gem',1200+Math.random()*400,0.05,'sine',0.03,1.5,0.03),
  hurt:()=>sfx('hurt',140,0.25,'sawtooth',0.07,0.4,0.15),
  boom:()=>sfx('boom',90,0.35,'sawtooth',0.07,0.3,0.08),
  zap:()=>sfx('zap',1600,0.12,'sawtooth',0.025,0.3,0.08),
  pulse:()=>sfx('pulse',300,0.3,'sine',0.06,0.3,0.1),
  pick:()=>sfx('pick',600,0.2,'triangle',0.07,2,0.1),
  level:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfx('lv'+i,f,0.18,'triangle',0.06,1,0),i*70))},
  boss:()=>{[110,98,82].forEach((f,i)=>setTimeout(()=>sfx('bs'+i,f,0.5,'sawtooth',0.08,0.8,0),i*250))},
};

// ================== 데이터: 무기 / 패시브 / 적 ==================
const WEAPONS={
  bolt:{name:'마법 화살',color:'#4df3ff',desc:'가장 가까운 적에게 마법 화살을 자동으로 발사합니다.',
    lv:[{dmg:10,n:1,cd:0.8,pierce:0},{dmg:13,n:1,cd:0.85,pierce:1},{dmg:13,n:2,cd:0.8,pierce:1},{dmg:17,n:2,cd:0.72,pierce:2},{dmg:22,n:3,cd:0.62,pierce:3}]},
  orbit:{name:'회전 칼날',color:'#b9f',desc:'몸 주위를 도는 칼날이 닿는 적을 베어냅니다.',
    lv:[{dmg:8,n:2,rad:72},{dmg:9,n:3,rad:78},{dmg:11,n:3,rad:88},{dmg:13,n:4,rad:96},{dmg:16,n:5,rad:108}]},
  pulse:{name:'충격파',color:'#8ff6ff',desc:'주기적으로 주변에 충격파를 일으켜 적을 밀쳐냅니다.',
    lv:[{dmg:15,cd:3.2,rad:115},{dmg:19,cd:2.9,rad:128},{dmg:24,cd:2.6,rad:142},{dmg:29,cd:2.3,rad:158},{dmg:36,cd:1.9,rad:180}]},
  chain:{name:'연쇄 번개',color:'#fff27a',desc:'적에게 번개를 떨어뜨리고, 번개가 주변 적에게 튀어갑니다.',
    lv:[{dmg:16,cd:2.2,n:3},{dmg:19,cd:2.0,n:4},{dmg:23,cd:1.8,n:5},{dmg:27,cd:1.6,n:6},{dmg:34,cd:1.3,n:8}]},
  boom:{name:'부메랑',color:'#ffb24d',desc:'적을 관통하며 날아갔다가 되돌아오는 부메랑을 던집니다.',
    lv:[{dmg:14,cd:1.7,n:1},{dmg:17,cd:1.6,n:1},{dmg:20,cd:1.5,n:2},{dmg:24,cd:1.35,n:2},{dmg:30,cd:1.15,n:3}]},
  mine:{name:'지뢰',color:'#ff5d5d',desc:'발밑에 지뢰를 설치합니다. 적이 밟으면 폭발!',
    lv:[{dmg:32,cd:1.8,rad:75},{dmg:40,cd:1.6,rad:82},{dmg:48,cd:1.4,rad:90},{dmg:58,cd:1.2,rad:100},{dmg:72,cd:1.0,rad:115}]},
  aura:{name:'불꽃 오라',color:'#ff7a3c',desc:'몸 주위에 불꽃 영역을 만들어 계속 피해를 줍니다.',
    lv:[{dmg:5,rad:72},{dmg:6,rad:82},{dmg:8,rad:92},{dmg:10,rad:104},{dmg:13,rad:120}]},
};
const STAT_LBL={dmg:'피해',n:'개수',cd:'쿨타임',pierce:'관통',rad:'범위'};
const PASSIVES={
  speed:{name:'신속의 장화',desc:'이동 속도 +8%'},
  heart:{name:'강철 심장',desc:'최대 체력 +20, 체력 20 회복'},
  magnet:{name:'자석',desc:'보석 획득 범위 +30%'},
  haste:{name:'시간 가속',desc:'모든 무기 쿨타임 -7%'},
  power:{name:'파괴의 힘',desc:'모든 피해량 +10%'},
  regen:{name:'재생의 반지',desc:'초당 체력 +0.4 회복'},
  area:{name:'확장의 룬',desc:'무기 공격 범위 +10%'},
};
const MAXLV=5, MAX_WEAPONS=6;
const ETYPES={
  grunt:{r:13,hp:10,spd:72,dmg:6,xp:1,color:'#ff4d6d'},
  bat:{r:9,hp:5,spd:135,dmg:4,xp:1,color:'#ffd84d'},
  brute:{r:24,hp:70,spd:44,dmg:16,xp:5,color:'#b46bff',kb:0.3},
  spitter:{r:13,hp:16,spd:64,dmg:6,xp:3,color:'#5dff8a'},
  charger:{r:14,hp:30,spd:60,dmg:12,xp:4,color:'#ff9a3c',kb:0.6},
  boss:{r:54,hp:2200,spd:58,dmg:25,xp:0,color:'#ff2e63',kb:0.04},
};

// ================== 스프라이트 캐시 ==================
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const SPR={};
function buildSprites(){
  const SC=2;
  for(const k in ETYPES){
    const t=ETYPES[k];
    for(const flash of [false,true]){
      const pad=12,size=Math.ceil((t.r+pad)*2*SC),c=makeCanvas(size,size),g=c.getContext('2d');
      g.translate(size/2,size/2);g.scale(SC,SC);
      const col=flash?'#ffffff':t.color;
      g.shadowColor=col;g.shadowBlur=10;g.lineWidth=2.5;g.strokeStyle=col;g.fillStyle=flash?'#ffffff':shade(t.color,0.28);
      const r=t.r;g.beginPath();
      if(k==='grunt'){g.arc(0,0,r,0,TAU)}
      else if(k==='bat'){g.moveTo(0,-r*0.4);g.lineTo(r*1.2,-r*0.9);g.lineTo(r*0.8,r*0.2);g.lineTo(0,r*0.8);g.lineTo(-r*0.8,r*0.2);g.lineTo(-r*1.2,-r*0.9);g.closePath()}
      else if(k==='brute'){for(let i=0;i<6;i++){const a=i/6*TAU+Math.PI/6;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath()}
      else if(k==='spitter'){g.arc(0,0,r,0,TAU)}
      else if(k==='charger'){g.moveTo(r*1.2,0);g.lineTo(-r*0.8,r*0.9);g.lineTo(-r*0.4,0);g.lineTo(-r*0.8,-r*0.9);g.closePath()}
      else if(k==='boss'){for(let i=0;i<24;i++){const a=i/24*TAU,rr=i%2?r*0.78:r*1.05;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath()}
      g.fill();g.stroke();g.shadowBlur=0;
      if(!flash){
        g.fillStyle='#fff';
        if(k==='grunt'){g.beginPath();g.arc(-4,-2,2.6,0,TAU);g.arc(4,-2,2.6,0,TAU);g.fill()}
        if(k==='bat'){g.beginPath();g.arc(-2.5,0,1.6,0,TAU);g.arc(2.5,0,1.6,0,TAU);g.fill()}
        if(k==='brute'){g.fillStyle='#e8d0ff';g.fillRect(-9,-5,6,4);g.fillRect(3,-5,6,4);g.fillRect(-7,5,14,3)}
        if(k==='spitter'){g.strokeStyle=t.color;g.lineWidth=2;g.beginPath();g.arc(0,0,r*0.55,0,TAU);g.stroke();g.beginPath();g.arc(0,0,3.5,0,TAU);g.fill()}
        if(k==='boss'){g.fillStyle='#fff';g.beginPath();g.arc(-16,-8,7,0,TAU);g.arc(16,-8,7,0,TAU);g.fill();g.fillStyle='#ff2e63';g.beginPath();g.arc(-16,-8,3,0,TAU);g.arc(16,-8,3,0,TAU);g.fill();
          g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(-18,14);for(let i=0;i<7;i++)g.lineTo(-18+i*6,i%2?20:12);g.stroke()}
      }
      SPR[k+(flash?'_f':'')]={c,size:size/SC};
    }
  }
  // 발사체/보석 등
  const glowDot=(name,r,col,core)=>{const pad=10,size=Math.ceil((r+pad)*2*SC),c=makeCanvas(size,size),g=c.getContext('2d');g.translate(size/2,size/2);g.scale(SC,SC);
    g.shadowColor=col;g.shadowBlur=12;g.fillStyle=col;g.beginPath();g.arc(0,0,r,0,TAU);g.fill();g.shadowBlur=0;g.fillStyle=core||'#fff';g.beginPath();g.arc(0,0,r*0.5,0,TAU);g.fill();SPR[name]={c,size:size/SC}};
  glowDot('bolt',6,'#4df3ff');glowDot('ebullet',6,'#ff3cf0');glowDot('bossbullet',8,'#ff2e63','#ffd0dd');
  const gem=(name,col)=>{const size=40,c=makeCanvas(size,size),g=c.getContext('2d');g.translate(20,20);g.scale(SC,SC);g.shadowColor=col;g.shadowBlur=6;g.fillStyle=col;
    g.beginPath();g.moveTo(0,-7);g.lineTo(5,0);g.lineTo(0,7);g.lineTo(-5,0);g.closePath();g.fill();g.shadowBlur=0;g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.moveTo(0,-7);g.lineTo(2,-1);g.lineTo(-2,-1);g.closePath();g.fill();SPR[name]={c,size:size/SC}};
  gem('gem1','#4dc3ff');gem('gem2','#5dff8a');gem('gem3','#ff4d9d');
}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return `rgb(${r*f|0},${g*f|0},${b*f|0})`}
buildSprites();

// ================== 아이콘 그리기 (카드/HUD 공용) ==================
function drawIcon(g,id,s){
  g.save();g.lineCap='round';g.lineJoin='round';const u=s/40;g.scale(u,u);g.lineWidth=3;
  const glow=c=>{g.shadowColor=c;g.shadowBlur=8;g.strokeStyle=c;g.fillStyle=c};
  switch(id){
    case 'bolt':glow('#4df3ff');g.beginPath();g.moveTo(-14,10);g.lineTo(12,-12);g.stroke();g.beginPath();g.moveTo(12,-12);g.lineTo(2,-10);g.lineTo(10,-2);g.closePath();g.fill();g.beginPath();g.arc(-12,8,4,0,TAU);g.fill();break;
    case 'orbit':glow('#b9f');g.beginPath();g.arc(0,0,4,0,TAU);g.fill();g.beginPath();g.arc(0,0,13,0,TAU);g.globalAlpha=.35;g.stroke();g.globalAlpha=1;
      for(let i=0;i<3;i++){const a=i/3*TAU;g.save();g.translate(Math.cos(a)*13,Math.sin(a)*13);g.rotate(a+1.2);g.beginPath();g.moveTo(-7,0);g.lineTo(0,-3);g.lineTo(7,0);g.lineTo(0,3);g.closePath();g.fill();g.restore()}break;
    case 'pulse':glow('#8ff6ff');for(let r=5;r<=17;r+=6){g.globalAlpha=1-r/24;g.beginPath();g.arc(0,0,r,0,TAU);g.stroke()}g.globalAlpha=1;break;
    case 'chain':glow('#fff27a');g.beginPath();g.moveTo(4,-17);g.lineTo(-7,1);g.lineTo(2,1);g.lineTo(-4,17);g.lineTo(9,-4);g.lineTo(0,-4);g.closePath();g.fill();break;
    case 'boom':glow('#ffb24d');g.lineWidth=6;g.beginPath();g.moveTo(-13,-10);g.quadraticCurveTo(0,-2,0,14);g.moveTo(13,-10);g.quadraticCurveTo(0,-2,0,14);g.stroke();break;
    case 'mine':glow('#ff5d5d');for(let i=0;i<8;i++){const a=i/8*TAU;g.beginPath();g.moveTo(Math.cos(a)*8,Math.sin(a)*8);g.lineTo(Math.cos(a)*15,Math.sin(a)*15);g.stroke()}g.beginPath();g.arc(0,0,9,0,TAU);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(0,0,3,0,TAU);g.fill();break;
    case 'aura':glow('#ff7a3c');g.beginPath();g.moveTo(0,-17);g.bezierCurveTo(12,-5,14,6,0,16);g.bezierCurveTo(-14,6,-12,-5,0,-17);g.fill();g.fillStyle='#ffe07a';g.beginPath();g.moveTo(0,-4);g.bezierCurveTo(6,2,6,8,0,13);g.bezierCurveTo(-6,8,-6,2,0,-4);g.fill();break;
    case 'speed':glow('#5dff8a');g.lineWidth=4;for(let i=-1;i<=1;i+=2){g.beginPath();g.moveTo(-8+i*7,-11);g.lineTo(2+i*7,0);g.lineTo(-8+i*7,11);g.stroke()}break;
    case 'heart':case 'food':glow('#ff4d6d');g.beginPath();g.moveTo(0,14);g.bezierCurveTo(-22,0,-12,-18,0,-7);g.bezierCurveTo(12,-18,22,0,0,14);g.fill();break;
    case 'magnet':glow('#ff4d6d');g.lineWidth=7;g.beginPath();g.arc(0,-2,10,Math.PI,0);g.stroke();g.beginPath();g.moveTo(-10,-2);g.lineTo(-10,10);g.moveTo(10,-2);g.lineTo(10,10);g.stroke();g.strokeStyle='#dfe';g.beginPath();g.moveTo(-10,8);g.lineTo(-10,13);g.moveTo(10,8);g.lineTo(10,13);g.stroke();break;
    case 'haste':glow('#4df3ff');g.beginPath();g.arc(0,0,15,0,TAU);g.stroke();g.beginPath();g.moveTo(0,0);g.lineTo(0,-10);g.moveTo(0,0);g.lineTo(7,4);g.stroke();break;
    case 'power':glow('#ff3c9d');g.beginPath();g.moveTo(0,-17);g.lineTo(11,-2);g.lineTo(4,-2);g.lineTo(4,15);g.lineTo(-4,15);g.lineTo(-4,-2);g.lineTo(-11,-2);g.closePath();g.fill();break;
    case 'regen':glow('#5dff8a');g.fillRect(-4,-15,8,30);g.fillRect(-15,-4,30,8);break;
    case 'area':glow('#ffd84d');g.lineWidth=3;g.strokeRect(-6,-6,12,12);for(const [dx,dy] of [[1,1],[1,-1],[-1,1],[-1,-1]]){g.beginPath();g.moveTo(dx*9,dy*9);g.lineTo(dx*16,dy*16);g.moveTo(dx*16,dy*16);g.lineTo(dx*10,dy*16);g.moveTo(dx*16,dy*16);g.lineTo(dx*16,dy*10);g.stroke()}break;
  }
  g.restore();
}

// ================== 게임 상태 ==================
let state='title'; // title, play, levelup, paused, dying, over, victory
let G=null, P=null;
let enemies=[],projs=[],ebullets=[],gems=[],pickups=[],mines=[],parts=[],texts=[],rings=[],zaps=[];
let shake=0, hurtFlash=0, banner=null, titleT=0;
const keys={};
let joy=null;

// 장식(바닥 무늬)
const decor=[];for(let i=0;i<700;i++)decor.push({x:rand(-WH,WH),y:rand(-WH,WH),r:rand(1,3.5),c:Math.random()<0.5?'#2a2260':'#1d3a5a',k:Math.random()<0.15?1:0});

function newGame(){
  G={t:0,kills:0,level:1,xp:0,need:xpNeed(1),spawnAcc:0,nextBoss:180,bossN:0,victory:false,pendingLv:0,dropCd:0,
     events:[{t:150,done:false},{t:270,done:false},{t:420,done:false},{t:540,done:false},{t:690,done:false}],timers:{},auraT:0,boss:null};
  P={x:0,y:0,r:14,hp:100,maxHp:100,baseSpd:210,inv:0,fx:1,fy:0,weapons:{bolt:1},passives:{},wOrder:['bolt'],pOrder:[],hurtT:0,moving:false,walk:0};
  enemies=[];projs=[];ebullets=[];gems=[];pickups=[];mines=[];parts=[];texts=[];rings=[];zaps=[];shake=0;hurtFlash=0;banner=null;
  showBanner('살아남아라! 보석을 모아 레벨 업!','#4df3ff');
}
function xpNeed(L){return Math.floor(3+(L-1)*2.6+Math.pow(L-1,1.9)*0.35)}
const pl=k=>P.passives[k]||0;
const spdMul=()=>1+0.08*pl('speed'), cdMul=()=>Math.pow(0.93,pl('haste')), dmgMul=()=>1+0.1*pl('power'), areaMul=()=>1+0.1*pl('area'), pickR=()=>110*(1+0.3*pl('magnet'));
function wstat(id){const l=P.weapons[id];return l?WEAPONS[id].lv[l-1]:null}

// ================== 공간 분할 그리드 ==================
const CELL=64,GOFF=WH+600,GN=Math.ceil(GOFF*2/CELL),grid=new Array(GN*GN);for(let i=0;i<grid.length;i++)grid[i]=[];
const usedCells=[];const QM=58; // 쿼리 여유 (최대 적 반경)
function cellOf(v){let c=((v+GOFF)/CELL)|0;return c<0?0:c>=GN?GN-1:c}
function buildGrid(){for(let i=0;i<usedCells.length;i++)grid[usedCells[i]].length=0;usedCells.length=0;
  for(let i=0;i<enemies.length;i++){const e=enemies[i];if(e.dead)continue;const k=cellOf(e.y)*GN+cellOf(e.x);const c=grid[k];if(c.length===0)usedCells.push(k);c.push(e)}}
function query(x,y,r,fn){const x0=cellOf(x-r-QM),x1=cellOf(x+r+QM),y0=cellOf(y-r-QM),y1=cellOf(y+r+QM);
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){const c=grid[cy*GN+cx];for(let i=0;i<c.length;i++){const e=c[i];if(e.dead)continue;const dx=e.x-x,dy=e.y-y,rr=r+e.r;if(dx*dx+dy*dy<rr*rr)fn(e,dx,dy)}}}

// ================== 적 생성 ==================
function viewHalf(){return {w:W/2/VS,h:H/2/VS}}
function hpMul(){const t=G.t;return 1+Math.max(0,t-50)/110+Math.pow(t/300,2.2)}
function spawnEnemy(type,x,y){
  const T=ETYPES[type];const m=type==='boss'?1:hpMul();
  const e={type,x,y,r:T.r,hp:T.hp*m,maxHp:T.hp*m,spd:T.spd*(type==='boss'?1:rand(0.9,1.1)),dmg:T.dmg*(1+G.t/420),xp:Math.round(T.xp*(1+G.t/600)),flash:0,kbx:0,kby:0,kbRes:T.kb||1,
    orbT:-9,auraT:-9,shootT:rand(1,2.5),st:0,stT:rand(2,4),dx:0,dy:0,rot:0,dead:false};
  if(type==='boss'){G.bossN++;e.hp=e.maxHp=T.hp*Math.pow(2.3,G.bossN-1)*(1+G.t/900);e.dmg=T.dmg*(1+G.bossN*0.25);e.shootT=2.5;e.dashT=5;G.boss=e}
  enemies.push(e);return e;
}
function offscreenPos(){const v=viewHalf();const a=rand(0,TAU);const d=Math.hypot(v.w,v.h)+rand(40,120);
  return {x:clamp(P.x+Math.cos(a)*d,-WH+20,WH-20),y:clamp(P.y+Math.sin(a)*d,-WH+20,WH-20)}}
function pickType(){const t=G.t;const w=[['grunt',10]];
  if(t>20)w.push(['bat',t<60?3:6]);if(t>60)w.push(['brute',Math.min(4,1+(t-60)/60)]);
  if(t>95)w.push(['spitter',Math.min(3.5,1+(t-95)/80)]);if(t>210)w.push(['charger',Math.min(3.5,1+(t-210)/80)]);
  let s=0;for(const x of w)s+=x[1];let r=Math.random()*s;for(const x of w){r-=x[1];if(r<=0)return x[0]}return 'grunt'}
function spawner(dt){
  const t=G.t;const rate=0.8+t*0.012+Math.pow(t/60,2)*0.3; const cap=Math.min(520,30+t*1.0);
  G.spawnAcc+=rate*dt;
  while(G.spawnAcc>=1){G.spawnAcc-=1;if(enemies.length>=cap)continue;
    const type=pickType();const p=offscreenPos();
    // 가끔 무리 지어 등장
    if(type==='grunt'&&Math.random()<Math.min(0.25,t/600)){for(let i=0;i<5;i++)spawnEnemy('grunt',p.x+rand(-40,40),p.y+rand(-40,40))}
    else spawnEnemy(type,p.x,p.y)}
  // 보스
  if(t>=G.nextBoss){G.nextBoss=(Math.floor(t/180)+1)*180;const p=offscreenPos();spawnEnemy('boss',p.x,p.y);showBanner('⚠ 보스 출현! ⚠','#ff2e63');S.boss();shake=Math.max(shake,10)}
  // 박쥐 떼 이벤트
  for(const ev of G.events){if(!ev.done&&t>=ev.t){ev.done=true;const n=Math.floor(14+t/9);const v=viewHalf();const d=Math.hypot(v.w,v.h)+30;
    for(let i=0;i<n;i++){const a=i/n*TAU;const e=spawnEnemy('bat',clamp(P.x+Math.cos(a)*d,-WH+10,WH-10),clamp(P.y+Math.sin(a)*d,-WH+10,WH-10));e.spd*=0.85}
    showBanner('박쥐 떼가 포위했다!','#ffd84d')}}
}

// ================== 이펙트 ==================
function burst(x,y,col,n,spd,life,size){for(let i=0;i<n;i++){if(parts.length>1400)parts.shift();const a=rand(0,TAU),s=rand(0.3,1)*spd;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*rand(0.6,1),max:life,c:col,s:size*rand(0.6,1.2)})}}
function dmgText(x,y,v,col,size){if(texts.length>140)texts.shift();texts.push({x:x+rand(-6,6),y:y-8,v:Math.round(v),c:col,s:size,life:0.7})}
function showBanner(txt,col){banner={txt,col,t:2.4}}
function addShake(v){shake=Math.min(18,Math.max(shake,v))}

// ================== 피해 처리 ==================
function hurtEnemy(e,dmg,kx,ky,kb){
  if(e.dead)return;const crit=Math.random()<0.1;dmg*=dmgMul()*(crit?2:1)*rand(0.9,1.1);
  e.hp-=dmg;e.flash=0.1;
  if(kb){const l=Math.hypot(kx,ky)||1;e.kbx+=kx/l*kb*e.kbRes;e.kby+=ky/l*kb*e.kbRes}
  dmgText(e.x,e.y-e.r,dmg,crit?'#ffd84d':'#ffffff',crit?20:14);
  if(e.hp<=0)killEnemy(e);else S.hit();
}
function killEnemy(e){
  e.dead=true;G.kills++;const T=ETYPES[e.type];
  burst(e.x,e.y,T.color,e.type==='boss'?80:(e.type==='brute'?18:9),e.type==='boss'?400:180,0.5,e.type==='boss'?5:3);
  S.kill();
  if(e.type==='boss'){addShake(16);G.boss=null;rings.push({x:e.x,y:e.y,r:0,max:300,t:0,dur:0.6,c:'#ff2e63'});
    for(let i=0;i<30;i++)dropGem(e.x+rand(-60,60),e.y+rand(-60,60),5);
    pickups.push({type:'chest',x:e.x,y:e.y,t:0});showBanner('보스 격파!','#ffd84d');
    if(!G.boss){for(const o of enemies)if(o.type==='boss'&&!o.dead)G.boss=o}
    return}
  dropGem(e.x,e.y,e.xp);
  if(G.dropCd<=0&&Math.random()<0.03){G.dropCd=10;const r=Math.random();pickups.push({type:r<0.7?'heart':r<0.88?'magnet':'bomb',x:e.x,y:e.y,t:0})}
}
function dropGem(x,y,v){if(gems.length>=450){let bi=0,bd=1e18;for(let i=0;i<gems.length;i++){const g=gems[i];if(g.mag)continue;const d=(g.x-x)**2+(g.y-y)**2;if(d<bd){bd=d;bi=i}}gems[bi].v+=v;return}gems.push({x,y,v,mag:false,sp:0})}
function hurtPlayer(d){
  if(P.inv>0||state!=='play')return;P.hp-=d;P.inv=0.5;hurtFlash=0.35;addShake(7);S.hurt();dmgText(P.x,P.y-20,d,'#ff4d6d',18);
  burst(P.x,P.y,'#ff4d6d',10,160,0.4,3);
  if(P.hp<=0){P.hp=0;die()}
}
function die(){state='dying';G.dyingT=1.6;burst(P.x,P.y,'#4df3ff',80,380,1.2,4);burst(P.x,P.y,'#ffffff',40,250,1,3);addShake(18);S.boom()}

// ================== 무기 ==================
function nearestN(x,y,n,maxD){const res=[];const md=maxD*maxD;
  for(const e of enemies){if(e.dead)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d>md)continue;
    if(res.length<n){res.push([d,e]);res.sort((a,b)=>a[0]-b[0])}else if(d<res[n-1][0]){res[n-1]=[d,e];res.sort((a,b)=>a[0]-b[0])}}
  return res.map(r=>r[1])}
function updateWeapons(dt){
  const T=G.timers,cm=cdMul(),am=areaMul();
  for(const id of P.wOrder){
    const s=wstat(id);if(T[id]===undefined)T[id]=0.3;
    if(s.cd!==undefined){T[id]-=dt;if(T[id]>0)continue;T[id]=s.cd*cm;}
    if(id==='bolt'){const v=viewHalf();const tg=nearestN(P.x,P.y,s.n,Math.min(460,Math.max(v.w,v.h)));if(!tg.length){T[id]=0.1;continue}
      for(let i=0;i<s.n;i++){const e=tg[i%tg.length];let a=Math.atan2(e.y-P.y,e.x-P.x)+(i>=tg.length?rand(-0.25,0.25):0);
        projs.push({k:'bolt',x:P.x,y:P.y,vx:Math.cos(a)*560,vy:Math.sin(a)*560,r:7,dmg:s.dmg,pierce:s.pierce,life:1.3,hit:new Set()})}S.shoot()}
    else if(id==='pulse'){const R=s.rad*am;rings.push({x:P.x,y:P.y,r:0,max:R,t:0,dur:0.35,c:'#8ff6ff',follow:true});S.pulse();
      query(P.x,P.y,R,(e,dx,dy)=>hurtEnemy(e,s.dmg,dx,dy,320))}
    else if(id==='chain'){const tg=nearestN(P.x,P.y,6,430);if(!tg.length){T[id]=0.2;continue}
      let cur=tg[(Math.random()*tg.length)|0];const hit=new Set();const pts=[{x:P.x,y:P.y-30}];
      for(let i=0;i<s.n&&cur;i++){hit.add(cur);pts.push({x:cur.x,y:cur.y});const cx=cur.x,cy=cur.y;hurtEnemy(cur,s.dmg,0,0,0);burst(cx,cy,'#fff27a',5,140,0.3,2.5);
        let bd=240*240,nx=null;for(const e of enemies){if(e.dead||hit.has(e))continue;const d=(e.x-cx)**2+(e.y-cy)**2;if(d<bd){bd=d;nx=e}}cur=nx}
      zaps.push({pts,t:0.25});S.zap()}
    else if(id==='boom'){const tg=nearestN(P.x,P.y,1,600);let base=tg.length?Math.atan2(tg[0].y-P.y,tg[0].x-P.x):Math.atan2(P.fy,P.fx);
      for(let i=0;i<s.n;i++){const a=base+(i-(s.n-1)/2)*0.5;projs.push({k:'boom',x:P.x,y:P.y,dx:Math.cos(a),dy:Math.sin(a),r:15*Math.sqrt(am),dmg:s.dmg,t:0,hm:new Map(),rot:0})}S.shoot()}
    else if(id==='mine'){if(mines.length>=30)mines.shift();mines.push({x:P.x+rand(-10,10),y:P.y+rand(-10,10),t:0,dmg:s.dmg,rad:s.rad*am,life:15})}
  }
  // 회전 칼날
  const os=wstat('orbit');if(os){const R=os.rad*am;for(let i=0;i<os.n;i++){const a=G.t*3.4+i/os.n*TAU;const bx=P.x+Math.cos(a)*R,by=P.y+Math.sin(a)*R;
    query(bx,by,13,(e)=>{if(G.t-e.orbT>0.4){e.orbT=G.t;hurtEnemy(e,os.dmg,e.x-P.x,e.y-P.y,140)}})}}
  // 불꽃 오라
  const as=wstat('aura');if(as){G.auraT-=dt;if(G.auraT<=0){G.auraT=0.45;query(P.x,P.y,as.rad*am,(e)=>{hurtEnemy(e,as.dmg,e.x-P.x,e.y-P.y,25);if(Math.random()<0.5)burst(e.x,e.y,'#ff7a3c',2,60,0.4,2.5)})}}
}

// ================== 업데이트 ==================
function gameUpdate(dt){
  G.t+=dt;G.dropCd-=dt;
  // 플레이어 이동
  let mx=0,my=0;
  if(keys.ArrowLeft||keys.KeyA)mx--;if(keys.ArrowRight||keys.KeyD)mx++;if(keys.ArrowUp||keys.KeyW)my--;if(keys.ArrowDown||keys.KeyS)my++;
  if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>6){const k=Math.min(1,l/55);mx=dx/l*k;my=dy/l*k}}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
  P.moving=ml>0.05;
  if(P.moving){const l=Math.hypot(mx,my)||1;P.fx=mx/l;P.fy=my/l;P.walk+=dt*10}
  if(state==='play'){const sp=P.baseSpd*spdMul();P.x=clamp(P.x+mx*sp*dt,-WH+P.r,WH-P.r);P.y=clamp(P.y+my*sp*dt,-WH+P.r,WH-P.r)}
  P.inv-=dt;if(pl('regen')&&P.hp>0)P.hp=Math.min(P.maxHp,P.hp+0.4*pl('regen')*dt);
  if(state==='play'){spawner(dt);updateWeapons(dt)}
  buildGrid();
  // 적 업데이트
  const v=viewHalf();const farD=Math.max(v.w,v.h)*1.25+350;
  for(const e of enemies){
    if(e.dead)continue;e.flash-=dt;
    let dx=P.x-e.x,dy=P.y-e.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    let vx=dx*e.spd,vy=dy*e.spd;
    if(e.type==='spitter'){ if(d<230){vx=-dx*e.spd;vy=-dy*e.spd}else if(d<330){vx=-dy*e.spd*0.6;vy=dx*e.spd*0.6}
      e.shootT-=dt;if(e.shootT<=0&&d<520&&state==='play'){e.shootT=rand(2.4,3.2);ebullets.push({x:e.x,y:e.y,vx:dx*210,vy:dy*210,r:6,dmg:e.dmg,life:4,k:'ebullet'})}}
    else if(e.type==='charger'){
      if(e.st===0){e.stT-=dt;if(e.stT<=0&&d<380){e.st=1;e.stT=0.55;e.dx=dx;e.dy=dy}}
      else if(e.st===1){vx=vy=0;e.stT-=dt;if(e.stT<=0){e.st=2;e.stT=0.6}}
      else{vx=e.dx*430;vy=e.dy*430;e.stT-=dt;if(e.stT<=0){e.st=0;e.stT=rand(2,3.5)}}
      e.rot=e.st===0?Math.atan2(dy,dx):Math.atan2(e.dy,e.dx)}
    else if(e.type==='boss'){
      e.rot+=dt*0.8;e.shootT-=dt;e.dashT-=dt;
      if(e.shootT<=0&&state==='play'){e.shootT=Math.max(1.8,3.4-G.bossN*0.3);const n=14+G.bossN*4,off=rand(0,TAU);
        for(let i=0;i<n;i++){const a=off+i/n*TAU;ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,r:8,dmg:e.dmg*0.6,life:5,k:'bossbullet'})}addShake(3)}
      if(e.st===0&&e.dashT<=0&&d<600){e.st=1;e.stT=0.8;e.dx=dx;e.dy=dy}
      if(e.st===1){vx=vy=0;e.stT-=dt;if(e.stT<=0){e.st=2;e.stT=0.7}}
      else if(e.st===2){vx=e.dx*460;vy=e.dy*460;e.stT-=dt;if(e.stT<=0){e.st=0;e.dashT=rand(5,7)}}

  ix=hx+14;iy+=40;for(const id of P.pOrder)slot(id,P.passives[id],'#4df3ff');
  // 보스 체력
  if(G.boss&&!G.boss.dead){const bw=Math.min(420,W*0.6),bx=W/2-bw/2,by=H-40;ctx.fillStyle='#000b';roundRect(bx,by,bw,16,8);ctx.fill();ctx.fillStyle='#ff2e63';roundRect(bx,by,Math.max(16,bw*G.boss.hp/G.boss.maxHp),16,8);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`900 14px ${FONT}`;ctx.textAlign='center';ctx.fillText(`보스 Lv.${G.bossN}`,W/2,by-12)}
  // 배너
  if(banner){const a=Math.min(1,banner.t*2,(2.4-banner.t)*4);ctx.globalAlpha=a;ctx.textAlign='center';let bf=W<500?28:40;ctx.font=`900 ${bf}px ${FONT}`;const bw2=ctx.measureText(banner.txt).width;if(bw2>W*0.92){bf=Math.floor(bf*W*0.92/bw2);ctx.font=`900 ${bf}px ${FONT}`}
    ctx.lineWidth=6;ctx.strokeStyle='#000';ctx.strokeText(banner.txt,W/2,H*0.28);ctx.fillStyle=banner.col;ctx.shadowColor=banner.col;ctx.shadowBlur=20;ctx.fillText(banner.txt,W/2,H*0.28);ctx.shadowBlur=0;ctx.globalAlpha=1}
  ctx.textBaseline='alphabetic';
}
function renderTitleBg(){
  titleT+=1/60;const gs=80,ox=(titleT*30)%gs,oy=(titleT*18)%gs;ctx.strokeStyle='#141233';ctx.lineWidth=2;ctx.beginPath();
  for(let x=-ox;x<W;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=-oy;y<H;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
  const ks=['grunt','bat','spitter','brute','charger'];
  for(let i=0;i<14;i++){const k=ks[i%5],s=SPR[k];const x=((i*173+titleT*(30+i*7))%(W+100))-50,y=(i*97%H)+Math.sin(titleT+i)*20;ctx.globalAlpha=0.35;ctx.drawImage(s.c,x-s.size/2,y-s.size/2,s.size,s.size)}ctx.globalAlpha=1;
}

// ================== 레벨 업 ==================
function upgradeOptions(){
  const opts=[];
  for(const id of P.wOrder)if(P.weapons[id]<MAXLV)opts.push({kind:'w',id,w:3});
  if(P.wOrder.length<MAX_WEAPONS)for(const id in WEAPONS)if(!P.weapons[id])opts.push({kind:'w',id,w:G.level<6?4:2.5});
  for(const id in PASSIVES)if(pl(id)<MAXLV)opts.push({kind:'p',id,w:2});
  const pick=[];while(pick.length<3&&opts.length){let s=0;for(const o of opts)s+=o.w;let r=Math.random()*s;let idx=0;for(;idx<opts.length;idx++){r-=opts[idx].w;if(r<=0)break}
    pick.push(opts.splice(Math.min(idx,opts.length-1),1)[0])}
  if(!pick.length)pick.push({kind:'f',id:'food'});
  return pick;
}
function describe(o){
  if(o.kind==='f')return {name:'회복 물약',lv:'',ds:'체력을 50 회복합니다.',tag:'n',tagT:'회복'};
  if(o.kind==='p'){const l=pl(o.id);return {name:PASSIVES[o.id].name,lv:l?`Lv.${l} → ${l+1}`:'새 능력!',ds:PASSIVES[o.id].desc,tag:l?'p':'n',tagT:l?'패시브 강화':'새 패시브'}}
  const Wd=WEAPONS[o.id],l=P.weapons[o.id]||0;
  if(!l)return {name:Wd.name,lv:'새 무기!',ds:Wd.desc,tag:'n',tagT:'새 무기'};
  const a=Wd.lv[l-1],b=Wd.lv[l];const ch=[];
  for(const k in b)if(a[k]!==b[k]){if(k==='cd')ch.push(`${STAT_LBL[k]} ${a[k]}초 → ${b[k]}초`);else if(k==='rad')ch.push(`${STAT_LBL[k]} +${Math.round((b[k]/a[k]-1)*100)}%`);else ch.push(`${STAT_LBL[k]} ${a[k]} → ${b[k]}`)}
  return {name:Wd.name,lv:`Lv.${l} → ${l+1}${l+1===MAXLV?' (최대)':''}`,ds:ch.join('<br>'),tag:'w',tagT:'무기 강화'};
}
let curOpts=[],lvOpenT=0;const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function openLevelUp(){
  state='levelup';S.level();curOpts=upgradeOptions();lvOpenT=performance.now();const box=$('cards');box.innerHTML='';
  curOpts.forEach((o,i)=>{const d=describe(o);const c=document.createElement('div');c.className='card';c.style.animationDelay=(i*0.07)+'s';
    const ic=makeCanvas(144,144);const g=ic.getContext('2d');g.translate(72,72);drawIcon(g,o.id,120);
    c.innerHTML=`<span class="tag ${d.tag}">${d.tagT}</span>`;c.appendChild(ic);
    c.insertAdjacentHTML('beforeend',`<div class="nm">${d.name}</div><div class="lv">${d.lv}</div><div class="ds">${d.ds}</div><div class="key">${isTouch?'탭하여 선택':`[${i+1}] 키로 선택`}</div>`);
    c.addEventListener('click',()=>chooseUpgrade(i));box.appendChild(c)});
  $('levelup').classList.add('show');
}
function chooseUpgrade(i){
  if(state!=='levelup'||performance.now()-lvOpenT<350)return;const o=curOpts[i];if(!o)return;
  if(o.kind==='w'){if(!P.weapons[o.id]){P.weapons[o.id]=1;P.wOrder.push(o.id)}else P.weapons[o.id]++}
  else if(o.kind==='p'){if(!P.passives[o.id]){P.passives[o.id]=1;P.pOrder.push(o.id)}else P.passives[o.id]++;
    if(o.id==='heart'){P.maxHp+=20;P.hp=Math.min(P.maxHp,P.hp+20)}}
  else {P.hp=Math.min(P.maxHp,P.hp+50)}
  $('levelup').classList.remove('show');state='play';burst(P.x,P.y,'#ffd84d',24,220,0.6,3);
  P.inv=Math.max(P.inv,0.6);
}

// ================== 화면 전환 ==================
function hideAll(){for(const id of ['title','levelup','pause','over','victory'])$(id).classList.remove('show')}
function startGame(){initAudio();hideAll();newGame();camX=P.x;camY=P.y;state='play';$('pbtn').style.display='flex'}
function toTitle(){hideAll();state='title';$('pbtn').style.display='none';$('bestTitle').textContent=bestText();$('title').classList.add('show')}
function pauseGame(){if(state!=='play')return;state='paused';joy=null;
  const inv=$('inv');inv.innerHTML='';for(const id of P.wOrder)inv.insertAdjacentHTML('beforeend',`<div>${WEAPONS[id].name} Lv.${P.weapons[id]}</div>`);
  for(const id of P.pOrder)inv.insertAdjacentHTML('beforeend',`<div style="border-color:#2a7bff">${PASSIVES[id].name} Lv.${P.passives[id]}</div>`);
  $('soundBtn').textContent='소리: '+(muted?'꺼짐':'켜짐');$('pause').classList.add('show')}
function resumeGame(){if(state!=='paused')return;$('pause').classList.remove('show');state='play'}
function recordBest(){const cur={time:Math.floor(G.t),kills:G.kills,level:G.level};
  const isNew=!best||cur.time>best.time||(cur.time===best.time&&cur.kills>best.kills);if(isNew){best=cur;saveBest(best)}return isNew}
function statsHTML(){return `생존 시간: <span>${fmtTime(G.t)}</span><br>처치 수: <span>${G.kills}</span><br>도달 레벨: <span>${G.level}</span>`}
function openGameOver(){state='over';$('over').querySelector('.big').textContent='게임 오버';$('pbtn').style.display='none';const isNew=recordBest();$('overStats').innerHTML=statsHTML();
  $('overRec').innerHTML=(isNew?'<div class="newrec">🎉 신기록 달성! 🎉</div>':'')+`<div class="best">${bestText()}</div>`;$('over').classList.add('show')}
function openVictory(){state='victory';joy=null;recordBest();$('vicStats').innerHTML=statsHTML();$('victory').classList.add('show');S.level()}
$('startBtn').onclick=startGame;$('retryBtn').onclick=startGame;$('restartBtn').onclick=startGame;
$('toTitleBtn').onclick=toTitle;$('overTitleBtn').onclick=toTitle;
$('resumeBtn').onclick=resumeGame;$('pbtn').onclick=e=>{e.stopPropagation();pauseGame()};
$('contBtn').onclick=()=>{$('victory').classList.remove('show');state='play';showBanner('무한 모드! 어디까지 버틸 수 있을까?','#ffd84d')};
$('vicTitleBtn').onclick=()=>{recordBest();$('victory').classList.remove('show');openGameOver();$('over').querySelector('.big').textContent='생존 완료!'};
$('soundBtn').onclick=()=>{muted=!muted;$('soundBtn').textContent='소리: '+(muted?'꺼짐':'켜짐')};

// ================== 입력 ==================
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space'||e.code==='Escape'||e.code==='KeyP'){if(state==='play')pauseGame();else if(state==='paused')resumeGame();else if(state==='title'&&e.code==='Space')startGame()}
  if(e.code==='Enter'){if(state==='title')startGame();else if(state==='over')startGame()}
  if(e.code==='KeyM')muted=!muted;
  if(state==='levelup'){const n={Digit1:0,Digit2:1,Digit3:2,Numpad1:0,Numpad2:1,Numpad3:2}[e.code];if(n!==undefined)chooseUpgrade(n)}
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;pauseGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
cv.addEventListener('pointerdown',e=>{initAudio();if(state!=='play')return;joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(joy&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY}});
const endJoy=e=>{if(joy&&e.pointerId===joy.id)joy=null};cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
if('ontouchstart' in window)document.querySelector('#title .box').insertAdjacentHTML('beforeend','<div class="hint">📱 터치: 화면을 누른 채 드래그하면 가상 조이스틱으로 이동합니다</div>');

// ================== 메인 루프 ==================
let workMs=0,last=performance.now(),fpsAcc=0,fpsN=0,fps=60;
function frame(now){
  let dt=(now-last)/1000;last=now;const w0=performance.now();fpsAcc+=dt;fpsN++;if(fpsAcc>=0.5){fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0}
  dt=Math.min(dt,0.05);
  try{
    if(state==='play')gameUpdate(dt);
    else if(state==='dying'){gameUpdate(dt*0.3);G.dyingT-=dt;if(G.dyingT<=0)openGameOver()}
    if(state!=='paused'&&state!=='levelup'&&state!=='victory')fxUpdate(state==='dying'?dt*0.5:dt);
    render();workMs=workMs*0.9+(performance.now()-w0)*0.1;
  }catch(err){console.error(err)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// 디버그/테스트용 훅
window.__game={get state(){return state},get G(){return G},get P(){return P},get enemies(){return enemies},get gems(){return gems},get fps(){return fps},get workMs(){return workMs},spawnEnemy:(t,x,y)=>spawnEnemy(t,x,y),chooseUpgrade,keys,sim:(dt)=>{if(state==='play'||state==='dying'){gameUpdate(dt);fxUpdate(dt)}},get opts(){return curOpts},set lvT(v){lvOpenT=v}};
</script>
</body>
